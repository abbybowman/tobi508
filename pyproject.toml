[project]
name = "tobi508"
version = "0.1.0"
description = "MCP server that runs parts of the DHS Trusted Tester 5.1.3 web test process in Chrome and reports agent-assisted findings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "numpy>=2.0",
    "pillow>=13.0.0",
    "playwright==1.63.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
# Lets you run the server with `uv run tobi508`.
tobi508 = "tobi508.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tobi508"]

[dependency-groups]
# Dev + eval-only deps. Install with `uv sync --group dev`.
# The Phoenix evaluation harness (see eval/) is not scaffolded in this template
# on purpose — add these when you build it per the mcp-eval skill.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents"]
# Don't reformat Python code fences inside Markdown docs (they're illustrative
# snippets, not runnable modules).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# F34 (600 links) with the time limit off takes minutes: run it with -m slow.
markers = ["slow: long-running fixture, excluded by default"]
# Tests run in parallel (pytest-xdist): one worker per CPU. Each test has its
# own run folder, servers and browser; ACT scores are written per worker.
# -n 8 on 4 CPUs measured 3m51s vs 5m32s at -n 4 and 20m17s serial; more
# workers than CPUs risks timing noise in the settle rule. -n0 for one test.
addopts = "-m 'not slow' -n auto"

[tool.ruff.lint.per-file-ignores]
# Embedded JavaScript strings are kept readable rather than wrapped.
"src/tobi508/traverse.py" = ["E501"]
# Spec row tables and question wording stay on one line each.
"src/tobi508/checks/t4c.py" = ["E501"]
"src/tobi508/checks/t5d.py" = ["E501"]
"src/tobi508/forms.py" = ["E501"]
"src/tobi508/andi.py" = ["E501"]
"src/tobi508/motion.py" = ["E501"]
"src/tobi508/checks/t2b.py" = ["E501"]
"src/tobi508/checks/t2a.py" = ["E501"]
"src/tobi508/flashcap.py" = ["E501"]
"src/tobi508/checks/t3a.py" = ["E501"]
# Scratch experiments kept as research evidence (not imported, not tests):
# embedded JavaScript, and helpers shared by exec between scripts.
"docs/research/**" = ["E501", "E741", "F821", "F841"]
"src/tobi508/labels.py" = ["E501"]
"src/tobi508/checks/t5a.py" = ["E501"]
"src/tobi508/checks/t5c.py" = ["E501"]
"src/tobi508/checks/t5f.py" = ["E501"]
"src/tobi508/checks/t5g.py" = ["E501"]
"src/tobi508/site.py" = ["E501"]
"src/tobi508/checks/t9a.py" = ["E501"]
"src/tobi508/checks/t9b.py" = ["E501"]
"src/tobi508/checks/t9c.py" = ["E501"]
"src/tobi508/checks/t19a.py" = ["E501"]
"src/tobi508/checks/t5b.py" = ["E501"]
"src/tobi508/checks/t5h.py" = ["E501"]
"src/tobi508/checks/t4e.py" = ["E501"]
"src/tobi508/checks/t4d.py" = ["E501"]
"src/tobi508/checks/t4f.py" = ["E501"]
"src/tobi508/checks/t4a.py" = ["E501"]
"src/tobi508/checks/t4b.py" = ["E501"]
