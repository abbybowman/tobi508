<!doctype html><html lang=en><head><title>shift</title><style>a{display:block;margin:30px 0;color:#00e}a:focus{outline:2px solid #c00}#a1:focus{outline:none}</style></head><body>
<div id=sp style="height:0"></div>
<a href="#1" id=a1>First link</a>
<a href="#2" id=a2>Second link</a>
<a href="#3">Third link</a>
<script>document.getElementById('a2').addEventListener('focus',()=>{document.getElementById('sp').style.height='50px'},{once:true})</script>
</body></html>
