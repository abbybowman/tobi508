<!doctype html><html lang="en"><head><title>Sign up</title></head><body><main><h1>Sign up</h1>
<form id="f" novalidate><label>Email <input name="email" id="e"></label><label>Zip <input name="zip" id="z"></label><button type="submit">Submit</button></form>
<error-box id="eb"></error-box>
<script>
customElements.define('error-box',class extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'});}});

 document.getElementById('eb').shadowRoot.innerHTML='<div role="alert">Error.</div>';});
</script></main></body></html>
