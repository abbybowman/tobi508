<!doctype html><html lang="en"><head><title>Sign up</title><style>.w{border:2px solid #ccc;padding:4px;display:inline-block}.w.bad{border-color:red;background:#fdd}</style></head><body><main><h1>Sign up</h1>
<form id="f" novalidate><div class="w" id="w1"><label>Email <input name="email" id="e" style="border:0;outline:0"></label></div><div class="w"><label>Zip <input name="zip" id="z" style="border:0;outline:0"></label></div><button type="submit">Submit</button></form>
<script>document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();document.querySelectorAll('.w').forEach(function(w){w.classList.add('bad')});});</script></main></body></html>
