<!doctype html><html lang="en"><head><title>Light click</title></head><body>
<h1>Widgets</h1>
<p><a href="#x">A link</a></p>
<div><span id="go" style="display:inline-block;padding:8px;border:1px solid">Show details</span></div>
<p id="out"></p>
<script>
document.getElementById('go').addEventListener('click', () => { document.getElementById('out').textContent = 'Details shown: 42'; });
</script>
</body></html>
