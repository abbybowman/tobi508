<!doctype html><html lang="en"><head><title>Full viewport slow gradient canvas</title><style>
html,body{margin:0}
canvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:0}
main{position:relative;z-index:1;color:#fff;padding:20px}
</style></head><body><canvas id="c" width="320" height="180"></canvas><main><h1>Welcome</h1><p>Static text over an animated hero canvas.</p><button>Learn more</button></main>
<script>const c=document.getElementById('c'),x=c.getContext('2d');let t=0;
function f(){t+=0.02;const g=x.createLinearGradient(0,0,320,180);g.addColorStop(0,`hsl(${(t*60)%360},70%,40%)`);g.addColorStop(1,`hsl(${(t*60+120)%360},70%,40%)`);x.fillStyle=g;x.fillRect(0,0,320,180);requestAnimationFrame(f)}f();</script>
</body></html>
