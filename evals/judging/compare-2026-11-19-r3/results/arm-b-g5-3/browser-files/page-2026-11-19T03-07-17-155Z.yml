          - generic: The pavement, asphalt, and other impervious surfaces found in cities act as both conduits and sources of pollution. Rather than being absorbed by soil or vegetation, rain that falls on roadways and other hard surfaces tends to flow rapidly toward gutters and urban streams. In the process, that water picks up nitrogen, phosphorous, and a range of oils, salts, heavy metals, pharmaceuticals, and other pollutants. The rapid flow also means that urban stream banks tend to erode rapidly and yield large amounts of sediment pollution.
