        - generic [ref=e90]:
          - heading "FITS Verifier" [level=1] [ref=e94]
          - generic [ref=e95]: The FITS File Verifier web tool checks whether your Flexible Image Transport System (FITS) file meets the standards for this common astronomy data format.
    - generic:
      - complementary "Page messages"
    - main [ref=e102]:
      - article [ref=e106]:
        - generic [ref=e113]:
          - generic [ref=e117]:
            - paragraph [ref=e118]:
              - text: Use this web form to verify the format of any Flexible Image Transport System (FITS) data file on your local computer or on the web. The file will be uploaded and scanned for any
              - link "violations" [ref=e119] [cursor=pointer]:
                - /url: "#errors"
              - text: of the requirements specified in the
              - link "FITS Standard" [ref=e120] [cursor=pointer]:
                - /url: /fits/documentation/standard
              - text: document. You may also
              - link "download this FITSverify program" [ref=e121] [cursor=pointer]:
                - /url: http://heasarc.gsfc.nasa.gov/docs/software/ftools/fitsverify
              - text: and run it locally.
            - paragraph [ref=e122]:
              - text: The file size limit for this tool is 100 MB. The FITS Verifier was created by NASA's High Energy Astrophysics Science Archive Research Center (
              - link "HEASARC" [ref=e123] [cursor=pointer]:
                - /url: https://heasarc.gsfc.nasa.gov/
              - text: ).
          - generic [ref=e131]:
            - heading "HEASARC FITS Verifier" [level=2] [ref=e132]
            - paragraph [ref=e133]:
              - text: Select a FITS file to verify it directly in your browser.
              - emphasis [ref=e134]: Files are processed locally and never uploaded.
            - generic [ref=e135]:
              - button "Choose File" [ref=e136]
              - generic [ref=e138] [cursor=pointer]:
                - checkbox "Print Header Contents (-l)" [ref=e139]
                - text: Print Header Contents (-l)
            - heading "Verification Report:" [level=2] [ref=e140]
            - generic [ref=e141]: Ready. Please select a FITS file to verify.
          - generic [ref=e145]:
            - paragraph [ref=e146]:
              - text: The
              - link "fv FITS file viewer and editor" [ref=e147] [cursor=pointer]:
                - /url: http://heasarc.gsfc.nasa.gov/docs/software/ftools/fv/
              - text: may be used to examine the contents of the FITS file in greater detail.
            - paragraph [ref=e148]:
              - text: This form uses the
              - link "FITSverify utility program" [ref=e149] [cursor=pointer]:
                - /url: http://heasarc.gsfc.nasa.gov/docs/software/ftools/fitsverify
              - text: that is freely available from
              - link "HEASARC" [ref=e150] [cursor=pointer]:
                - /url: http://heasarc.gsfc.nasa.gov/
              - text: . When installed locally, FITSverify may be used to verify multiple files at once in batch mode.
            - paragraph [ref=e151]:
              - text: Please report any problems or questions about FITSverify to the
              - link "ftools help desk" [ref=e152] [cursor=pointer]:
                - /url: http://heasarc.gsfc.nasa.gov/cgi-bin/ftoolshelp
              - text: .
            - paragraph [ref=e153]
            - separator [ref=e154]
          - generic [ref=e158]:
            - heading "Error List" [level=2] [ref=e159]
            - paragraph [ref=e160]:
              - text: FITSverify tests whether a FITS file meets the requirements of Version 3.0 of the
              - link "FITS Standard" [ref=e161] [cursor=pointer]:
                - /url: /fits/documentation/standard
              - text: ". It will test for any of the following error or warning conditions:"
            - heading "Error Conditions" [level=3] [ref=e162]
            - list [ref=e163]:
              - listitem [ref=e164]: Mandatory keyword not present or out of order
              - listitem [ref=e165]: Mandatory keyword has wrong datatype or illegal value
              - listitem [ref=e166]: END header keyword is not present
              - listitem [ref=e167]: Sum of table column widths is inconsistent with NAXIS1 value
              - listitem [ref=e168]: BLANK keyword present in image with floating-point datatype
              - listitem [ref=e169]: TNULLn keyword present for floating-point binary table column
              - listitem [ref=e170]: Bit column has non-zero fill bits or is not left adjusted
              - listitem [ref=e171]: ASCII (American Standard Code for Information Interchange) TABLE column contains illegal value inconsistent with TFORMn
              - listitem [ref=e172]: Address to a variable length array not within the data heap
              - listitem [ref=e173]: Extraneous bytes in the FITS file following the last HDU (Header Data Unit)
              - listitem [ref=e174]: Mandatory keyword values not expressed in fixed format
              - listitem [ref=e175]: Mandatory keyword duplicated elsewhere in the header
              - listitem [ref=e176]: Header contains illegal ASCII character (not ASCII 32 - 126)
              - listitem [ref=e177]: Keyword name contains illegal character
              - listitem [ref=e178]: Keyword value field has illegal format
              - listitem [ref=e179]: Value and comment fields not separated by a slash character
              - listitem [ref=e180]: END keyword not filled with blanks in columns 9 - 80
              - listitem [ref=e181]: Reserved keyword with wrong datatype or illegal value
              - listitem [ref=e182]: XTENSION keyword in the primary array
              - listitem [ref=e183]: Column related keyword (TFIELDS, TTYPEn,TFORMn, etc.) in an image
              - listitem [ref=e184]: SIMPLE, EXTEND, or BLOCKED keyword in any extension
              - listitem [ref=e185]: BSCALE, BZERO, BUNIT, BLANK, DATAMAX, DATAMIN keywords in a table
              - listitem [ref=e186]: Table WCS keywords (TCTYPn, TCRPXn, TCRVLn, etc.) in an image
              - listitem [ref=e187]: TDIMn or THEAP keyword in an ASCII table
              - listitem [ref=e188]: TBCOLn keyword in a Binary table
              - listitem [ref=e189]: THEAP keyword in a binary table that has PCOUNT = 0
              - listitem [ref=e190]: XTENSION, TFORMn, TDISPn or TDIMn value contains leading space(s)
              - listitem [ref=e191]: WCSAXES keyword appears after other WCS keywords
              - listitem [ref=e192]: Index of any WCS (World Coordinate Systems) keyword (CRPIXn, CRVALn, etc.) greater than value of WCSNAXES
              - listitem [ref=e193]: Index of any table column descriptor keyword (TTYPEn, TFORMn, etc.) greater than value of TFIELDS
              - listitem [ref=e194]: TSCALn or TZEROn present for an ASCII, logical, or Bit column
              - listitem [ref=e195]: TDISPn value is inconsistent with the column datatype
              - listitem [ref=e196]: Length of a variable length array greater than the maximum length as given by the TFORMn keyword
              - listitem [ref=e197]: ASCII table floating-point column value does not have decimal point(*)
              - listitem [ref=e198]: ASCII table numeric column value has embedded space character
              - listitem [ref=e199]: Logical column contains illegal value not equal to 'T', 'F', or 0
              - listitem [ref=e200]: Character string column contains non-ASCII text character
              - listitem [ref=e201]: Header fill bytes not all blanks
              - listitem [ref=e202]: Data fill bytes not all blanks in ASCII tables or all zeros in any other type of HDU
              - listitem [ref=e203]: Gaps between defined ASCII table columns contain characters with ASCII value > 127
            - heading "Warning Conditions" [level=3] [ref=e204]
            - list [ref=e205]:
              - listitem [ref=e206]: SIMPLE = F
              - listitem [ref=e207]: Presence of deprecated keywords BLOCKED or EPOCH
              - listitem [ref=e208]: 2 HDUs have identical EXTNAME, EXTVER, and EXTLEVEL values
              - listitem [ref=e209]: BSCALE or TSCALn value = 0.
              - listitem [ref=e210]: BLANK OR TNULLn value exceeds the legal range
              - listitem [ref=e211]: TFORMn has 'rAw' format and r is not a multiple of w
              - listitem [ref=e212]: DATE = 'dd/mm/yy' and yy is less than 10 (Y2K problem??)
              - listitem [ref=e213]: Index of any WCS keyword (CRPIXn, CRVALn, etc.) greater than value of NAXIS, if the WCSAXES keyword is not present
              - listitem [ref=e214]: Duplicated keyword (except COMMENT, HISTORY, blank, etc.)
              - listitem [ref=e215]: Column name (TTYPEn) does not exist or contains characters other than letter, digit and underscore
              - listitem [ref=e216]: Binary table has PCOUNT > 0, but no variable-length array columns
              - listitem [ref=e217]: Calculated checksum inconsistent with CHECKSUM or DATASUM keyword
