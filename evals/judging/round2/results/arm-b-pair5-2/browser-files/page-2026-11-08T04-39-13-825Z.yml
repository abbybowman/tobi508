                  - 'img "This visualization shows 294 gamma-ray pulsars, first plotted on an image of the entire starry sky as seen from Earth and then transitioning to a view from above our galaxy. The symbols show different types of pulsars. Young pulsars blink in real time except for the Crab, which pulses slower because its rate is only slightly lower than the video frame rate. Millisecond pulsars remain steady, pulsing too quickly to see. The Crab, Vela, and Geminga were among the 11 gamma-ray pulsars known before Fermi launched. Other notable objects are also highlighted. Distances are shown in light-years (abbreviated ly).Credit: NASA’s Goddard Space Flight CenterMusic: \"Fascination\" from Universal Production MusicWatch this video on the NASA.gov Video YouTube channel.Complete transcript available." [ref=e195]'
