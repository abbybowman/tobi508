      - generic [ref=e82]:
        - paragraph [ref=e85]:
          - text: Before NASA’s Fermi Gamma-ray Space Telescope launched in 2008, only a handful of pulsars, including the Crab, Vela, and Geminga, were known to emit gamma-rays, the highest-energy form of light. Shown here are 294 gamma-ray pulsars detected by Fermi. Young pulsars, formed when massive stars explode, are the slowest rotators, typically spinning about 10 times a second. Paradoxically, their older siblings, called millisecond pulsars (MSPs), spin much faster, up to hundreds of times a second, thanks to the effects of a stream of matter pulled from a companion star. In spider systems, the companion is all but consumed. The most energetic spiders may fully evaporate their companions, leaving behind only an isolated MSP. Studying pulsars provides insights into the interplay of gravity, radiation, and magnetic fields with matter in the most extreme state we can observe directly.The
          - link "WorldWide Telescope" [ref=e86] [cursor=pointer]:
            - /url: https://worldwidetelescope.org/home/
          - text: is a tool for showcasing astronomical data and knowledge. It’s not a physical telescope — it’s a suite of free and open source software and data sets that combine to create stunning scientific visualizations and stories.
