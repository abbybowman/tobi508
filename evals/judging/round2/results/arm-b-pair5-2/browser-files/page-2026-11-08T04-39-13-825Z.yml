              - paragraph [ref=e275]: NASA's newest observatory, the Gamma-Ray Large Area Space Telescope (GLAST), has begun its mission of exploring the universe in high-energy gamma rays. The spacecraft and its revolutionary instruments passed their orbital checkout with flying colors. NASA announced today that GLAST has been renamed the Fermi Gamma-ray Space Telescope. The new name honors Prof. Enrico Fermi (1901 - 1954), a pioneer in high-energy physics. Scientists expect Fermi will discover many new pulsars in our own galaxy, reveal powerful processes near supermassive black holes at the cores of thousands of active galaxies across, and enable a search for signs of new physical laws. ||
