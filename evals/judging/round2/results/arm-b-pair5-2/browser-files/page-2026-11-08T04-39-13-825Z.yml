              - paragraph [ref=e295]: The GLAST mission launched on June 11, 2008 and has been returning remarkable and revolutionary discoveries ever since. Recently renamed to the Fermi Space Telescope, after Nobel Prize winner Enrico Fermi, the mission is expected to discover dozens of new pulsars within its first year alone. The telescope is also giving us new insights into gamma-ray bursts and the massive jets that erupt from distant galaxies. Stay tuned — the mission of NASA's Fermi telescope is just getting started. ||
