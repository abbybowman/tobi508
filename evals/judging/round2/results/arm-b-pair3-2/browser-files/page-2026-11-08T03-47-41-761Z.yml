              - paragraph [ref=e472]: The sun erupted late on January 22, 2012 with an M8.7 class flare, an earth-directed coronal mass ejection (CME), and a burst of fast moving, highly energetic protons known as a "solar energetic particle" event. The latter has caused the strongest solar radiation storm since September 2005 according to NOAA's Space Weather Prediction Center. ||
