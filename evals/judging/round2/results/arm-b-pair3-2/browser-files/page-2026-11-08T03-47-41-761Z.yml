              - paragraph [ref=e572]: "Brighter than a shimmering ghost, faster than the flick of a black cat’s tail, the Sun cast a spell in our direction, just in time for Halloween. This imagery captured by NASA’s Solar Dynamics Observatory covers a busy few days of activity between Oct. 25-28 that ended with a significant solar flare. From late afternoon Oct. 25 through mid-morning Oct. 26, an active region on the left limb of the Sun flickered with a series of small flares and petal-like eruptions of solar material. Meanwhile, the Sun was sporting more active regions at its lower center, directly facing Earth. On Oct. 28, the biggest of these released a significant flare, which peaked at 11:35 a.m. EDT. Credit: NASA/GSFC/SDOMusic: \"Immersion\" from Above and Below. Written and produced by Lars LeonhardWatch this video on the NASA Goddard YouTube channel.Complete transcript available. || ActiveOctober_Still.jpg (1920x1080) [956.2 KB] || 13982_ActiveOctober_ProRes_1920x1080_2997.mov (1920x1080) [2.4 GB] || 13982_ActiveOctober_1080_Best.mp4 (1920x1080) [436.2 MB] || 13982_ActiveOctober_1080.mp4 (1920x1080) [188.1 MB] || 13982_ActiveOctober_1080_Best.webm (1920x1080) [19.7 MB] || 13982_ActiveOctober_SRT_Captions.en_US.srt [574 bytes] || 13982_ActiveOctober_SRT_Captions.en_US.vtt [587 bytes] ||"
