          - paragraph [ref=e80]: On May 14, 2024, the Sun emitted a strong solar flare. This solar flare is the largest of Solar Cycle 25 and is classified as an X8.7 flare. X-class denotes the most intense flares, while the number provides more information about its strength.
          - paragraph
          - paragraph [ref=e81]: A solar flare is an intense burst of radiation, or light, on the Sun. Flares are our solar system’s most powerful explosive events. Light only takes about 8 minutes to travel from the Sun to Earth, so that’s how long it would take the energy from a flare to reach our planet. Stronger solar flares — those rated class M5 or above — can have impacts on technology that depends on Earth’s ionosphere (our electrically charged upper atmosphere), like high-frequency radio used for navigation and GPS.
          - paragraph
          - paragraph [ref=e82]: NASA’s Solar Dynamics Observatory (SDO) captured these images of the flare, which peaked at 12:51 p.m. ET on May 14. The X8.7 flare appears on the lower right edge of the Sun. (A small eruption appears afterward in the upper left.) SDO sees the Sun in more than 10 distinct wavelengths of light, showing solar material at different temperatures. Different wavelengths are shown in this video to highlight different features of the flare.
