              - paragraph [ref=e387]: With a view 100 times bigger than that of NASA’s Hubble Space Telescope, the Wide Field Infrared Survey Telescope WFIRST will aid researchers in their efforts to unravel the secrets of dark energy and dark matter, and explore the evolution of the cosmos. It also will discover new worlds outside our solar system and advance the search for worlds that could be suitable for life. Scientists participating in the mission discuss the spacecraft, the science, and its potential. Slated to launch in the mid-2020s, the observatory will operate at a gravitational balance point known as Earth-sun L2, which is located about 930,000 miles from Earth and directly opposite the sun.Watch this video on the NASA Goddard YouTube channel.Complete transcript available. || WfirstAfta-PrintStill2_print.jpg (1024x576) [79.3 KB] || WfirstAfta-PrintStill2.png (3840x2160) [4.7 MB] || WfirstAfta-PrintStill2_searchweb.png (320x180) [59.2 KB] || WfirstAfta-PrintStill2_thm.png (80x40) [4.6 KB] || 12153_WFIRST_Best_Both_Worlds_ProRes_1280x720_5994.mov (1280x720) [3.1 GB] || 12153_WFIRST_Best_Both_Worlds_H264_Best_1280x720_5994.mov (1280x720) [1.7 GB] || 12153_WFIRST_Best_Both_Worlds_FINAL_youtube_hq.mov (1280x720) [671.5 MB] || 12153_WFIRST_Best_Both_Worlds_H264_Good_1280x720_2997.mov (1280x720) [174.0 MB] || 12153_WFIRST_Best_Both_Worlds_FINAL_appletv.m4v (1280x720) [122.3 MB] || 12153_WFIRST_Best_Both_Worlds_H264_Good_1280x720_2997.webm (1280x720) [25.0 MB] || 12153_WFIRST_Best_Both_Worlds_FINAL_appletv_subtitles.m4v (1280x720) [122.4 MB] || 12153_WFIRST_BestBoth_SRT_Captions.en_US.srt [4.6 KB] || 12153_WFIRST_BestBoth_SRT_Captions.en_US.vtt [4.4 KB] || NASA_PODCAST_12153_WFIRST_Best_Both_Worlds_FINAL_ipod_sm.mp4 (320x240) [41.6 MB] ||
