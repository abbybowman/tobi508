              - link [ref=e372] [cursor=pointer]:
                - /url: /12153/
                - img "With a view 100 times bigger than that of NASA’s Hubble Space Telescope, the Wide Field Infrared Survey Telescope WFIRST will aid researchers in their efforts to unravel the secrets of dark energy and dark matter, and explore the evolution of the cosmos. It also will discover new worlds outside our solar system and advance the search for worlds that could be suitable for life. Scientists participating in the mission discuss the spacecraft, the science, and its potential. Slated to launch in the mid-2020s, the observatory will operate at a gravitational balance point known as Earth-sun L2, which is located about 930,000 miles from Earth and directly opposite the sun.Watch this video on the NASA Goddard YouTube channel.Complete transcript available." [ref=e374]
