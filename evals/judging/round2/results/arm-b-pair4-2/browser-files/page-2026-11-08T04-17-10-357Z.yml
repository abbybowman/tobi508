              - paragraph [ref=f1e270]: This bell curve graph shows how the distribution of Northern Hemisphere summer temperature anomalies has shifted toward an increase in hot summers. The seasonal mean temperature for the entire base period of 1951-1980 is plotted at the top of the bell curve. Decreasing in frequency to the right are what are defined as "hot" anomalies (between 1 and 2 standard deviations from the norm), "very hot" anomalies (between 2 and 3 standard deviations) and "extremely hot" anomalies (greater than 3 standard deviations). The anomalies fall off to the left in mirror-image categories of "cold, "very cold" and "extremely cold." The range between the .43 and -.43 standard deviation marks represent "normal" temperatures. As the graph moves forward in time, the bell curve shifts to the right, representing an increase in the frequency of the various hot anomalies. It also gets wider and shorter, representing a wider range of temperature extremes. As the graph moves beyond 1980, the temperatures are still compared to the seasonal mean of the 1951-1980 base period, so that as it reaches the 21st century, there is a far greater frequency of temperatures that once fell 3 standard deviations beyond the mean. As the graphic indicates, each bell curve shown through the time series represents the distribution of anomalies over an 11-year period. ||
