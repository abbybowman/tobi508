              - paragraph [ref=f1e250]: This visualization shows a flat map of the Earth with summertime temperature anomalies for the Northern Hemisphere. This analysis compares observed seasonal mean temperatures (June-July-August) to the seasonal mean temperatures during a base period from 1951 to 1980.The colors correspond to statistical standard deviations from the seasonal mean of the base period. The hot anomalies are defined as "hot" (orange); "very hot" (red); and "extremely hot" (bown). The cold anomalies are defined as "cold" (light blue); "very cold" (dark blue); and "extremely cold" (purple). Regions in white fall within the normal category.The visualization shows the increasing occurrence, in particular, of "extremely hot" temperatures since 2000. While these temperatures were experienced by less than 1 percent of land areas during the base period, about 10 percent of land areas have experienced these summer temperatures since 2000. These extreme heat events include the heat waves in Europe in 2003, Russia in 2010, and Texas and Oklahoma in 2011.No data is shown below the equator because this only uses Northern Hemisphere June-July-August temperature data. The visualization shows the data for 1955, 1965, 1975 and then 1985-2011. ||
