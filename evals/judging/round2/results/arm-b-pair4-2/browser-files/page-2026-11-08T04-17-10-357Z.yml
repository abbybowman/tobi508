              - paragraph [ref=f1e230]: Each year, scientists at NASA Goddard Institute for Space Studies analyze global temperature data. A rapid warming trend has occurred over the past 30 years, and the eight hottest years on the GISS record have occurred in the past decade. 2005 is the hottest year on record, and 2007 is tied with 1998 for second place. The Earth is experiencing the warmest level of the current interglacial period, or interval between ice ages, which has lasted nearly 12,000 years. This color-coded map displays a long term progression of changing global surface temperatures, from 1881 to 2007. Dark red indicates the greatest warming and dark blue indicates the greatest cooling. ||
