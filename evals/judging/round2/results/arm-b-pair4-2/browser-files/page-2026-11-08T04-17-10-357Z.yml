            - paragraph [ref=f1e90]: An embedded version of the NASA Climate Legacies. The standalone version is available at https://svs.gsfc.nasa.gov/webapps/climate-legacies.
        - paragraph [ref=f1e93]: The NASA Climate Legacies is an interactive web application designed to visualize the impacts of climate change across generations by allowing users to make personalized timelines. Users can explore how historical and projected climate conditions affect different generations differently by comparing colored silhouettes along the timeline based on their dates of birth. The application offers multiple modes, including a "white background" mode displaying a timeline of climate stripes from 1900 to 2100 and a "black background" mode with generational icons aligned by age for easier cross-generation comparison.The user interface contains background information about the graphics and the science behind them. The application also provides in-depth information on the history of the climate stripes themselves. The "Your Timeline" section allows users to add and view individuals' climate legacies based on their year of birth, providing a clear visualization of how different generations experience climate change.The project is a collaborative effort that credits the work of scientists, graphic designers, and visualization experts who have contributed to its development and incorporate data from the IPCC Sixth Assessment Report.
