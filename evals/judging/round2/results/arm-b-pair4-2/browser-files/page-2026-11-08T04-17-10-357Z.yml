              - paragraph [ref=f1e312]: The Clouds and the Earth’s Energy Radiant System (CERES) instrument is a key component of NASA’s Earth Observing System, with six active CERES instruments on satellites orbiting Earth and taking data. For Earth’s temperature to be stable over long periods of time, absorbed solar and emitted thermal radiation must be equal. Increases in greenhouse gases, like carbon dioxide and methane, trap emitted thermal radiation from the surface and reduce how much is lost to space, resulting in a net surplus of energy into the Earth system. Most of the extra energy ends up being stored as heat in the ocean and the remainder warms the atmosphere and land, and melts snow and ice. As a consequence, global mean surface temperature increases and sea levels rise. Much like a pulse or heartbeat, CERES monitors reflected solar and emitted thermal infrared radiation, which together with solar irradiance measurements is one of Earth’s ‘vital signs.’ Better understanding Earth’s energy balance enables us to be informed and adapt to a changing world. ||
