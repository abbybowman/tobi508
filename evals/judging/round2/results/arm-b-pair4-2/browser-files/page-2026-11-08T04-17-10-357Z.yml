              - paragraph [ref=f1e290]: "This animation shows the projected increase in potential evaporation during the fire season through the year 2100, relative to 1980, based on the combined results of multiple climate models: MERRA data for 1980-2010 and an ensemble of 20 climate models for 2010-2100. The maximum increase across North America is about 1 mm/day by 2100. This concept, potential evaporation, is a measure of drying potential or \"fire weather.\" An average increase of 1 mm/day over the whole year is a big change — 1 mm/day increase in PE is considered to be an \"extreme\" event for fires, similar to the conditions in Colorado in 2012. By these projections, fire years like 2012 would be the new normal in regions like the western US by the end of the 21st century. ||"
