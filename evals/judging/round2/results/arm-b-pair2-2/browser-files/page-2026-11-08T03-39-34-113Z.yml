                    - link [ref=f1e1770] [cursor=pointer]:
                      - /url: /gallery/webb-arapp-media/
                      - img "The James Webb Space Telescope is the largest, most powerful and most technologically challenging space telescope ever built. The Webb Telescope is so large; it must be folded like origami to fit inside its rocket fairing for the ride into space. Once in space, unfolding and readying Webb for science is a complex process that will take about six months. Webb is designed to see the most distant galaxies in the Universe and study how galaxies evolved over cosmic time. Webb will study planets orbiting other stars looking for the chemical signatures of the building blocks of life. Webb will also study planets within our own solar system. The Webb Telescope Mission is an international space telescope program led by NASA with its partners, the European Space Agency and the Canadian Space Agency." [ref=f1e1772]
