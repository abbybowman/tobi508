                - listitem [ref=f1e337]:
                  - generic [ref=f1e338]:
                    - link [ref=f1e339] [cursor=pointer]:
                      - /url: /gallery/2024total-solar-eclipse-gallery/
                      - img "This visualization closely follows the Moon's umbra shadow as it crosses North America during the April 8, 2024 total solar eclipse. It covers the one hour and 50 minutes between 10:57 a.m. Pacific Standard Time and 4:47 p.m. Atlantic Daylight Time. Annotations include a running clock and the location of the center of the shadow. Everyone within the dark oval sees totality." [ref=f1e341]
                    - generic [ref=f1e342]: "ID: 40502"
                    - generic [ref=f1e343]:
                      - generic [aria-hidden] [ref=f1e344]: 
