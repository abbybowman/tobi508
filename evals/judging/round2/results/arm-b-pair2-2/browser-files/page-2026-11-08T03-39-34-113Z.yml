                    - link [ref=f1e588] [cursor=pointer]:
                      - /url: /gallery/roman/
                      - img "Formerly known as WFIRST, the Wide Field Infrared Survey Telescope, the Roman Space Telescope is a NASA observatory designed to perform wide field imaging and surveys of the near infrared (NIR) sky. The current design of the mission makes use of an existing 2.4m telescope, which is the same size as the Hubble Space Telescope. The Roman Space Telescope is the top-ranked large space mission in the New Worlds, New Horizon Decadal Survey of Astronomy and Astrophysics. The Wide Field Instrument will provide a field of view of the sky that is 100 times larger than images provided by HST. The coronagraph will enable astronomers to detect and measure properties of planets in other solar systems. More information about the Roman Space Telescope" [ref=f1e590]
