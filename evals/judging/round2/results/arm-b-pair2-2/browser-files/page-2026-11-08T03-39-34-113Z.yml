                    - generic [ref=f1e496]: January 28, 2026
                    - paragraph [ref=f1e499]: "Some 13.8 billion years ago, the universe began with a rapid expansion we call the big bang. After this initial expansion, which lasted a fraction of a second, gravity started to slow the universe down. But the cosmos wouldn’t stay this way. Nine billion years after the universe began, its expansion started to speed up, driven by an unknown force that scientists have named dark energy. But what exactly is dark energy? The short answer is: We don't know. But we do know that it exists, it’s making the universe expand at an accelerating rate, and approximately 68.3 to 70% of the universe is dark energy."
