                      - img "Launching in 2029, NASA’s Deep Atmosphere Venus Investigation of Noble gases, Chemistry and Imaging (DAVINCI) mission will bring a rich suite of instruments to Venus to address long standing questions about Earth’s sister planet. Some scientists think Venus may once have been more Earth-like in the past, with oceans and pleasant surface temperatures -- DAVINCI data will help us determine if this intriguing possibility is true. Clues to Venus’ mysterious past may be hidden in atmospheric gases or in surface rocks formed in association with ancient water in the planet’s mountainous highlands." [ref=f1e668]
