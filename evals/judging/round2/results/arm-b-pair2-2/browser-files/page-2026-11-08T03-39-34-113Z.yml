                  - generic [ref=f1e935]:
                    - link [ref=f1e936] [cursor=pointer]:
                      - /url: /gallery/punch/
                      - img "NASA’s Polarimeter to Unify the Corona and Heliosphere, or PUNCH mission, is a constellation of four small satellites in low Earth orbit that will make global, 3D observations of the Sun's corona to better understand how the mass and energy there becomes the solar wind that fills the solar system.By imaging the Sun’s corona and the solar wind together, scientists hope to better understand the entire inner heliosphere – Sun, solar wind, and Earth – as a single connected system.The PUNCH mission is led by Southwest Research Institute’s office in Boulder, Colorado. The mission is managed by the Explorers Program Office at NASA’s Goddard Space Flight Center in Greenbelt, Maryland, for NASA’s Science Mission Directorate.For more information visit science.nasa.gov/mission/punch" [ref=f1e938]
