                      - /url: /gallery/swift/
                      - img "NASA's Neil Gehrels Swift Observatory provides astronomers with a unique tool for exploring many different classes of astronomical phenomena, from gamma-ray bursts and supernovae to spinning neutron stars, outbursts from black holes, and even exoplanets, comets and asteroids. These pages gather together media products associated with Swift news releases.For more information about the Swift mission, visit its NASA webpage." [ref=f1e861]
