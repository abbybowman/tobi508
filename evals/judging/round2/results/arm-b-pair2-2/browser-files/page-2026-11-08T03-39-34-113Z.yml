                - listitem [ref=f1e1024]:
                  - generic [ref=f1e1025]:
                    - link [ref=f1e1026] [cursor=pointer]:
                      - /url: /gallery/stereomission/
                      - 'img "Launched on Oct. 25, 2006, the Solar Terrestrial Relations Observatory (STEREO) mission traces the flow of energy and matter from the Sun to our planet with perspectives not possible from Earth. The mission initially used two nearly identical spacecraft, with one (STEREO-A) orbiting the Sun ahead of Earth and the other (STEREO-B) trailing behind Earth. Mission controllers lost contact with STEREO-B on September 23, 2016, but STEREO-A continues to bring its unique viewpoint to studies of the Sun and the giant bubble surrounding our solar system called the heliosphere. Learn more: https://science.nasa.gov/mission/stereo/" [ref=f1e1028]'
                    - generic [ref=f1e1029]: "ID: 40354"
