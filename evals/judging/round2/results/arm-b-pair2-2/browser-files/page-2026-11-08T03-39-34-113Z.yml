                      - /url: /gallery/fermi5/
                      - img "NASA's Fermi Gamma-ray Space Telescope has completed its primary mission, and it will continue to explore the high-energy cosmos in unprecedented detail. These pages gather together media products associated with Fermi news releases starting before its 2008 launch, when it was known as GLAST. Fermi detects gamma rays, the most powerful form of light, with energies thousands to billions of times greater than the visible spectrum. The mission has discovered pulsars, proved that supernova remnants can accelerate particles to near the speed of light, monitored eruptions of black holes in distant galaxies, and found giant bubbles linked to the central black hole in our own galaxy. For more information about the Fermi mission, visit its NASA webpage." [ref=f1e694]
