                      - link "Solar Cycle 25" [ref=f1e330] [cursor=pointer]:
                        - /url: /gallery/solar-cycle25/
                    - generic [ref=f1e331]: June 28, 2024
                    - paragraph [ref=f1e334]: The Solar Cycle 25 Prediction Panel, an international group of experts co-sponsored by NASA and the National Oceanic and Atmospheric Administration (NOAA), announced that solar minimum occurred in December 2019, marking the start of Solar Cycle 25. Since then, the Sun’s activity has been steadily increasing as it approaches solar maximum — the peak of Solar Cycle 25.A new solar cycle comes roughly every 11 years. Over the course of each cycle, the Sun transitions from relatively calm to active and stormy, and then quiet again. At its peak, the Sun’s magnetic poles flip.Understanding the Sun’s behavior is an important part of life in our solar system. The Sun’s outbursts, including eruptions known as solar flares and coronal mass ejections, can disturb satellites and communication signals traveling around Earth. Scientists study the solar cycle so we can better understand and predict solar activity.
                    - link "Go to this page" [ref=f1e335] [cursor=pointer]:
