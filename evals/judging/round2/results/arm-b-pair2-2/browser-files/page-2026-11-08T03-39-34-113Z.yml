                    - link [ref=f1e640] [cursor=pointer]:
                      - /url: /gallery/awe/
                      - img "From its unique vantage point on the International Space Station, NASA’s Atmospheric Waves Experiment (AWE) will look directly down into Earth’s atmosphere to study how gravity waves travel through the upper atmosphere. Data collected by AWE will enable scientists to determine the physics and characteristics of atmospheric gravity waves and how terrestrial weather influences the ionosphere, which can affect communication with satellites. AWE is led by Michael Taylor at Utah State University in Logan, and it is managed by the Explorers Program Office at NASA’s Goddard Space Flight Center in Greenbelt, Maryland. Utah State University’s Space Dynamics Laboratory built the AWE instrument and will provide the mission operations center." [ref=f1e642]
