                    - generic [ref=f1e314]: April 4, 2012
                    - paragraph [ref=f1e317]: This gallery contains an archive of breaking news solar events such as flares, CMEs, solar storms, and comet passes. The most recent material is at the top left, and it progresses back in time left-to-right and top-down. Each page contains video and/or stills of a distinct event or series of linked events.The videos are available at multiple resolutions and compressions, including Apple ProRes 422. Where applicable, there are links to 4k x 4k tif frames.For sun-related background, animations, visualizations and informational content, go here.For pre-recorded, frequently-asked-question interviews with NASA scientists, go here.
