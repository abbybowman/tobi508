                - listitem [ref=f1e1050]:
                  - generic [ref=f1e1051]:
                    - link [ref=f1e1052] [cursor=pointer]:
                      - /url: /gallery/tracers/
                      - 'img "NASA’s Tandem Reconnection and Cusp Electrodynamics Reconnaissance Satellites, or TRACERS mission, consists of two satellites that will help understand magnetic reconnection and its effects in Earth’s atmosphere. Magnetic reconnection occurs when activity from the Sun interacts with Earth’s magnetic field. By understanding this process, scientists will be able to better understand and prepare for impacts of solar activity on Earth. The TRACERS mission is led by David Miles at the University of Iowa and managed by the Southwest Research Institute in San Antonio. NASA’s Heliophysics Explorers Program Office at the agency’s Goddard Space Flight Center in Greenbelt, Maryland, provides mission oversight to the project for the agency’s Heliophysics Division at NASA Headquarters in Washington. Learn more about the mission: https://science.nasa.gov/mission/tracers/" [ref=f1e1054]'
