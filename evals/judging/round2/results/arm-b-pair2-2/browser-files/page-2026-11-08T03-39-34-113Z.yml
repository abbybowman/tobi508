                      - /url: /gallery/warmingworld-snapsfromspace/
                      - 'img "Less than a year after a devastating 2003 heat wave killed over 37,000 people across Europe, another heat wave struck the region. On July 1, 2004, this image from NASA''s Moderate Resolution Imaging Spectroradiometer (MODIS) recorded land surface temperatures of 138°F (59°C) in Spain. In this false-color image, red represents the warmest temperatures, yellow is intermediate, and light and dark blue are progressively cooler. Air temperatures in both countries soared over 104°F (40°C). Three days after this image was taken, Spain set a new air temperature record for the nation: 117°F (47°C). Climate models predict more extreme weather events, including heat waves, in the coming decades due to man-made climate change. Image taken by NASA''s Moderate Resolution Imaging Spectroradiometer (MODIS) on July 1, 2004. Credit: Jacques Descloitres and Ana Pinheiro, MODIS Rapid Response Team, NASA/GSFC." [ref=f1e1634]'
