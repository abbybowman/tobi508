                      - /url: /gallery/annular-solar-eclipse2023/
                      - 'img "An annular solar eclipse photographed on October 14, 2023. Image Credit: NASA/Jim Spann" [ref=f1e358]'
                    - generic [ref=f1e359]: "ID: 40500"
                    - generic [ref=f1e360]:
                      - generic [aria-hidden] [ref=f1e361]: 
                      - text: Gallery
                  - generic [ref=f1e362]:
                    - heading [level=3] [ref=f1e363]:
                      - link "2023 Annular Solar Eclipse" [ref=f1e364] [cursor=pointer]:
                        - /url: /gallery/annular-solar-eclipse2023/
                    - generic [ref=f1e365]: September 19, 2023
                    - paragraph [ref=f1e368]: "On Oct. 14, 2023, an annular solar eclipse will cross North, Central, and South America. Visible in parts of the United States, Mexico, and many countries in South and Central America, millions of people in the Western Hemisphere can experience this eclipse. An annular solar eclipse happens when the Moon passes between the Sun and Earth while it is at or near its farthest point from Earth. Because the Moon is farther away from Earth than usual, it appears smaller than the Sun and does not completely cover the star. Because of this, the Sun will appear like a “ring of fire” in the sky for those in the path of annularity. During an annular eclipse, it is never safe to look directly at the Sun without specialized eye protection designed for solar viewing. Learn more about this annular solar eclipse: solarsystem.nasa.gov/eclipses/2023"
