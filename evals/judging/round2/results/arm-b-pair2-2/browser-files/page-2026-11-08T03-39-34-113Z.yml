                      - /url: /gallery/abo-ve/
                      - img "The Arctic Boreal Vulnerability Experiment, or ABoVE, is a NASA-led, 10-year field experiment designed to better understand the ecological and social consequences of environmental change in one of the most rapidly changing regions on Earth. Satellite, airborne, and ground observations across Alaska and Canada will help us better understand the local and regional effects of changing forests, permafrost, and ecosystems – and how these changes could ultimately affect people and places beyond the Arctic." [ref=f1e629]
