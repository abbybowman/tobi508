                    - generic [ref=f1e404]: August 15, 2025
                    - paragraph [ref=f1e407]:
                      - text: While the Artemis II crew will be the first humans to test NASA’s Orion spacecraft in space, they will also conduct science investigations that will inform future deep space missions. During the 10-day past the Moon and back, the Orion capsule will fly by the far side of the Moon — the side that always faces away from Earth. During this three-hour period, astronauts will analyze and photograph geologic features, such as impact craters and ancient lava flows. They will rely on the extensive geology training they received in the classroom and in Moon-like places on Earth to describe nuances in shapes, textures, and colors — the type of information that reveals the geologic history of an area. These skills will be critical to exploring the Moon’s South Pole region through future missions. Learn more about Artemis II lunar science. Learn more about all Artemis II science experiments Learn more about the Moon at science.nasa.gov/moon.
                      - strong [ref=f1e408]: "Note: This page will be continually updated through the Artemis II mission."
                      - text: "Media Contact: Lonnie Shekhtman NASA’s Goddard Space Flight Center in Greenbelt, Md."
