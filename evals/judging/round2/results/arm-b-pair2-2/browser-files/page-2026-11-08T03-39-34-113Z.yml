                  - generic [ref=f1e768]:
                    - link [ref=f1e769] [cursor=pointer]:
                      - /url: /gallery/icesat2/
                      - img "The Ice, Cloud and land Elevation Satellite-2 will measure the height of Earth from space, creating a record of the planet’s elevation in unprecedented detail and precision. With high-resolution data from ICESat-2’s laser altimeter, scientists will track changes to Earth’s polar ice caps – regions that are a harbinger of warming temperatures worldwide. The mission will also take stock of forests, map ocean surfaces, track the rise of cities and measure everything in between. ICESat-2 continues key elevation observations begun by ICESat-1 (2003 to 2009) and Operation IceBridge (2009 through present), to provide a portrait of change in the beginning of the 21st century. For more information, please visit the ICESat-2 website." [ref=f1e771]
