                      - /url: /gallery/visualizationsfor-educators/
                      - img "Phenomena are observable events that occur in nature. Data visualizations can offer new ways for students to experience and explore Earth and space phenomena that happen over large scales of time and at great distances. This gallery includes visualizations of phenomena that support topics that are taught in middle and high school and are aligned with select Next Generation Science Standards. This gallery was curated by Anne Arundle County Science Teachers Margaret Graham and Jeremy Milligan with support from Dr. Rachel Connolly during the summer of 2022. A video showing how Jeremy Milligan uses SVS resources to develop a phenomena-based lesson is also available." [ref=f1e1200]
