                  - generic [ref=f1e345]:
                    - heading [level=3] [ref=f1e346]:
                      - link "2024 Total Solar Eclipse" [ref=f1e347] [cursor=pointer]:
                        - /url: /gallery/2024total-solar-eclipse-gallery/
                    - generic [ref=f1e348]: October 31, 2023
                    - paragraph [ref=f1e351]: "On April 8, 2024, a total solar eclipse will cross North America, passing over Mexico, the United States, and Canada. A total solar eclipse happens when the Moon passes between the Sun and Earth, completely blocking the face of the Sun. The sky will darken as if it were dawn or dusk.A total solar eclipse happens when the Moon passes between the Sun and Earth, completely blocking the face of the Sun. People viewing the eclipse from locations where the Moon’s shadow completely covers the Sun – known as the path of totality – will experience a total solar eclipse. The sky will darken, as if it were dawn or dusk. Weather permitting, people along the path of totality will see the Sun’s corona, or outer atmosphere, which is usually obscured by the bright face of the Sun.Learn more about this total solar eclipse: solarsystem.nasa.gov/eclipses/2024"
                    - link "Go to this page" [ref=f1e352] [cursor=pointer]:
                      - /url: /gallery/2024total-solar-eclipse-gallery/
