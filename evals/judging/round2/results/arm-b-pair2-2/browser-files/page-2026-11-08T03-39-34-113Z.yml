                - listitem [ref=f1e1011]:
                  - generic [ref=f1e1012]:
                    - link [ref=f1e1013] [cursor=pointer]:
                      - /url: /gallery/solar-orbiter/
                      - img "As the main driver of space weather, it is essential to understand the behavior of the Sun to learn how to better safeguard our planet, space technology and astronauts. Solar Orbiter will study the Sun, its outer atmosphere and what drives the constant outflow of solar wind which affects Earth. The spacecraft will observe the Sun's atmosphere up close with high spatial resolution telescopes and compare these observations to measurements taken in the environment directly surrounding the spacecraft – together creating a one-of-a-kind picture of how the Sun can affect the space environment throughout the solar system." [ref=f1e1015]
