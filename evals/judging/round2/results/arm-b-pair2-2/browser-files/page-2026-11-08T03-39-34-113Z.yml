                    - link [ref=f1e614] [cursor=pointer]:
                      - /url: /gallery/hubble-space-telescope/
                      - img "Since its launch in 1990, the Hubble Space Telescope has changed our fundamental understanding of the universe. Hubble’s unique design, allowing it to be repaired and upgraded with advanced technology by astronauts, has made it one of NASA’s longest-living and most valuable observatories. Today, Hubble continues to provide views of cosmic wonders never before seen and is still at the forefront of astronomy. The Hubble Space Telescope is an international collaboration between NASA and the European Space Agency (ESA).For more information visit us at https://nasa.gov/hubble or follow us on social media @NASAHubble." [ref=f1e616]
