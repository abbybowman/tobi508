                - listitem [ref=f1e1037]:
                  - generic [ref=f1e1038]:
                    - link [ref=f1e1039] [cursor=pointer]:
                      - /url: /gallery/tess/
                      - img "The Transiting Exoplanet Survey Satellite (TESS) is a NASA Explorer mission launching in 2018 to study exoplanets, or planets orbiting stars outside our solar system. TESS will discover thousands of exoplanets in orbit around the brightest stars in the sky. It will monitor more than 200,000 stars, looking for temporary dips in brightness caused by planets transiting across these stars. This first-ever spaceborne all-sky transit survey will identify a wide range of planets, from Earth-sized to gas giants. The mission will find exoplanet candidates for follow-up observation from missions like the James Webb Space Telescope, which will determine whether these candidates could support life. For more information, please visit the TESS website." [ref=f1e1041]
                    - generic [ref=f1e1042]: "ID: 40325"
