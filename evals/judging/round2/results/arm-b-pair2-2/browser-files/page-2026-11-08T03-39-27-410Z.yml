                      - paragraph [ref=e581]: Visualization showing the updated trajectory of NASA’s Lucy spacecraft as it travels through the solar system to explore Jupiter’s Trojan asteroids. The visualization also includes the locations of thousands of Jupiter Trojan and main belt asteroids, providing context for Lucy’s journey. || 5686 || Lucy Mission Trajectory with Jupiter Trojans and Main Belt Asteroids || This visualization shows the trajectory of NASA’s Lucy spacecraft as it travels to the Jupiter L4 Lagrange point. Trojan asteroids are represented by light orange dots, while main belt asteroids are shown as white dots. || lucy_trajectory_2026_labeled.02510_preview.jpg (1920x1080) [583.2 KB] || lucy_trajectory_2026_labeled.02510.jpg (3840x2160) [2.4 MB] || lucy_trajectory_2026_labeled_1080p60.mp4 (1920x1080) [57.6 MB] || lucy_trajectory_2026_labeled_2160p60.mp4 (3840x2160) [155.2 MB] || lucy_trajectory_2026_labeled_2160p60_prores.mov (3840x2160) [6.7 GB] || This visualization tracks NASA’s Lucy spacecraft from its October 2021 launch to its arrival at the L4 Trojan asteroids. Having traveled over 2.2 billion miles, Lucy is the first spacecraft to reach the L4 Lagrange point, a stable region in space where thousands of primitive asteroids share Jupiter's orbit around the Sun. Scientists expect that studying these ancient bodies up close, starting with the asteroid Eurybates in August 2027, will help refine theories on how our solar system formed 4.5 billion years ago. || This visualization shows the trajectory of NASA’s Lucy spacecraft as it travels to the Jupiter L4 Lagrange point. Trojan asteroids are represented by light orange dots, while main belt asteroids are shown as white dots. This version has no asteroid labels. || lucy_trajectory_2026.02510_preview.jpg (1920x1080) [576.9 KB] || lucy_trajectory_2026.02510.jpg (3840x2160) [2.4 MB] || lucy_trajectory_2026_1080p60.mp4 (1920x1080) [57.2 MB] || lucy_trajectory_2026_2160p60.mp4 (3840x2160) [152.3 MB] |