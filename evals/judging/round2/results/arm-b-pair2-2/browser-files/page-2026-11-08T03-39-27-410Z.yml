                      - paragraph [ref=e558]: "A side-by-side comparison of sea surface temperature anomalies in the tropical Pacific during 2025 and 2026, highlighting ocean temperature patterns associated with El Niño. This visualization is updated daily to incorporate the latest available data. || 5688 || El Niño 2026: Sea Surface Temperature Anomaly (2025 vs. 2026) – Updated Daily || Side-by-side globes comparing sea surface temperature anomalies in the tropical Pacific during 2025 and 2026. Reds indicate warmer-than-average ocean temperatures, while blues indicate cooler-than-average temperatures. A color bar shows the temperature anomaly scale in degrees Celsius. The visualization uses a 7-day running average and is updated daily with the latest available data. || elnino_eic_ssta_globes_wLegend_1670x835_latest.jpg (1670x835) [477.9 KB] || elnino_eic_ssta_globes_wLegend_3340x1670_latest.jpg (3340x1670) [1.5 MB] || elnino_eic_ssta_globes_wLegend_3340x1670_latest.mp4 (3340x1670) [16.1 MB] || This visualization compares sea surface temperature anomalies (SSTA) in the tropical Pacific during 2025 and 2026, highlighting changes in ocean temperature patterns associated with El Niño. Sea surface temperature anomalies indicate how much warmer or cooler the ocean surface is compared to average conditions, with reds representing warmer-than-average temperatures and blues indicating cooler-than-average temperatures.The visualization uses data from NASA's Jet Propulsion Laboratory (JPL) Multi-scale Ultra-high Resolution (MUR) Sea Surface Temperature Analysis. A 7-day running average is applied to smooth short-term variations and make broader temperature patterns easier to see. The visualization is updated daily to incorporate the latest available data for 2026. || Side-by-side globes comparing sea surface temperature anomalies in the tropical Pacific during 2025 and 2026. Reds indicate warmer-than-average ocean temperatures, while blues indicate cooler-than-average temperatures. The visualization uses a 7-day running average and is updated daily with the latest available data. || elnino_eic_ssta_globes_1670x835_latest.jpg (1670x835) [466.1 KB] || elnino_eic_ssta_globes_3340x1670_latest.jpg (3340x1670) [1.5 MB] || elnino_eic_ssta_globes_3340x1670_latest.mp4 (3340x1670) [16.0 MB] || Earth || Automated || Earth Information Center || Earth Science || EIC || Eic (earth information center) display || Hyperwall || Ocean Temperature || Oceans || Physical oceanography || Sea Surface Temperature Anomaly || Updates Regularly || MUR SST (Multi-scale Ultra-high Resolution (MUR) Sea Surface Temperature (SST) Analysis) || Kel Elkins (Science and Technology Corporation) as Data visualizer ||"
