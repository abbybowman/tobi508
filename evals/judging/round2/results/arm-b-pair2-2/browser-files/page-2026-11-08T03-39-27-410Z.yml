                        - text: (Escape and Plasma Acceleration and Dynamics Explorers) spacecraft will perform a “powered” flyby of Earth, combining Earth’s gravity with an approximately 9-minute engine burn, to slingshot itself toward Mars. The first ESCAPADE spacecraft will make its closest approach and complete its engine burn around 5 a.m. EST on Nov. 7, and the second will do so two days later, around 6 a.m. EST on Nov. 9. In the hours before, during, and after each spacecraft’s closest approach, observers on the ground might be able to spot the spacecraft in the night sky. However, a telescope will most likely be needed to find it as a dim point moving against the stars. Each spacecraft will appear to move through the sky relatively slowly and take several hours to cross overhead. From the U.S., each spacecraft will be below the horizon during its closest approach to Earth. Therefore, the spacecraft will be best viewed in the western sky an hour or two before closest approach. From some viewing locations, the spacecraft will also reappear in the eastern sky an hour or two after its closest approach.The star charts below show the path the spacecraft will take across the sky for several different locations in the U.S. The colors along the path represent the altitude of the spacecraft, which will decrease during the time shown, with red showing the lowest altitude along the path (when the spacecraft should be brightest). If your viewing location is not represented here, you can use the NASA Jet Propulsion Laboratory’s
                        - link "Horizons System" [ref=e425] [cursor=pointer]:
                          - /url: https://ssd.jpl.nasa.gov/horizons/app.html#/
                        - text: "to get coordinates for the two spacecraft at different times for your location.Locations included below:"
