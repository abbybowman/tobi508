              - heading [level=3] [ref=f3e448]:
                - text: Dial-A-Moon API
                - button "Copy a link to this section" [ref=f3e449] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f3e450]: 
              - paragraph [ref=f3e451]:
                - text: The Dial-A-Moon API is used to power the Dial-A-Moons (e.g. on
                - link "#5048" [ref=f3e452] [cursor=pointer]:
                  - /url: https://svs.gsfc.nasa.gov/5048
                - text: ) across the SVS site. It also serves as a useful resource for getting astronomical information about the Moon for a given date.
              - paragraph [ref=f3e453]:
                - text: If you have any questions specifically about the data returned by this API, please contact
                - link "Ernie Wright" [ref=f3e455] [cursor=pointer]:
                  - /url: mailto:ernest.t.wright@nasa.gov?subject=Dial-A-Moon Inquiry (from help page)
                - text: . For general API inquiries, please contact
                - link "Ella Kaplan" [ref=f3e457] [cursor=pointer]:
                  - /url: mailto:ella.kaplan@nasa.gov?subject=SVS API Inquiry (from help page)
                - text: .
              - paragraph [ref=f3e458]: "Note: the Dial-A-Moon API has a couple of specific restrictions:"
              - list [ref=f3e459]:
                - listitem [ref=f3e460]: Data is only available in 1-hour increments, except during eclipses, where it switches to 1-minute increments.
                - listitem [ref=f3e461]: The earliest data available is January 1st, 2011, 00:00 UTC.
                - listitem [ref=f3e462]: The latest data available is December 31st, 23:00 UTC for the current year. We add in the next year of data when the yearly Moon Phase and Libration visualization comes out, which has historically happened in November.
              - paragraph [ref=f3e463]:
                - text: "The basic format for a Dial-A-Moon API call is:"
                - code [ref=f3e464]: "https://svs.gsfc.nasa.gov/api/dialamoon/{UTC timestamp in YYYY-MM-DDTHH:MM}"
                - generic [ref=f3e465]:
                  - text: "Note: there is always a letter"
                  - code [ref=f3e466]: T
                  - text: in between the date and time, and it is not something that should be converted.
              - paragraph [ref=f3e468]:
                - text: "Example: the Dial-A-Moon API call for January 2nd, 2023 at 03:00 UTC is:"
                - code [ref=f3e469]: https://svs.gsfc.nasa.gov/api/dialamoon/2023-01-02T03:00
                - text: (
                - link "" [ref=f3e470] [cursor=pointer]:
                  - /url: https://svs.gsfc.nasa.gov/api/dialamoon/2023-01-02T03:00
                  - generic "Open this url in a new tab" [ref=f3e471]: 
                - text: )
              - heading "Data Specification" [level=4] [ref=f3e472]
              - paragraph [ref=f3e473]:
                - text: "As an example, consider the following request:"
                - code [ref=f3e474]: https://svs.gsfc.nasa.gov/api/dialamoon/2023-07-12T15:37
                - text: (
