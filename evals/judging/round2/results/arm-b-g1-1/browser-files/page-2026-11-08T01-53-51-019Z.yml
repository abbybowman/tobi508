            - generic [ref=f3e73]:
              - heading [level=3] [ref=f3e74]:
                - text: Videos
                - button "Copy a link to this section" [ref=f3e75] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f3e76]: 
              - heading "File Formats" [level=4] [ref=f3e77]
              - paragraph [ref=f3e78]:
                - text: Our videos are primarily released in
                - code [ref=f3e79]: .mp4
                - text: and
                - code [ref=f3e80]: .webm
                - text: . Both of these file formats are supported in all modern web browsers. If you're having issues viewing either of these, we'd recommend either downloading the videos and attempting to preview them with your media viewer of choice, or trying to view the page in a different browser.
              - paragraph [ref=f3e81]:
                - text: Some of our older content is also available in
                - code [ref=f3e82]: .mpg
                - text: and
                - code [ref=f3e83]: .dv
                - text: . While these formats are not supported for web display, we have retroactively generated
                - code [ref=f3e84]: .webm
                - text: copies of these visualizations, which should display without any issues.
                - code [ref=f3e85]: .mpg
                - text: and
                - code [ref=f3e86]: .dv
                - text: are generally still supported in desktop media viewer applications, and you may have luck downloading them.
              - heading "Resolutions" [level=4] [ref=f3e87]
              - paragraph [ref=f3e88]: In most cases, our newer visualizations are created in 4K (3840 x 2160) at either 30 or 60 frames per second. All of our newer visualizations, and most of our older visualizations, are also published in HD (1920 x 1080 or 1280 x 720; 30fps / 60fps). Some of our oldest work is also published in NTSC (720 x 480; 29.97fps).
            - generic [ref=f3e89]:
              - heading [level=3] [ref=f3e90]:
                - text: Images
                - button "Copy a link to this section" [ref=f3e91] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f3e92]: 
              - heading "File Formats" [level=4] [ref=f3e93]
              - paragraph [ref=f3e94]:
                - text: Out images are primarily released in
                - code [ref=f3e95]: .jpg
                - text: ","
                - code [ref=f3e96]: .jpeg
                - text: ", or"
                - code [ref=f3e97]: .png
                - text: . These are pretty universally supported, so you should (hopefully) have no issue viewing any of these.
              - paragraph [ref=f3e98]:
                - text: We also occasionally release some of our higher-resolution content in
                - code [ref=f3e99]: .tif
                - text: ","
                - code [ref=f3e100]: .tiff
                - text: ", or"
                - code [ref=f3e101]: .exr
                - text: . These files on the site are generally accompanied by more-compatible (albeit, lower-resolution) versions in more common formats. These are likely what your web browser displays on pages containing images with these file extensions.
              - paragraph [ref=f3e102]:
                - code [ref=f3e103]: .tif
                - text: and
                - code [ref=f3e104]: .tiff
                - text: files are commonly supported by desktop image viewers, but not web browsers (save for Safari on Apple devices). As a result, we'd recommend downloading them and previewing them in a desktop image viewer.
              - paragraph [ref=f3e105]:
                - text: Likewise,
                - code [ref=f3e106]: .exr
                - text: files are commonly supported by desktop image viewers, but not web browsers.
              - heading "Resolutions" [level=4] [ref=f3e107]
              - paragraph [ref=f3e108]: Much like our videos, the vast majority of our newer visualizations are published in 4K, with smaller resolutions being available through the "downloads" dropdown menu. All of our newer content, and most of our older content, is also published in HD.
            - generic [ref=f3e109]:
              - heading [level=3] [ref=f3e110]:
                - text: Frames
                - button "Copy a link to this section" [ref=f3e111] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f3e112]: 
              - paragraph [ref=f3e113]: In addition to making compiled versions of our videos available, we commonly include links to directories containing all of the individual frames that make up those visualizations. These directories can be found linked in the "downloads" menu, under the "frames" heading.
              - paragraph
              - heading "File Formats" [level=4] [ref=f3e114]
              - paragraph [ref=f3e115]:
                - text: Our frames are generally released in
                - code [ref=f3e116]: .exr
                - text: ","
                - code [ref=f3e117]: .tif
                - text: ", and"
                - code [ref=f3e118]: .tiff
                - text: . For more information about handling these file types, see the
                - link "images" [ref=f3e119] [cursor=pointer]:
                  - /url: "#multimedia-images"
                - text: section.
              - heading "Downloading" [level=4] [ref=f3e120]
              - paragraph [ref=f3e121]: "Understandably, it is desirable to fetch more than one frame at a time. There are currently two recommended tools for downloading multiple frames from our site:"
              - heading "1. DownThemAll" [level=5] [ref=f3e122]
              - paragraph [ref=f3e123]:
                - text: (available for
                - link "Firefox" [ref=f3e124] [cursor=pointer]:
                  - /url: https://addons.mozilla.org/en-US/firefox/addon/downthemall/
                - text: and
                - link "Chromium-based" [ref=f3e125] [cursor=pointer]:
                  - /url: https://chrome.google.com/webstore/detail/downthemall/nljkibfhlpcnanjgbnlnbjecgicbjkge
                - text: (e.g. Google Chrome or Microsoft Edge) browsers.
              - paragraph [ref=f3e126]:
                - text: For instructions on using this extension, see its
                - link "website" [ref=f3e127] [cursor=pointer]:
                  - /url: https://about.downthemall.org/4.0/
                - text: .
              - heading "2. Using curl on the command line" [level=5] [ref=f3e128]
              - paragraph [ref=f3e129]:
                - text: If you do not already have curl installed on your system, download it
                - link "here" [ref=f3e130] [cursor=pointer]:
                  - /url: https://curl.haxx.se/download.html
                - text: ". Basic command usage:"
              - generic [ref=f3e131]: prompt> curl [options] url
              - list [ref=f3e132]:
                - listitem [ref=f3e133]: url - the url you want to download. You can specify a numeric sequence using a range of numbers between brackets (see the example below).
                - listitem [ref=f3e134]: "[options] - a variety of option flags. We suggest using the options '-LO' which will follow links and will store your downloaded frames in the current directory as their original file names."
              - paragraph [ref=f3e135]: "For example, suppose we wish to download a frame sequence from animation ID 3032 which is located at:"
              - link "https://svs.gsfc.nasa.gov/vis/a000000/a003000/a003032/frames/1024x512/" [ref=f3e137] [cursor=pointer]:
                - /url: https://svs.gsfc.nasa.gov/vis/a000000/a003000/a003032/frames/1024x512/
              - paragraph [ref=f3e138]:
                - text: The frame files have the form
                - code [ref=f3e139]: cld_f.nnnn.png
                - text: ", where"
                - code [ref=f3e140]: nnnn
                - text: are the frame numbers ranging from
                - code [ref=f3e141]: "0060"
                - text: to
                - code [ref=f3e142]: "0119"
                - text: ". In the directory where you wish to place the frames, execute the following command:"
              - generic [ref=f3e143]: prompt> curl -LO "https://sfc.nasa.gov/vis/a000000/a003000/a003032/frames/1024x512/cld_f.[0060-0119].png"
              - paragraph [ref=f3e144]: This command will download each specified file in the given sequence if it exists.
              - alert [ref=f3e145]:
                - strong [ref=f3e146]: Warning!
                - text: Please exercise caution when specifying a range with non-significant leading zeroes. For example, if specifying cld_f.[0060-0119].png does not work, try specifying cld_f.0[060-119].png instead.
          - generic [ref=f3e147]:
            - heading [level=2] [ref=f3e148]:
              - text: Using our APIs
              - button "Copy a link to this section" [ref=f3e149] [cursor=pointer]:
                - generic [aria-hidden] [ref=f3e150]: 
            - paragraph [ref=f3e151]:
              - text: In order to make our content more publicly accessible, and allow for automatic querying of our multimedia collection, the SVS has a number of free, publicly-available web APIs. All of our APIs can be accessed by sending
              - code [ref=f3e152]: GET
              - text: requests to specific URLs on this site. These requests can be further customized through the usage of URL parameters. Their responses are sent back as
              - code [ref=f3e153]: JSON
              - text: dictionaries.
            - paragraph [ref=f3e154]:
              - text: If you have additional questions as to how to use any of the following APIs, contact
              - link "Ella Kaplan" [ref=f3e156] [cursor=pointer]:
                - /url: mailto:ella.kaplan@nasa.gov?subject=SVS API Inquiry (from help page)
              - text: directly.
            - generic [ref=f3e157]:
              - heading [level=3] [ref=f3e158]:
                - text: Search API
                - button "Copy a link to this section" [ref=f3e159] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f3e160]: 
              - paragraph [ref=f3e161]:
                - text: The search API allows for automatic querying of our
                - link "search page" [ref=f3e162] [cursor=pointer]:
                  - /url: /search
                - text: .
              - paragraph [ref=f3e163]:
                - text: "The basic format for a search API call is:"
                - code [ref=f3e164]: "https://svs.gsfc.nasa.gov/api/search/?{url parameters}"
              - heading "Filtering Results" [level=4] [ref=f3e165]
              - paragraph [ref=f3e166]:
                - text: Any
                - code [ref=f3e167]: GET
                - text: request that is performed by the SVS search can be executed in our API by prepending
                - code [ref=f3e168]: /api
                - text: to the beginning of the URL. Generally, we recommend performing a search through the search page, and then trying to perform it through the API. On the search page, there is a shortcut to the API with the current search parameters that can be found by clicking on the small file-with-brackets icon (
                - generic [aria-hidden] [ref=f3e169]: 
                - text: ) to the right of the result count.
              - generic [ref=f3e170]:
                - paragraph [ref=f3e171]: "Example: let's say we wanted to search for all of the visualizations containing the word Apollo."
                - paragraph [ref=f3e172]:
                  - text: "Searching that phrase on the search page results in the following URL:"
                  - code [ref=f3e173]: https://svs.gsfc.nasa.gov/search?search=Apollo
                  - text: (
                  - link "" [ref=f3e174] [cursor=pointer]:
                    - /url: https://svs.gsfc.nasa.gov/search?search=Apollo
                    - generic "Open this url in a new tab" [ref=f3e175]: 
                  - text: )
                - paragraph [ref=f3e176]:
                  - text: "We would be able to perform the exact same search through the API by sending a request to the following URL:"
                  - code [ref=f3e177]: https://svs.gsfc.nasa.gov/api/search/?search=Apollo
                  - text: (
                  - link "" [ref=f3e178] [cursor=pointer]:
                    - /url: https://svs.gsfc.nasa.gov/api/search/?search=Apollo
                    - generic "Open this url in a new tab" [ref=f3e179]: 
                  - text: )
              - heading "Limiting results" [level=4] [ref=f3e180]
              - paragraph [ref=f3e181]:
                - text: By default, the API will return 100 results at a time. You can reduce the number of stories returned by providing the
                - code [ref=f3e182]: limit
                - text: parameter.
              - paragraph [ref=f3e183]:
                - text: The maximum limit that can be specified is 2000. Specify
                - code [ref=f3e184]: limit=none
                - text: or
                - code [ref=f3e185]: limit=all
                - text: to view all of the results, though the maximum limit still applies.
              - generic [ref=f3e186]:
                - paragraph [ref=f3e187]: "Example: let's say we wanted to obtain the 15 most recently published visualizations related to the James Webb Space Telescope."
                - paragraph [ref=f3e188]:
                  - text: "We would be able to do so by sending a request to the following URL:"
                  - code [ref=f3e189]: https://svs.gsfc.nasa.gov/api/search/?missions=James+Webb+Space+Telescope&limit=15
                  - text: (
                  - link "" [ref=f3e190] [cursor=pointer]:
                    - /url: https://svs.gsfc.nasa.gov/api/search/?missions=James+Webb+Space+Telescope&limit=15
                    - generic "Open this url in a new tab" [ref=f3e191]: 
                  - text: )
              - heading "Pagination" [level=4] [ref=f3e192]
              - paragraph [ref=f3e193]:
                - text: The API will return at most the number of stories specified in the
                - code [ref=f3e194]: limit
                - text: parameter, which again defaults to 100. The total number of results will be given in the
                - code [ref=f3e195]: count
                - text: field. To obtain subsequent "pages" of stories, provide the
                - code [ref=f3e196]: offset
                - text: and
                - code [ref=f3e197]: limit
                - text: parameters.
              - paragraph [ref=f3e198]:
                - text: For convenience, this "next" URL will be given in the
                - code [ref=f3e199]: next
                - text: field.
                - code [ref=f3e200]: next
                - text: will be
                - code [ref=f3e201]: "null"
                - text: if you are already viewing all of the results, or the last page of the results.
              - paragraph [ref=f3e202]:
                - text: Similarly, there is a
                - code [ref=f3e203]: previous
                - text: field which gives the URL for the previous page of results, if applicable.
              - generic [ref=f3e204]:
                - paragraph [ref=f3e205]: "Example: let's say we wanted to obtain the next 15 visualizations from the previous example."
                - paragraph [ref=f3e206]:
                  - text: "We would be able to do so by sending a request to the following URL:"
                  - code [ref=f3e207]: https://svs.gsfc.nasa.gov/api/search/?limit=15&missions=James+Webb+Space+Telescope&offset=15
                  - text: (
                  - link "" [ref=f3e208] [cursor=pointer]:
                    - /url: https://svs.gsfc.nasa.gov/api/search/?limit=15&missions=James+Webb+Space+Telescope&offset=15
                    - generic "Open this url in a new tab" [ref=f3e209]: 
                  - text: )
              - heading "Data Specification" [level=4] [ref=f3e210]
              - paragraph [ref=f3e211]:
                - text: "As an example, consider the following request:"
                - code [ref=f3e212]: https://svs.gsfc.nasa.gov/search/?studio=SVS&made_for=EIC
                - text: (
                - link "" [ref=f3e213] [cursor=pointer]:
                  - /url: https://svs.gsfc.nasa.gov/api/search/?studio=SVS&made_for=EIC
                  - generic "Open this url in a new tab" [ref=f3e214]: 
                - text: )
              - paragraph [ref=f3e215]:
                - text: At the time this documentation was written, this request would return the following
                - code [ref=f3e216]: JSON
                - text: "data:"
              - generic [ref=f3e217]: "{ \"count\": 19, \"next\": null, \"previous\": null, \"results\": [ { \"id\": 5126, \"url\": \"https://svs.gsfc.nasa.gov/5126/\", \"result_type\": \"Visualization\", \"release_date\": \"2023-07-07T00:00:00-04:00\", \"title\": \"NOAA Annual Greenhouse Gas Index\", \"description\": \"This visualization of the NOAA Annual Greenhouse Gas Index shows the relative warming contribution from various greenhouse gasses (1979-2022). The donut chart shows 2022 AGGI data. || The NOAA Annual Greenhouse Gas Index (AGGI) tracks the increasing amount of heat being added to the atmosphere by human-related greenhouse gas (GHG) emissions. It is based on the highest quality measurements of GHGs in the atmosphere from sites around the world. This visualization contains data from 1979-2022. The quantity plotted is the global radiative forcing, which is a measure of how much each component is warming the Earth. The 'other' category includes hydrofluorocarbons (HFCs), Chlorofluorocarbons (CFCs), and hydrochlorofluorocarbons (HCFCs). The donut chart shows the 2022 data. This visualization, aimed at showing the relative contributions of each gas, leaves off the scale and units. In 2022 the total radiative forcing was 3.4 Watts per meter squared. || \", \"hits\": 63 }, { \"id\": 5121, \"url\": \"https://svs.gsfc.nasa.gov/5121/\", \"result_type\": \"Visualization\", \"release_date\": \"2023-06-30T00:00:00-04:00\", \"title\": \"ODIAC: a map of human made carbon dioxide emissions\", \"description\": \"ODIAC (Open-source Data Inventory for Anthropogenic CO2) map for December 2021. || The Open-source Data Inventory for Anthropogenic CO2 (A.K.A. ODIAC) is a global high-resolution (1x1km) emission data product for fossil fuel carbon dioxide (CO2) emission. ODIAC was originally designed and developed under the Greenhouse gas Observing SATellite (GOSAT) project at Japan’s National Institute for Environmental Studies (NIES). Since then, ODIAC has been maintained at the Universities Space Research Association (USRA) in collaboration with NASA, NIES and the Appalachian State University. ODIAC pioneered the combined use of space-based nighttime light data and individual power plant emission/location profiles to estimate the global spatial extent of fossil fuel CO2 emissions. ODIAC has been a key input data for NASA’s carbon modeling. ODIAC has been also widely used in the international science research community for a variety of applications across key policy relevant scales (global to local). || \", \"hits\": 146 }, . . . ] },"
              - generic [ref=f3e218]: "Note: only the first two results are included for brevity."
              - paragraph [ref=f3e219]: "The response will always contain the following fields:"
              - list [ref=f3e220]:
                - listitem [ref=f3e221]:
                  - code [ref=f3e222]: count
                  - text: "- The total number of results for the given query, regardless of which page or how many results are currently being shown."
                - listitem [ref=f3e223]:
                  - code [ref=f3e224]: next
                  - text: "- The URL that will display the next page of results, using the same"
                  - code [ref=f3e225]: limit
                  - text: as the current request. This field will be null if all of the results are being shown, or if the final page of results is being shown.
                - listitem [ref=f3e226]:
                  - code [ref=f3e227]: previous
                  - text: "- The URL that will display the previous page of results, using the same"
                  - code [ref=f3e228]: limit
                  - text: as the current request. This field will be null if all of the results are being shown, or if the first page of results is being shown.
                - listitem [ref=f3e229]:
                  - code [ref=f3e230]: results
                  - text: "- An array of results objects (see below)."
              - paragraph [ref=f3e231]: "Each individual result object contains the following fields:"
              - list [ref=f3e232]:
                - listitem [ref=f3e233]:
                  - code [ref=f3e234]: id
                  - text: "- The ID of the page that this result represents."
                - listitem [ref=f3e235]:
                  - code [ref=f3e236]: url
                  - text: "- The URL that this result links to."
                - listitem [ref=f3e237]:
                  - code [ref=f3e238]: result_type
                  - text: "- The type of result that this is."
                - listitem [ref=f3e239]:
                  - code [ref=f3e240]: release_date
                  - text: "- The date and time that this result was released."
                - listitem [ref=f3e241]:
                  - code [ref=f3e242]: title
                  - text: "- The title of this result."
                - listitem [ref=f3e243]:
                  - code [ref=f3e244]: description
                  - text: "- A (brief) description of this result."
                - listitem [ref=f3e245]:
                  - code [ref=f3e246]: hits
                  - text: "- The total number of views that the page this result represents has gotten over the past 10 days. Note: this number is updated daily between 2:00am ~ 4:00am ET"
            - generic [ref=f3e247]:
              - heading [level=3] [ref=f3e248]:
                - text: Page API
                - button "Copy a link to this section" [ref=f3e249] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f3e250]: 
              - paragraph [ref=f3e251]: The page API provides more detailed information on specific site pages. Whereas the search API's results provide a broad overview of a page, the page API provides the full breadth of information that the SVS has available for any given page. This allows for automatic querying of datasets, keywords, credit information, and many many more pieces of metadata about our visualizations.
              - paragraph [ref=f3e252]: "Currently, the page API supports:"
              - list [ref=f3e253]:
                - listitem [ref=f3e254]:
                  - text: Visualization pages (e.g
                  - link "https://svs.gsfc.nasa.gov/5101/ " [ref=f3e255] [cursor=pointer]:
                    - /url: https://svs.gsfc.nasa.gov/5101/
                    - text: https://svs.gsfc.nasa.gov/5101/
                    - generic "Open this url in a new tab" [ref=f3e256]: 
                  - text: )
                - listitem [ref=f3e257]:
                  - text: Gallery pages (e.g
                  - link "https://svs.gsfc.nasa.gov/new/gallery/ " [ref=f3e258] [cursor=pointer]:
                    - /url: https://svs.gsfc.nasa.gov/gallery/the-galleries/
                    - text: https://svs.gsfc.nasa.gov/new/gallery/
                    - generic "Open this url in a new tab" [ref=f3e259]: 
                  - text: )
              - paragraph [ref=f3e260]:
