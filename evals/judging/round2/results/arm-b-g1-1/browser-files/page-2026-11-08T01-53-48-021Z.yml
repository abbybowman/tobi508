                      - paragraph [ref=f2e627]: "The NASA-funded Nationwide Eclipse Ballooning Project allows teams of students from across the U.S. to get a unique view of total solar eclipses with scientific balloons. Before, during, and after a total solar eclipse, teams of college and high-school students use balloons to fly cameras and scientific instruments — either off-the-shelf weather sensors or instruments they built themselves — into the stratosphere to investigate the Sun, the eclipse’s effects on our atmosphere, and other phenomena that are best studied at high altitudes. Started in 2014, the project has not only produced new discoveries but provided hundreds of students with hands-on science and engineering experience along the way.Learn more about the project: https://science.nasa.gov/science-research/heliophysics/nasa-science-soars-during-august-total-solar-eclipse/ || || 15063 || Nationwide Eclipse Ballooning Project || The NASA-funded Nationwide Eclipse Ballooning Project allows teams of students from across the U.S. to get a unique view of total solar eclipses with scientific balloons. Before, during, and after a total solar eclipse, teams of college and high-school students use balloons to fly cameras and scientific instruments — either off-the-shelf weather sensors or instruments they built themselves — into the stratosphere to investigate the Sun, the eclipse’s effects on our atmosphere, and other phenomena that are best studied at high altitudes. Started in 2014, the project has not only produced new discoveries but provided hundreds of students with hands-on science and engineering experience along the way.Learn more about the project: https://science.nasa.gov/science-research/heliophysics/nasa-science-soars-during-august-total-solar-eclipse/ || Produced VideoWatch this video on the NASA Goddard YouTube channel.Complete transcript available.Music Credit: \"Good To Go” by Doug Petty [ASCAP] from Universal Production MusicAdditional Video: Nationwide Eclipse Ballooning Project || 15063_Thumbnail.jpg (1280x720) [490.4 KB] || 15063_Thumbnail_print.jpg (1024x576) [411.4 KB] || 15063_Thumbnail_searchweb.png (320x180) [97.1 KB] || 15063_Thumbnail_web.png (320x180) [97.1 KB] || 15063_Thumbnail_thm.png (80x40) [16.8 KB] || 15063_NEBPoverview_1080_X.mp4 (1920x1080) [84.2 MB] || 15063_NEBPoverview.en_US.srt [2.6 KB] || 15063_NEBPoverview.en_US.vtt [2.5 KB] || 15063_NEBPoverview_4K_ProRes.webm (3840x2160) [38.5 MB] || 15063_NEBPoverview_4K_Facebook.mp4 (3840x2160) [326.3 MB] || 15063_NEBPoverview_4K_YouTube.mp4 (3840x2160) [538.9 MB] || 15063_NEBPoverview_4K_ProRes.mov (3840x2160) [6.0 GB] || Earth || Planets & Moons || Sun || Atmosphere || Atmospheric Chemistry/Oxygen Compounds || Atmospheric Gravity Waves || Balloon || Camera || Earth Science || Eclipse || Eclipse experiments || Launch || ozone || Solar Eclipse || Stratosphere || Students || total solar eclipse || Narrated Movies || Lacey Young (eMITS) as Producer || Lacey Young (eMITS) as Videographer || Joy Ng (eMITS) as Videographer || Beth Anthony (eMITS) as Videographer || Angela des Jardins (Montana State University) as Talent || Angela Vazzana (CyPrESS) as Narrator ||"
