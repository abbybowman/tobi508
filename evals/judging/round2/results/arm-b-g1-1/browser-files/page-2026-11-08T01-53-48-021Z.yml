                      - paragraph [ref=f2e574]:
                        - text: "On August 12, 2026, a total solar eclipse will cross the Northern Hemisphere. This visualization presents a high-resolution, simulated view of Earth from space between August 9–13, 2026, using the GEOS-CAM model. By applying the GOES true color algorithm to simulated radiation data, it generates realistic imagery incorporating aerosols like dust and smoke. This helps infer localized visibility along the path of totality. || 5670 || High-Resolution True Color Earth Imagery Simulated by GEOS During the 2026 Total Solar Eclipse || On August 12, 2026, a total solar eclipse will cross the Northern Hemisphere. This visualization presents a high-resolution, simulated view of Earth from space between August 9–13, 2026, using the GEOS-CAM model. By applying the GOES true color algorithm to simulated radiation data, it generates realistic imagery incorporating aerosols like dust and smoke. This helps infer localized visibility along the path of totality. || GEOSTrueColor_SolarEclipse_1920x1080.mp4 (1920x1080) [53.9 MB] || GEOSTrueColor_SolarEclipse_5760x3240.mp4 (5760x3240) [107.7 MB] || GEOSTrueColor_SolarEclipse_1920x1080.png (1920x1080) [1.9 MB] || GEOSTrueColor_SolarEclipse_3840x2160.png (3840x2160) [6.1 MB] || GEOSTrueColor_SolarEclipse_5760x3240.png (5760x3240) [11.9 MB] || On Wednesday, August 12, 2026, the Moon passes in front of the Sun, casting its shadow across a wide swath of Earth's Northern Hemisphere. The path of totality begins in far northern Siberia near the North Pole, and travels south through the Arctic and North Atlantic oceans, passing over Iceland and Spain. Meanwhile, the rest of Europe and parts of North America and Africa experience a partial eclipse.To anticipate viewing conditions for this event, this visualization presents a high-resolution, model-simulated view of Earth spanning the period of August 9–13, 2026, using the GEOS-CAM model. GEOS-CAM simulates multiple bands of incoming and outgoing shortwave radiation, analogous to the observational data collected by GOES satellites. By applying the GOES true color (GeoColor) algorithm to these model-generated fields, this visualization derives a realistic representation of how the Earth will appear from space. Crucially, the simulation incorporates the atmospheric impacts of aerosols such as dust and smoke, making the resulting imagery a valuable tool for inferring localized visibility conditions along the path of totality.For more detailed information about the eclipse, visit:"
                        - link "Map of the August 12, 2026, Total Solar Eclipse" [ref=f2e575] [cursor=pointer]:
                          - /url: https://svs.gsfc.nasa.gov/5647
                        - text: "|| Simulated view of Earth on August 12, 2026, at 18:30 UTC, showing true-color GEOS-CAM model imagery with the solar eclipse path. || GEOSTrueColor_SolarEclipse_2026_08_12_18_30UTC_SolarEclipsePath_1920x1080.png (1920x1080) [1.8 MB] || GEOSTrueColor_SolarEclipse_2026_08_12_18_30UTC_SolarEclipsePath_5760x3240.png (5760x3240) [11.8 MB] || Simulated view of Earth on August 12, 2026, at 18:30 UTC, showing true color GEOS-CAM model imagery. || GEOSTrueColor_SolarEclipse_2026_08_12_18_30UTC_Plain_1920x1080.png (1920x1080) [1.7 MB] || GEOSTrueColor_SolarEclipse_2026_08_12_18_30UTC_Plain_5760x3240.png (5760x3240) [11.4 MB] || A high-resolution, simulated view of Earth on August 12, 2026, at 18:30 UTC, showing true-color GEOS-CAM model imagery of Earth on August 12, 2026, at 18:30 UTC. || GEOSTrueColor_Global_2026_08_12_18_30UTC_1920x1080.png (1920x1080) [3.4 MB] || GEOSTrueColor_Global_2026_08_12_18_30UTC_7680x4320.png (7680x4320) [41.7 MB] || Earth || Planets & Moons || Sun || Eclipse || GEOS || Models || Moon || Solar Eclipse || Sun and Earth || Sun-earth Interactions || Sun-Earth-Moon Interactions || GEOS-CAM (Goddard Earth Observing System Convection-Allowing Model framework) || William Putman (NASA/GSFC) as Data visualizer || Ernie Wright (USRA) as Data visualizer || Joseph V. Ardizzone (NASA/GSFC) as Data visualizer || Helen-Nicole Kostis (Science and Technology Corporation) as Data visualizer || Allison Collow (University of Maryland Baltimore County) as Scientific Support ||"
