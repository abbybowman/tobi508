                      - paragraph [ref=f2e652]:
                        - text: On Wednesday, August 12, 2026, the Moon passes in front of the Sun, casting its shadow across a broad swath of Earth's northern hemisphere. Totality is visible in Spain and Iceland, while the rest of Europe and parts of North America and Africa experience a partial eclipse. || 5656 || Animations of the August 12, 2026, Total Solar Eclipse ||
                        - strong [ref=f2e653]: Following the shadow
                        - text: ": An animated visualization of the path of the August 12, 2026, total solar eclipse. The virtual camera follows the shadow. Country borders revised on August 19, 2026. || eclipse_202608_global_720p30.mp4 (1280x720) [10.2 MB] || eclipse_202608_global_2160p30.mp4 (3840x2160) [52.7 MB] || eclipse_202608_global_1080p30.mp4 (1920x1080) [19.1 MB] || eclipse_202608_global_360p30.mp4 (640x360) [3.3 MB] || global (3840x2160) [1583 Item(s)] || global_preview.jpg (1920x1080) [301.1 KB] || On Wednesday, August 12, 2026, the Moon passes in front of the Sun, casting its shadow across a wide swath of Earth's Northern Hemisphere. The path of totality begins in far northern Siberia, near the North Pole, and travels south through the oceans of the Arctic and North Atlantic, passing over western Iceland (including Reykjavik) and northern Spain. The rest of Europe and parts of North America and Africa experience a partial eclipse.The Moon's shadow can be divided into two parts: the very narrow"
                        - strong [ref=f2e654]: umbra
                        - text: ", where the Sun is completely blocked, and the much broader"
                        - strong [ref=f2e655]: penumbra
                        - text: ", where the Sun is only partially blocked. The red swath marks the path of totality, where a total solar eclipse is visible. The black oval traveling along this path is the umbra. The penumbra is rendered in discrete shades in 20% intervals of obscuration (area of the Sun blocked by the Moon). Loops at either end of the path indicate where the eclipse is in progress during sunrise or sunset.In the first animation, captioned \"Following the shadow,\" the virtual camera flies on a path that keeps the shadow near the center of the view but makes Earth's rotation difficult to discern. In the second animation, captioned \"Fixed in space,\" the camera doesn't move. Strictly speaking, the camera is stationary in the J2000 coordinate system centered on Earth — nothing is truly motionless except in relation to a particular reference. Other views are stationary over Iceland and Spain and over the United States. ||"
                        - strong [ref=f2e656]: Fixed in space
                        - text: ": An animated visualization of the August 12, 2026, total solar eclipse. The virtual camera is located at a fixed point in space, making Earth's rotation easier to see. Country borders revised on August 19, 2026. || eclipse_202608_gei_720p30.mp4 (1280x720) [11.0 MB] || eclipse_202608_gei_2160p30.mp4 (3840x2160) [57.2 MB] || eclipse_202608_gei_1080p30.mp4 (1920x1080) [20.8 MB] || eclipse_202608_gei_360p30.mp4 (640x360) [4.3 MB] || gei_preview.jpg (1920x1080) [292.5 KB] || gei (3840x2160) [1583 Item(s)] || An animated visualization of the August 12, 2026, total solar eclipse, in a vertical aspect ratio suitable for mobile devices. The virtual camera follows the shadow. Country borders revised on August 19, 2026. || eclipse_202608_global_v_1920p30.mp4 (1080x1920) [21.1 MB] || global_v_preview.jpg (1080x1920) [288.1 KB] || global (1080x1920) [1583 Item(s)] || An animated visualization of the August 12, 2026, total solar eclipse. This closer view is stationary over Iceland and Spain. The movie with the filename ending in \"p0.1.mp4\" plays in real time and can be synchronized with the event. Country borders revised on August 19, 2026. || eclipse_202608_is_es_720p30.mp4 (1280x720) [7.4 MB] || eclipse_202608_is_es_2160p30.mp4 (3840x2160) [41.7 MB] || eclipse_202608_is_es_2160p0.1.mp4 (3840x2160) [305.0 MB] || eclipse_202608_is_es_1080p30.mp4 (1920x1080) [14.4 MB] || eclipse_202608_is_es_360p30.mp4 (640x360) [2.4 MB] || is_es (3840x2160) [1063 Item(s)] || is_es_preview.jpg (1920x1080) [301.5 KB] || An animated visualization of the August 12, 2026, total solar eclipse, in a vertical aspect suitable for mobile devices. The view is stationary over Iceland and Spain. || eclipse_202608_is_es_v_1920p30.mp4 (1080x1920) [11.4 MB] || is_es_v_preview.jpg (1080x1920) [211.3 KB] || is_es (1080x1920) [1063 Item(s)] || An animated visualization of the August 12, 2026, total solar eclipse. This view is stationary over the United States, where the eclipse is partial in the Northeast and parts of the Mid-Atlantic and Upper Midwest and is not visible elsewhere in the country. The movie with the filename ending in \"p0.1.mp4\" plays in real time and can be synchronized with the event. || eclipse_202608_us_720p30.mp4 (1280x720) [10.1 MB] || eclipse_202608_us_2160p30.mp4 (3840x2160) [50.6 MB] || eclipse_202608_us_2160p0.1.mp4 (3840x2160) [291.6 MB] || eclipse_202608_us_1080p30.mp4 (1920x1080) [19.1 MB] || eclipse_202608_us_360p30.mp4 (640x360) [3.1 MB] || us_preview.jpg (1920x1080) [492.0 KB] || us (3840x2160) [1080 Item(s)] || Earth || Planets & Moons || Sun || Eclipse || Moon || solar irradiance || Sun || Sun-Earth-Moon Interactions || total solar eclipse || DE421 (JPL DE421) || BMNG (Blue Marble: Next Generation) [Terra and Aqua: MODIS] || Five Millennium Canon of Solar Eclipses (Five Millennium Canon of Solar Eclipses) || LSIB (Large Scale International Boundaries) || Ernie Wright (USRA) as Visualizer || Joy Ng (eMITS) as Producer ||"
