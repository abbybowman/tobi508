                        - text: On August 28, 2026 (the evening of the 27th in some time zones), the Moon passes into the shadow of Earth, creating a deep partial lunar eclipse. At the moment of greatest eclipse, 4:13 a.m. Univeral Time, 96.3% of the Moon's disk will be within Earth's umbra. The Americas are centrally located for observing this eclipse. || 5672 || August 27-28, 2026 Deep Partial Lunar Eclipse || The Moon moves right to left through Earth's penumbra and umbra shadows. At various times, a copy of the Moon is left behind along with its associated UTC time, and this forms a lunar eclipse diagram showing different stages of the eclipse. || eclipse_202608_movie.jpg (1920x1080) [186.0 KB] || eclipse_202608_utc_720p30.mp4 (1280x720) [7.6 MB] || eclipse_202608_utc_2160p30.mp4 (3840x2160) [38.8 MB] || eclipse_202608_utc_1080p30.mp4 (1920x1080) [13.8 MB] || eclipse_202608_utc_360p30.mp4 (640x360) [2.8 MB] || 3840x2160_16x9_30p (3840x2160) [2791 Item(s)] || On August 28, 2026 (the evening of the 27th in some time zones), the Moon passes into the shadow of Earth, creating a deep partial eclipse. At the moment of greatest eclipse, 4:13 a.m. Universal Time, 96.3% of the Moon's disk is within Earth's umbra, the central part of the shadow where the Sun is completely blocked by Earth. This part of the eclipse is visible in the Americas (except Alaska and northwestern Canada), western Europe and western Africa.The penumbra is the part of Earth's shadow where the Sun is only partially covered by Earth. The effect of the penumbra on the Moon's appearance is subtle. But after the partial phase begins, at 2:34 UTC (10:34 p.m. Eastern on the night of the 27th), the umbra's dramatic effect is easily visible as it takes an increasingly large bite out of the disk of the full Moon. Less than an hour later, the part of the Moon still in sunlight will be small enough for observers' eyes to adapt to darkness and perceive the coppery color of the part of the Moon within the umbra. The visualizations here mimic this dark adaptation by increasing the apparent photographic exposure around the time of greatest eclipse.This eclipse is a member of
                        - link "Saros 138" [ref=f2e501] [cursor=pointer]:
                          - /url: https://eclipse.gsfc.nasa.gov/LEsaros/LEsaros138.html
                        - text: . The eclipses in a given
                        - link "saros series" [ref=f2e502] [cursor=pointer]:
                          - /url: https://en.wikipedia.org/wiki/Saros_(astronomy)
                        - text: are separated by 18 years, 11 days, 8 hours. The previous eclipse in this saros series occurred on August 16, 2008, and the next takes place on September 7, 2044. || Obscuration Versus Magnitude || Two measures are used to describe how much of the Moon is within the umbra shadow at the height of a lunar eclipse. Umbra magnitude, the value found for example on
                        - link "Fred Espenak's NASA eclipse site" [ref=f2e503] [cursor=pointer]:
                          - /url: https://eclipse.gsfc.nasa.gov/LEdecade/LEdecade2021.html
                        - text: ", is the fraction of the"
                        - strong [ref=f2e504]: diameter
                        - text: of the Moon covered by the umbra, while obscuration (the 96.3% number here) is the
                        - strong [ref=f2e505]: area
                        - text: covered by the umbra.Magnitude is easier to calculate and can tell you something extra about the nature of an eclipse. Eclipse magnitude can be greater than 1.0 or less than 0.0. Values greater than 1.0 indicate the depth and duration of totality by measuring how close the Moon gets to the center of the umbra. Negative magnitudes denote penumbral eclipses, when the Moon misses the umbra entirely. In natural language, the magnitude of a partial lunar eclipse should be qualified by saying something like "93% of
                        - strong [ref=f2e506]: the width of
                        - text: "the Moon\" will be within the umbra. For total and penumbral eclipses, such as the June 2029 total lunar eclipse at magnitude 1.84, this phrasing can't express what the number means.Obscuration is more intuitive — it's always between 0 and 1 — and it more closely matches the visual experience. You can say without qualification that \"96.3% of the Moon's disk\" will be within the umbra. || A still image of the eclipse diagram. || eclipse_202608_utc_preview.jpg (1920x1080) [190.4 KB] || eclipse_202608_utc.tif (3840x2160) [2.8 MB] || A world map showing where the eclipse is visible at different phases. Contours mark the boundary around the part of Earth where each phase is visible. The start of the partial phase, for example, is visible everywhere within the orange contour. The map is centered on 63°8'W, the sublunar point at greatest eclipse (the longitude where the Moon is highest in the sky). The eclipse can't be seen in the gray areas outside the contours. || eclipse_202608_vismap_preview.jpg (1920x1080) [352.8 KB] || eclipse_202608_vismap.tif (3840x2160) [6.2 MB] || Earth || Planets & Moons || Sun || Blood Moon || LRO || Lunar Eclipse || Lunar Reconnaissance Orbiter || Moon || Sun-Earth-Moon Interactions || LRO (Lunar Reconnaissance Orbiter) || DE421 (JPL DE421) || LROC WAC Color Mosaic (Natural Color Hapke Normalized WAC Mosaic) [Lunar Reconnaissance Orbiter: LRO Camera] || DEM (Digital Elevation Map) [LRO: LOLA] || 5MCLE (Five Millennium Canon of Lunar Eclipses) || Ernie Wright (Science and Technology Corporation) as Visualizer ||"
