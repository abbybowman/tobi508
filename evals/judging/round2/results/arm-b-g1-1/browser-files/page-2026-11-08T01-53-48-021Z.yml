                      - paragraph [ref=f2e598]:
                        - text: "On August 12, 2026, a total solar eclipse will cross Russia, Greenland, Iceland, Spain, and Portugal. But some of the best views will come from 50,000 feet up, aboard NASA's WB-57 jet.Flying through the stratosphere, the jet’s instruments study the eclipse from above most of Earth’s atmosphere, avoiding the clouds, dust, and water vapor that can blur the view.As the Moon's shadow races across the ground, the crew pushes the high-speed jet to stay inside totality for as long as possible, giving scientists and their instruments extra time to study the Sun.Learn more: https://science.nasa.gov/science-research/heliophysics/nasa-science-soars-during-august-total-solar-eclipse/ || || 15065 || Chasing Eclipses with NASA Pilots || On August 12, 2026, a total solar eclipse will cross Russia, Greenland, Iceland, Spain, and Portugal. But some of the best views will come from 50,000 feet up, aboard NASA's WB-57 jet.Flying through the stratosphere, the jet’s instruments study the eclipse from above most of Earth’s atmosphere, avoiding the clouds, dust, and water vapor that can blur the view.As the Moon's shadow races across the ground, the crew pushes the high-speed jet to stay inside totality for as long as possible, giving scientists and their instruments extra time to study the Sun.Learn more: https://science.nasa.gov/science-research/heliophysics/nasa-science-soars-during-august-total-solar-eclipse/ || Complete transcript available.Watch this video on the NASA Goddard YouTube channel.Music Credit: “Uncovered Discovered” by Emanuel Kallins [BMI] and Chieli Minucci [ASCAP] from Universal Production Music || 15065_Thumbnail.jpg (1280x720) [647.4 KB] || 15065_Thumbnail_print.jpg (1024x576) [535.4 KB] || 15065_Thumbnail_searchweb.png (320x180) [102.3 KB] || 15065_Thumbnail_web.png (320x180) [102.3 KB] || 15065_Thumbnail_thm.png (80x40) [7.8 KB] || 15065_ChasingEclipsesWithNASAPilots_H264_3.mp4 (1920x1080) [203.2 MB] || 15065_ChasingEclipsesWithNAS