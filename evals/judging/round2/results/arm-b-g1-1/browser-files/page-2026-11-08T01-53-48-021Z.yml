                        - text: Boulder, Colorado
                        - emphasis [ref=f2e407]: Chicago, Illinois
                        - text: Greenbelt, Maryland (NASA’s Goddard Space Flight Center)
                        - emphasis [ref=f2e408]: Goldstone, California
                        - text: Honolulu, Hawaii
                        - emphasis [ref=f2e409]: New York, New York
                        - text: Portland, Oregon
                        - emphasis [ref=f2e410]: Seattle, Washington
                        - text: Tempe, Arizona
                        - emphasis [ref=f2e411]:
