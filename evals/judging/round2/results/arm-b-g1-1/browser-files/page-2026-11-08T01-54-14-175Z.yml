              - generic [ref=f6e1516]:
                - heading [level=3] [ref=f6e1517]:
                  - link "Conceptual Image Lab (CI Labs)" [ref=f6e1518] [cursor=pointer]:
                    - /url: /cilab/index.html
                - paragraph [ref=f6e1519]: NASA's CI Lab is an award-winning studio with artists who work closely with astronomers, scientists and engineers to bring scientific theory, design and concepts to life in an accurate, yet visually compelling way.
            - generic [ref=f6e1521]:
              - link [ref=f6e1522] [cursor=pointer]:
                - /url: /search/?studio=GMS
                - img "A picture of people in a TV studio. On the left side of the image, there are a number of cameras and recording equipment. On the right, there is a set with people standing in front of an image of the Earth, taken from orbit. The logo of Goddard Media Studios is overlayed on the picture." [ref=f6e1523]
              - generic [ref=f6e1524]:
                - heading [level=3] [ref=f6e1525]:
                  - link "Goddard Media Studios (GMS)" [ref=f6e1526] [cursor=pointer]:
                    - /url: /search/?studio=GMS
                - paragraph [ref=f6e1527]: With a passionate commitment for broadly sharing NASA’s bold research initiatives, The Goddard Media Studio tells stories like no one else in the universe. Fielding an impressive team of producers, animators, editors, and more, The Studio fuses hard science with exciting imagination to explain, translate, and ultimately inspire.
            - generic [ref=f6e1529]:
              - link [ref=f6e1530] [cursor=pointer]:
                - /url: /search/?made_for=HW
                - img "A picture of a man in front of the NASA hyperwall -- a wall-sized display composed of many smaller screens. The hyperwall is currently displaying a map of the Earth covered in clouds. The text 'hyperwall' is overlayed on the picture." [ref=f6e1531]
              - generic [ref=f6e1532]:
                - heading [level=3] [ref=f6e1533]:
                  - link "Scientific Hyperwall Presentations" [ref=f6e1534] [cursor=pointer]:
                    - /url: /search/?made_for=HW
                - paragraph [ref=f6e1535]: The Hyperwall is a big beautiful “wall" of high-definition screens used to display NASA’s latest and greatest data visualizations, images, videos, and other presentation material, and is a primary outreach platform for NASA’s Science Mission Directorate. Existing Hyperwall stories highlight themes in Earth science, heliophysics, planetary science, and astrophysics. The Scientific Visualization Studio developed the Hyperwall software.
