                  - link "ESCAPADE – Escape and Plasma Acceleration and Dynamics Explorer" [ref=f6e728] [cursor=pointer]:
                    - /url: /gallery/escapade/
                - generic [ref=f6e729]: September 4, 2024
                - paragraph [ref=f6e732]: "Using two identical spacecraft in orbit around Mars, the Escape and Plasma Acceleration and Dynamics Explorers (ESCAPADE) mission will investigate how a stream of charged particles from the Sun called the solar wind interacts with Mars’ magnetic environment and how this interaction drives the planet’s atmospheric escape. The first coordinated multi-spacecraft orbital science mission to the Red Planet, ESCAPADE will use its twin orbiters to take simultaneous observations from different locations around Mars to reveal the planet’s real-time response to space weather and how the Martian magnetosphere changes over time. The data returned from ESCAPADE will provide new insight into the evolution of Mars’ climate, helping to understand how Mars began losing its atmosphere and water.ESCAPADE launched on Nov. 13, 2025, from NASA’s Kennedy Space Center in Florida and is expected to reach Mars in September 2027.Learn more: https://science.nasa.gov/mission/escapade/ || ESCAPADE – Escape and Plasma Acceleration and Dynamics Explorer || Overview || Using two identical spacecraft in orbit around Mars, the Escape and Plasma Acceleration and Dynamics Explorers (ESCAPADE) mission will investigate how a stream of charged particles from the Sun called the solar wind interacts with Mars’ magnetic environment and how this interaction drives the planet’s atmospheric escape. The first coordinated multi-spacecraft orbital science mission to the Red Planet, ESCAPADE will use its twin orbiters to take simultaneous observations from different locations around Mars to reveal the planet’s real-time response to space weather and how the Martian magnetosphere changes over time. The data returned from ESCAPADE will provide new insight into the evolution of Mars’ climate, helping to understand how Mars began losing its atmosphere and water.ESCAPADE launched on Nov. 13, 2025, from NASA’s Kennedy Space Center in Florida and is expected to reach Mars in September 2027.Learn more: https://science.nasa.gov/mission/escapade/ || Produced Content || 14925: Intense Solar Storm Delays ESCAPADE Launch || 14920: Preparing for Martian Explorers: NASA's ESC... || 14664: ESCAPADE Mission Trailer || ESCAPADE Animations || 14635: ESCAPADE Mission Spacecraft Beauty Passes || 14666: ESCAPADE Launch Phase and Deployment Animat... || 14915: ESCAPADE Trajectory Animations || 5503: ESCAPADE Theoretical Flight Through Active M... || 5617: ESCAPADE Visits the Distant Magnetotail || ESCAPADE B-Roll || 14926: ESCAPADE Launch || 14918: ESCAPADE Prepares for Flight (2025) || 14675: ESCAPADE Testing and Integration || 14667: ESCAPADE Instrument Build and Testing || 14665: ESCAPADE Spacecraft Development Images || ESCAPADE Graphics || 15114: Star Charts for ESCAPADE’s Earth Flyby || 14641: ESCAPADE Mission Posters || 14642: ESCAPADE Spacecraft Specifications || Space Weather at Mars || 5503: ESCAPADE Theoretical Flight Through Active M... || 4370: Solar Wind Strips the Martian Atmosphere || 12046: Stripping the Martian Atmosphere || 20297: Magnetospheres of our Solar System || 11037: MAVEN: Mars Atmospheric Loss || 20152: Magnetic Fields on Mars || 13016: Mars Evolution from Wet to Dry || 20201: Mars Transition || 11025: Mars Climate Transition Animations: \"Dry\" M... || 4730: MAVEN – Mars Electric Current Systems || Solar Activity || 14126: SDO Video Toolkit || 14588: May 2-10, 2024 : A Busy Week of Flares || 11558: NASA's Many Views of a Massive CME || 20320: Solar Energetic Particles || 20192: Space Weather || 11150: Space Weather Forecast || 11670: Sun Emits Mid-Level Flare on October 2, 201... || 3956: Halloween Solar Storms - 2003 || 4909: Monster Solar Filament Launch and CME || 13778: Solar Activity Continues to Rise with 'Anem... || 4680: Space Weather to the Edge of the Solar Syste... || 20035: Coronal Mass Ejections Reach the Heliopause || 20043: Coronal Mass Ejections Blast their Way Thro... ||"
