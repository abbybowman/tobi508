                - paragraph [ref=f6e1258]: At 4.3 light-years away, Alpha Centauri A and B are the nearest Sun-like stars to our solar system. They orbit with Proxima Centauri as a triple star system.Alpha Centauri A is a Class G star that is 1.1 times the mass of the Sun. Alpha Centauri B is slightly cooler Class K star that is 0.9 times the mass of the Sun. Proxima Centauri, the closest star to the Sun, is a much smaller and cooler star, called a red dwarf. While no planets have been found around Alpha Centauri A or B, Proxima Centauri has two confirmed planets. || || 20377 || Alpha Centauri Stellar System || At 4.3 light-years away, Alpha Centauri A and B are the nearest Sun-like stars to our solar system. They orbit with Proxima Centauri as a triple star system.Alpha Centauri A is a Class G star that is 1.1 times the mass of the Sun. Alpha Centauri B is slightly cooler Class K star that is 0.9 times the mass of the Sun. Proxima Centauri, the closest star to the Sun, is a much smaller and cooler star, called a red dwarf. While no planets have been found around Alpha Centauri A or B, Proxima Centauri has two confirmed planets. || Pan from our Sun to the Alpha Centauri Stellar System || Shot_1-2_ProRes_notext.00018_print.jpg (1024x576) [78.3 KB] || Shot_1-2_withtextH.264.mov (1920x1080) [154.3 MB] || Shot_1-2_withtextH.264.webm (1920x1080) [1.6 MB] || Shot_1-2_H264_notext.mov (1920x1080) [240.2 MB] || Shot_1-2_ProRes_notext.mov (3840x2160) [475.7 MB] || || An alternate view || Alternate_Shot2-1.00016_print.jpg (1024x576) [38.5 KB] || Alternate_Shot2-1.00016_searchweb.png (320x180) [24.8 KB] || Alternate_Shot2-1.00016_web.png (320x180) [24.8 KB] || Alternate_Shot2-1.00016_thm.png (80x40) [3.2 KB] || Alternate_Shot2-1_ProRes.mov (1920x1080) [122.9 MB] || Alternate_Shot2-1.webm (3840x2160) [3.3 MB] || Alternate_Shot2-1_H264.mov (3840x2160) [467.3 MB] || || Pan from our sun to the Alpha Centauri Stellar system 4.3 Light-years away. || Shot_3_H264_withtext.00001_print.jpg (1024x576) [55.8 KB] || Shot_3_H264_withtext.00001_searchweb.png (320x180) [32.4 KB] || Shot_3_H264_withtext.00001_thm.png (80x40) [3.5 KB] || Shot_3_withtext_prores.mov (1920x1080) [137.9 MB] || Shot_3_H264_withtext.webm (1920x1080) [1.3 MB] || Shot_3_H264_withtext.mp4 (1920x1080) [12.2 MB] || Shot_3_H264_notext.mp4 (1920x1080) [20.6 MB] || Shot_3_ProRes_notext.mov (3840x2160) [350.5 MB] || || An alternate view || Shot_3_Alternate_H.264.00016_print.jpg (1024x864) [63.5 KB] || Shot_3_Alternate_H.264.webm (1280x1080) [1.2 MB] || Shot_3_Alternate_H264.mp4 (1920x1080) [25.3 MB] || Shot_3_Alternate_H.264.mov (1280x1080) [160.8 MB] || Shot_3_Alternate_ProRes.mov (3840x2160) [437.4 MB] || || The Alpha Centauri system, with a focus on A and B. || Shot_4_withtext.H.264.00016_print.jpg (1024x864) [36.0 KB] || Shot_4_notext_H.264.mov (1920x1080) [130.1 MB] || Shot_4_withtext.H.264.webm (1280x1080) [1.5 MB] || Shot_4_withtext_prores.mov (1920x1080) [130.4 MB] || Shot_4_withtext.H.264.mov (1280x1080) [182.8 MB] || Shot_4_ProRes_notext.mov (3840x2160) [282.1 MB] || || An alternate view || Shot_4_Alternate.00016_print.jpg (1024x576) [31.0 KB] || Shot_4_Alternate.mov (3840x2160) [150.3 MB] || Shot_4_Alternate.webm (3840x2160) [560.7 KB] || || Universe || Jenny McElligott (Advocates in Manpower Management, Inc.) as Animator || Aaron E. Lepsch (ADNET Systems, Inc.) as Technical support || Joy Ng (KBR Wyle Services, LLC) as Producer || Miles S. Hatfield (Telophase) as Producer ||
