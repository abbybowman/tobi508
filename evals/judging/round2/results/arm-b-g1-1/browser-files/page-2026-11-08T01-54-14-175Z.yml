                  - generic [ref=f6e1096]: September 6, 2019
                  - 'link "NASA Science Category: Planets & Moons" [ref=f6e1098] [cursor=pointer]':
                    - /url: /search/?nasa_science_categories=Planets%20%26%20Moons
                    - generic [aria-hidden] [ref=f6e1099]: 
                - paragraph [ref=f6e1101]:
                  - text: These color and elevation maps are designed for use in 3D rendering software. They are created from data assembled by the Lunar Reconnaissance Orbiter camera and laser altimeter instrument teams. || 4720 || CGI Moon Kit || These color and elevation maps are designed for use in 3D rendering software. They are created from data assembled by the Lunar Reconnaissance Orbiter camera and laser altimeter instrument teams. || Color || The 2025 color map, available as a full-size float16 EXR file and as 16-bit TIFFs of various sizes. The EXR file is encoded in linear color with slightly more dynamic range, while the sRGB-encoded TIFFs are more broadly supported. The map is centered on 0° longitude. || lroc_color_2k.jpg (2048x1024) [447.2 KB] || lroc_color.exr [942.8 MB] || lroc_color_16bit_srgb.tif [2.4 GB] || lroc_color_16bit_srgb_16k.tif (16384x8192) [909.4 MB] || lroc_color_16bit_srgb_4k.tif (4096x2048) [59.0 MB] || lroc_color_16bit_srgb_8k.tif (8192x4096) [232.0 MB] || Two versions of the color map are now available. The newer version (above) was produced in December of 2025 using commercial image processing software. It preserves more of the color and dynamic range of the source data and adds greater detail in the polar regions. The original version (below), produced in 2019, has been used successfully in a number of visualizations.The color maps were adapted from the
                  - link "Hapke Normalized WAC Mosaic" [ref=f6e1102] [cursor=pointer]:
                    - /url: http://wms.lroc.asu.edu/lroc/view_rdr/WAC_HAPKE
                  - text: ", a composite built by the camera team from over 100,000 WAC (Wide Angle Camera) images. The"
                  - link "readme file" [ref=f6e1103] [cursor=pointer]:
                    - /url: https://pds.lroc.asu.edu/data/LRO-L-LROC-5-RDR-V1.0/LROLRC_2001/DATA/MDR/WAC_HAPKE/WAC_HAPKE_README.TXT
                  - text: provides a technical summary of how the mosaic was constructed along with references to more detailed publications. A less formal introduction to the process is in
                  - link "this LROC blog post" [ref=f6e1104] [cursor=pointer]:
                    - /url: https://lroc.im-ldi.com/news/707
                  - text: and in
                  - link "this one" [ref=f6e1105] [cursor=pointer]:
                    - /url: https://lroc.im-ldi.com/news/801
                  - text: .Both color maps were assembled from three of the seven wavelength bands of the LROC color data, with the 643 nm band representing the red channel, 566 nm the green, and 415 nm the blue. Exposure and white balance were adjusted to more closely match human vision, and small data dropouts at high latitudes were inpainted.The source data covers the lunar globe from 70°N to 70°S. Because the Moon's axial and orbital tilts are both small, many areas outside these latitudes remain shrouded in shadow, even after thousands of passes by LRO's camera, so they are left out of the LROC mosaic. For these color maps, the missing latitudes were filled in with a lower resolution monochromatic albedo map (
                  - link "LDAM" [ref=f6e1106] [cursor=pointer]:
                    - /url: http://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/data/lola_gdr/cylindrical/float_img/ldam_10_float.lbl
                  - text: ) from LRO's laser altimeter, which measures the brightness of the reflected laser. When rendered with realistic shadows, these parts of the map aren't particularly visible, and while they comprise more than 20% of the map's pixels, they represent only 6% of the Moon's surface.These image is optimized for aesthetics, not science. Scientific applications should use
                  - link "the source data" [ref=f6e1107] [cursor=pointer]:
                    - /url: http://wms.lroc.asu.edu/lroc/view_rdr/WAC_HAPKE
                  - text: . || The 2019 color map, available as 24-bit RGB TIFFs of various sizes. The map is centered on 0° longitude. || lroc_color_poles_1k.jpg (1024x512) [135.8 KB] || lroc_color_poles_1k_thm.png (80x40) [6.3 KB] || lroc_color_poles_2k.tif (2048x1024) [3.2 MB] || lroc_color_poles_8k.tif (8192x4096) [48.3 MB] || lroc_color_poles_4k.tif (4096x2048) [12.5 MB] || lroc_color_poles_hw5x3.tif (9600x3240) [49.1 MB] || lroc_color_poles_16k.tif (16384x8192) [178.3 MB] || lroc_color_poles.tif (27360x13680) [494.1 MB] || cgi-moon-kit-color.hwshow [188 bytes] || Displacement || The displacement map, at 64, 16, and 4 pixels per degree, centered on 0° longitude. Available as either floating-point TIFFs in kilometers, relative to a radius of 1737.4 km, or unsigned 16-bit TIFFs in half-meters, relative to a radius of 1727400 meters. || ldem_3_8bit.jpg (1024x512) [108.9 KB] || ldem_4.tif (1440x720) [4.0 MB] || ldem_4_uint.tif (1440x720) [2.0 MB] || ldem_16.tif (5760x2880) [63.3 MB] || ldem_16_uint.tif (5760x2880) [31.7 MB] || ldem_hw5x3.tif (9600x3240) [16.4 MB] || ldem_64_uint.tif (23040x11520) [506.3 MB] || ldem_64.tif (23040x11520) [1012.6 MB] || cgi-moon-kit-dem.hwshow [176 bytes] || The displacement map (also known as a height map or elevation map) was taken directly from the latest (as of spring 2019) gridded data products of the Lunar Orbiter Laser Altimeter instrument team.
                  - link "LOLA data is archived" [ref=f6e1108] [cursor=pointer]:
                    - /url: http://pds-geosciences.wustl.edu/missions/lro/lola.htm
                  - text: on the Geosciences Node of the Planetary Data System. A small subset of the LOLA data stored there, the global cylindrical projections at 4, 16, and 64 pixels per degree, has been reformatted here as uncompressed TIFF files, in vertical units of either floating-point kilometers or 16-bit unsigned integer half-meters.The reference surface for all LRO data is a sphere of radius 1737.4 km. LOLA's gridded elevation data is published as signed 16-bit integers in units of half-meters relative to this radius. For the floating-point TIFFs, the source data was divided by 2000. For the unsigned 16-bit TIFFs, the source data was offset by +20,000 (10 km) so that all of the values are positive. This latter format is provided for software that doesn't work well with either floating-point or signed integer files. || How These Maps Are Used || This animation illustrates how color and displacement maps are used in 3D animation software to paint and model an object like the Moon. || plane2sphere.0220_print.jpg (1024x576) [82.6 KB] || 1920x1080_16x9_30p (1920x1080) [300 Item(s)] || moon_mapping_1080p30.mp4 (1920x1080) [12.6 MB] || moon_mapping_720p30.mp4 (1280x720) [6.5 MB] || moon_mapping_720p30.webm (1280x720) [2.3 MB] || moon_mapping_360p30.mp4 (640x360) [1.8 MB] || moon_mapping_1080p30.mp4.hwshow [186 bytes] || Within 3D animation software, an object like the Moon begins as a simple geometric shape, in this case a sphere. Texture maps like the ones on this page are used to add detail to the model. The color map tells the software how to paint the surface, and the displacement map tells it how to add the shape details that define the lunar terrain. Without them, the Moon model is just a smooth, monochrome ball. Although these maps are flat rectangles, the software understands them as maps of a spherical surface and knows how to warp them onto spherical geometry.Each pixel in these texture maps corresponds to a point on the lunar surface defined by a longitude-latitude pair. Pixels in the color map contain the "base color" of the surface, before applying the effects of varying light and camera angles (called incidence angle
                  - emphasis [ref=f6e1109]: i
                  - text: and emission angle
                  - emphasis [ref=f6e1110]: e
                  - text: in the technical description). Pixels in the displacement map contain the height of the surface at the corresponding locations. || More Data || These maps are a tiny subset of
                  - link "the data publicly archived" [ref=f6e1111] [cursor=pointer]:
                    - /url: http://pds-geosciences.wustl.edu/missions/lro/
                  - text: by the LRO instrument teams. All of the data is in standard and fairly simple PDS file formats (files with ".IMG" filename extensions). Although not typically supported by general-purpose computer graphics software, these formats are directly readable by some GIS programs. The data formats are documented in PDS labels, which are either separate text files with a ".LBL" filename extension or embedded as fixed-length headers. Other than the possible header, most .IMG files are uncompressed 2D binary arrays of numbers. Some data is also available in TIFF or JPEG2000 formats.As of this writing, the best global-scale elevation data for equatorial and mid-latitude regions of the Moon, at resolutions up to 512 pixels per degree, is
                  - link "SLDEM2015" [ref=f6e1112] [cursor=pointer]:
                    - /url: http://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/data/sldem2015/
                  - text: . For regions near the poles, where the density of laser shots is much higher, the
                  - link "GDR data in polar stereo" [ref=f6e1113] [cursor=pointer]:
                    - /url: http://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/data/lola_gdr/polar/
                  - text: projection reaches resolutions of five meters per pixel.The LROC narrow-angle camera (NAC) has imaged most of the Moon's surface at a resolution of one meter per pixel or better. LROC imagery can be explored graphically using its
                  - link "Quickmap" [ref=f6e1114] [cursor=pointer]:
                    - /url: https://quickmap.lroc.asu.edu
                  - text: interface and searched on its
                  - link "RDR Product Select" [ref=f6e1115] [cursor=pointer]:
                    - /url: http://wms.lroc.asu.edu/lroc/rdr_product_select
                  - text: "page. Of particular interest are the Topographic Products (menu option in the upper left of the page), which are matched with high-resolution DEMs derived from stereo image pairs. This dataset includes all of the Apollo landing sites and dozens of other locations of interest. || Planets & Moons || Albedo || Elevation Map || HDTV || Hyperwall || Laser Altimeter || LOLA || LRO || LROC || Lunar Reconnaissance Orbiter || map || Mosaic || DEM (Digital Elevation Map) [LRO: LOLA] || LROC WAC Color Mosaic (Natural Color Hapke Normalized WAC Mosaic) [Lunar Reconnaissance Orbiter: LRO Camera] || Ernie Wright (USRA) as Visualizer || Noah Petro (NASA/GSFC) as Scientist ||"
