                - paragraph [ref=f6e1400]:
                  - text: "This page contains equirectangular versions of Perpetual Ocean 2's 'beauty version'. || 5505 || Perpetual Ocean 2: Equirectangular || # To view one of 70 high resolution subset movies, go to the"
                  - strong [ref=f6e1401]:
                    - link "picker page" [ref=f6e1402] [cursor=pointer]:
                      - /url: /vis/a000000/a005500/a005505/PCT_flow_map_ALL_noLabels_beauty.html
                  - text: "|| perpetual_ocean2_EQUIREC_071_final_beauty_level0_A_1.mp4 (4096x2048) [2.3 GB] || 16384x8192_2x1_60p (16384x8192) [7204 Item(s)] || 9600x3240_16x9_60p (9600x3240) [3601 Item(s)] || This is a visualization of ocean currents around the world. NASA’s ocean model, Estimating the Circulation and Climate of the Ocean (ECCO)), is used to visualize the currents. The ECCO ocean circulation model incorporates observations from spacecraft, buoys, and other in situ measurements to keep the model accurate. ECCO is a joint project between NASA/JPL and MIT. The model output used here is from ECCO-2 and covers the years 2021-2023.This page contains equirectangular versions of Perpetual Ocean 2's beauty pass. The beauty pass is the aesthetically pleasing version where what's driving the colors isn't as relevant. There are 7201 images rendered at very high resolution (16,384 x 8192 pixels per frame). These images total over 7 Terrabytes of data. You can download individual frames, all frames, or movies of subsections of these frames (see the picker below).In this visualization ocean currents at all depths are shown. Those closer to the surface (above 600 meters depth) are white while those from 600 meters depth and lower are darker and darker shades of blue). || The is a sample image showing the full resolution detail available from: • the smallest rectanglular regions available from the picker page• or from the high resolution source frames which are 16384 x 8192 pixels# To view one of 70 high resolution subset movies, go to the"
