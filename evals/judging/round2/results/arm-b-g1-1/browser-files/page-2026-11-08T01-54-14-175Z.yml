                - paragraph [ref=f6e906]: "Launching in 2021, NASA's Lucy spacecraft will be the first space mission to study the outer Solar System asteroids known as the Trojans, which are orbiting the same distance from the Sun as Jupiter. These fly-by encounters are planned to take place over a 12-year period. The instruments on board will collect data on surface geology, surface color and composition, the asteroids' interior and bulk properties, as well as any satellites and rings.Lucy is named for the famous Australopithecus afarensis hominid fossil that shed light on our early human ancestors. By making the first exploration of the Trojan asteroids, the Lucy mission will improve our understanding of the early solar system, and be the first to uncover these fossils of planet formation. || Lucy || Overview || Launching in 2021, NASA's Lucy spacecraft will be the first space mission to study the outer Solar System asteroids known as the Trojans, which are orbiting the same distance from the Sun as Jupiter. These fly-by encounters are planned to take place over a 12-year period. The instruments on board will collect data on surface geology, surface color and composition, the asteroids' interior and bulk properties, as well as any satellites and rings.Lucy is named for the famous Australopithecus afarensis hominid fossil that shed light on our early human ancestors. By making the first exploration of the Trojan asteroids, the Lucy mission will improve our understanding of the early solar system, and be the first to uncover these fossils of planet formation. || Multimedia || 5686: Lucy Mission Trajectory with Jupiter Trojans... || 5628: Lucy Observations of Asteroid Donaldjohanson || 14821: Lucy Will Explore Asteroid Donaldjohanson || 20402: Lucy Flyby of Asteroid Donaldjohanson: Anim... || 5525: Lucy Flyby of Asteroid Donaldjohanson Trajec... || 14734: Lucy Spacecraft’s Second Slingshot of Earth || 5429: Lucy Earth Gravity Assist 2 Trajectory Visua... || 14596: Lucy Sees Asteroid Dinkinesh in Detail || 14473: NASA's Lucy Mission Makes an Unexpected Dis... || 14426: NASA's Lucy Mission Flyby of Asteroid Dinki... || 5155: Lucy - Asteroid Dinkinesh Flyby || 14225: Lucy Spacecraft Will Slingshot Around Earth || 14224: Lucy's Journey: Episode 7 - \"Earth Gravity ... || 20372: Lucy Earth Gravity Assist One: Animations || 5044: Lucy Earth Gravity Assist Trajectory Visuali... || 14186: Lucy’s Solar Powered Journey Continues || 20366: Lucy Solar Array Anomaly: Animation || 13944: Lucy L-2 Engineering Briefing || 13958: Lucy's Journey: Episode 6 - \"Into the Unkno... || 13959: Working on a NASA Mission: Lucy Goes to Spa... || 13951: Lucy's Journey: Episode 5 - \"The First Flyb... || 13949: Driving a Spacecraft: Lucy Goes to Space || 13941: Lucy's Journey: Episode 4 - \"Instruments\" || 13940: Planning for a Spacecraft Launch: Lucy Goes... || 13948: Designing Lucy’s Path to the Trojan Asteroi... || 4943: Lucy Mission Trajectory 'Over-the-Shoulder' ... || 13938: Lucy's Journey: Episode 3 - \"The Trojan Ast... || 13936: Lagrange Points: Lucy Goes to Space || 13929: Lucy's Journey: Episode 2 - \"The Adventure ... || 13918: Investigating Asteroids with Lucy's Scienti... || 20346: Lucy Deployment Animations || 13930: Exploring the Solar System: Lucy Goes to Sp... || 13413: Discovering Eurybates' Satellite || 13772: Lucy's Journey: Episode 1 - \"Launch\" || 13352: Lucy Trojan Asteroid Mission: Teaser || 13482: Lucy Mission Overview: Journey to Explore t... || 13651: Studying Trojan Asteroids with Lucy || 4719: Lucy mission trajectory || 20301: Lucy Mission Animations || 20318: Lucy Instruments || 13933: Lucy L-20 Briefing ||"
