                - paragraph [ref=f6e1298]: "Dial-A-Moon || moon.0001.jpg (730x730) || comp.0001.tif (5760x3240) || || || 4955 || Moon Phase and Libration, 2022 || Dial-A-Moon || moon.0001.jpg (730x730) [51.9 KB] || comp.0001.tif (5760x3240) [13.1 MB] || || Click on the image to download a high-resolution version with feature labels and additional graphics. Hover over the image to reveal the animation frame number, which can be used to locate and download the corresponding frame from any of the animations on this page, including unlabeled high-resolution Moon images. The data in the table for the entire year can be downloaded as a JSON file or as a text file.The animation archived on this page shows the geocentric phase, libration, position angle of the axis, and apparent diameter of the Moon throughout the year 2022, at hourly intervals. Until the end of 2022, the initial Dial-A-Moon image will be the frame from this animation for the current hour.More in this series:Moon Phase and Libration GalleryLunar Reconnaissance Orbiter (LRO) has been in orbit around the Moon since the summer of 2009. Its laser altimeter (LOLA) and camera (LROC) are recording the rugged, airless lunar terrain in exceptional detail, making it possible to visualize the Moon with unprecedented fidelity. This is especially evident in the long shadows cast near the terminator, or day-night line. The pummeled, craggy landscape thrown into high relief at the terminator would be impossible to recreate in the computer without global terrain maps like those from LRO.The Moon always keeps the same face to us, but not exactly the same face. Because of the tilt and shape of its orbit, we see the Moon from slightly different angles over the course of a month. When a month is compressed into 24 seconds, as it is in this animation, our changing view of the Moon makes it look like it's wobbling. This wobble is called libration.The word comes from the Latin for \"balance scale\" (as does the name of the zodiac constellation Libra) and refers to the way such a scale tips up and down on alternating sides. The sub-Earth point gives the amount of libration in longitude and latitude. The sub-Earth point is also the apparent center of the Moon's disk and the location on the Moon where the Earth is directly overhead.The Moon is subject to other motions as well. It appears to roll back and forth around the sub-Earth point. The roll angle is given by the position angle of the axis, which is the angle of the Moon's north pole relative to celestial north. The Moon also approaches and recedes from us, appearing to grow and shrink. The two extremes, called perigee (near) and apogee (far), differ by as much as 14%.The most noticed monthly variation in the Moon's appearance is the cycle of phases, caused by the changing angle of the Sun as the Moon orbits the Earth. The cycle begins with the waxing (growing) crescent Moon visible in the west just after sunset. By first quarter, the Moon is high in the sky at sunset and sets around midnight. The full Moon rises at sunset and is high in the sky at midnight. The third quarter Moon is often surprisingly conspicuous in the daylit western sky long after sunrise.Celestial north is up in these images, corresponding to the view from the northern hemisphere. The descriptions of the print resolution stills also assume a northern hemisphere orientation. (There is also a south-up version of this page.) || The phase and libration of the Moon for 2022, at hourly intervals. Includes supplemental graphics that display the Moon's orbit, subsolar and sub-Earth points, and the Moon's distance from Earth at true scale. Craters near the terminator are labeled, as are Apollo landing sites and maria and other albedo features in sunlight. || comp.0300_print.jpg (1024x576) [104.2 KB] || comp.0300_searchweb.png (320x180) [58.0 KB] || comp.0300_thm.png (80x40) [5.8 KB] || phases_2022_fancy_720p30.mp4 (1280x720) [82.5 MB] || fancy (1920x1080) [8761 Item(s)] || phases_2022_fancy_720p30.webm (1280x720) [34.8 MB] || phases_2022_fancy_1080p30.mp4 (1920x1080) [167.0 MB] || phases_2022_fancy_360p30.mp4 (640x360) [28.2 MB] || fancy (3840x2160) [8761 Item(s)] || fancy (5760x3240) [8761 Item(s)] || phases_2022_fancy_2160p30.mp4 (3840x2160) [527.3 MB] || phases_2022_fancy_3840x2160p30.mov (3840x2160) [15.8 GB] || phases_2022_fancy_1080p30.mp4.hwshow [191 bytes] || The phase and libration of the Moon for 2022, at hourly intervals. Includes music, supplemental graphics that display the Moon's orbit, subsolar and sub-Earth points, and the Moon's distance from Earth at true scale. Craters near the terminator are labeled, as are Apollo landing sites and maria and other albedo features in sunlight.Music provided by Universal Production Music: Build the Future – Alexander HitchensThis video can also be viewed on the NASA Goddard YouTube channel. || music.0300_print.jpg (1024x576) [128.1 KB] || 4955_2022MoonPhasesNorthUp_YouTubeHD.webm (1920x1080) [39.3 MB] || 4955_2022MoonPhasesNorthUp_YouTubeHD.mp4 (1920x1080) [575.1 MB] || 4955_2022MoonPhasesNorthUp_CAPTIONS.en_US.srt [46 bytes] || 4955_2022MoonPhasesNorthUp_CAPTIONS.en_US.vtt [56 bytes] || 4955_2022MoonPhasesNorthUp_YouTube4K.mp4 (3840x2160) [1.4 GB] || 4955_2022MoonPhasesNorthUp_MASTER.mov (3840x2160) [16.2 GB] || The phase and libration of the Moon for 2022, at hourly intervals. The higher resolution frames include an alpha channel. || moon.0300_print.jpg (1024x576) [45.3 KB] || phases_2022_plain_1080p30.mp4 (1920x1080) [94.5 MB] || phases_2022_plain_720p30.mp4 (1280x720) [41.5 MB] || plain (1920x1080) [8761 Item(s)] || 730x730_1x1_30p (730x730) [8761 Item(s)] || phases_2022_plain_720p30.webm (1280x720) [34.8 MB] || phases_2022_plain_360p30.mp4 (640x360) [11.2 MB] || plain (5760x3240) [8761 Item(s)] || plain (3840x2160) [8761 Item(s)] || exr (5760x3240) [8761 Item(s)] || phases_2022_plain_2160p30.mp4 (3840x2160) [374.6 MB] || 216x216_1x1_30p (216x216) [8761 Item(s)] || phases_2022_plain_3840x2160p30.mov (3840x2160) [11.7 GB] || phases_2022_plain_1080p30.mp4.hwshow [191 bytes] || The Moon's Orbit || The orbit of the Moon in 2022, viewed from the north pole of the ecliptic, with the vernal equinox to the right. The sizes of the Earth and Moon are exaggerated by a factor of 15, 20, or 25, depending on the frame size. The frames include an alpha channel. || orbit.0300_print.jpg (1024x1024) [34.9 KB] || orbit_2022_1080p30.mp4 (1080x1080) [26.5 MB] || orbit_2022_850p30.mp4 (850x850) [26.7 MB] || 1080x1080_1x1_30p (1080x1080) [8761 Item(s)] || 850x850_1x1_30p (850x850) [8761 Item(s)] || orbit_2022_850p30.webm (850x850) [34.7 MB] || orbit_2022_420p30.mp4 (420x420) [11.6 MB] || 420x420_1x1_30p (420x420) [8761 Item(s)] || From this birdseye view, it's somewhat easier to see that the phases of the Moon are an effect of the changing angles of the Sun, Moon and Earth. The Moon is full when its orbit places it in the middle of the night side of the Earth. First and Third Quarter Moon occur when the Moon is along the day-night line on the Earth.The First Point of Aries is at the 3 o'clock position in the image. The Sun is in this direction at the March equinox. You can check this by freezing the animation at around the 1:03 mark, or by freezing the full animation with the time stamp near March 20. This direction serves as the zero point for both ecliptic longitude and right ascension.The north pole of the Earth is tilted 23.5 degrees toward the 12 o'clock position at the top of the image. The tilt of the Earth is important for understanding why the north pole of the Moon seems to swing back and forth. In the full animation, watch both the orbit and the \"gyroscope\" Moon in the lower left. The widest swings happen when the Moon is at the 3 o'clock and 9 o'clock positions. When the Moon is at the 3 o'clock position, the ground we're standing on is tilted to the left when we look at the Moon. At the 9 o'clock position, it's tilted to the right. The tilt itself doesn't change. We're just turned around, looking in the opposite direction. || An animated diagram of the subsolar and sub-Earth points for 2022. The Moon's north pole, equator, and meridian are indicated. The frames include an alpha channel. || globe.0300_print.jpg (1024x1024) [69.4 KB] || subpnts_2022_960p30.mp4 (960x960) [37.3 MB] || subpnts_2022_640p30.mp4 (640x640) [19.7 MB] || 960x960_1x1_30p (960x960) [8761 Item(s)] || 640x640_1x1_30p (640x640) [8761 Item(s)] || subpnts_2022_960p30.webm (960x960) [34.8 MB] || subpnts_2022_320p30.mp4 (320x320) [7.0 MB] || 320x320_1x1_30p (320x320) [8761 Item(s)] || The subsolar and sub-Earth points are the locations on the Moon's surface where the Sun or the Earth are directly overhead, at the zenith. A line pointing straight up at one of these points will be pointing toward the Sun or the Earth. The sub-Earth point is also the apparent center of the Moon's disk as observed from the Earth.In the animation, the blue dot is the sub-Earth point, and the yellow cone is the subsolar point. The lunar latitude and longitude of the sub-Earth point is a measure of the Moon's libration. For example, when the blue dot moves to the left of the meridian (the line at 0 degrees longitude), an extra bit of the Moon's western limb is rotating into view, and when it moves above the equator, a bit of the far side beyond the north pole becomes visible.At any given time, half of the Moon is in sunlight, and the subsolar point is in the center of the lit half. Full Moon occurs when the subsolar point is near the center of the Moon's disk. When the subsolar point is somewhere on the far side of the Moon, observers on Earth see a crescent phase. || An animated diagram of the Moon's distance from the Earth for 2022. The sizes and distances are true to scale, and the lighting and Earth tilt are correct. The frames include an alpha channel. || dist.0300_print.jpg (1024x576) [4.6 KB] || distance_2022_1080p30.mp4 (1920x1080) [2.2 MB] || distance_2022_720p30.mp4 (1280x720) [1.3 MB] || distance (1920x1080) [8761 Item(s)] || distance_2022_720p30.webm (1280x720) [10.2 MB] || distance_2022_2160p30.mp4 (3840x2160) [6.3 MB] || distance_2022_360p30.mp4 (640x360) [652.2 KB] || distance (5760x3240) [8761 Item(s)] || distance (3840x2160) [8761 Item(s)] || distance_2022_1080p30.mp4.hwshow [187 bytes] || The Moon's orbit around the Earth isn't a perfect circle. The orbit is slightly elliptical, and because of that, the Moon's distance from the Earth varies between 28 and 32 Earth diameters, or about 356,400 and 406,700 kilometers. In each orbit, the smallest distance is called perigee, from Greek words meaning \"near earth,\" while the greatest distance is called apogee. The Moon looks largest at perigee because that's when it's closest to us.The animation follows the imaginary line connecting the Earth and the Moon as it sweeps around the Moon's orbit. From this vantage point, it's easy to see the variation in the Moon's distance. Both the distance and the sizes of the Earth and Moon are to scale in this view. In the HD-resolution frames, the Earth is 50 pixels wide, the Moon is 14 pixels wide, and the distance between them is about 1500 pixels, on average.Note too that the Earth appears to go through phases just like the Moon does. For someone standing on the surface of the Moon, the Sun and the stars rise and set, but the Earth doesn't move in the sky. It goes through a monthly sequence of phases as the Sun angle changes. The phases are the opposite of the Moon's. During New Moon here, the Earth is full as viewed from the Moon. || Feature labels. Crater labels appear when the center of the crater is within 20 degrees of the terminator (the day-night line). They are on the western edge of the crater during waxing phases (before Full Moon) and to the east during waning phases. Mare, sinus, and lacus features are labeled when in sunlight. Apollo landing site labels are always visible. The frames include an alpha channel. || label.0300_print.jpg (1024x576) [14.6 KB] || labels_2022_1080p30.mp4 (1920x1080) [58.9 MB] || labels_2022_720p30.mp4 (1280x720) [28.2 MB] || labels (1920x1080) [8761 Item(s)] || labels_2022_720p30.webm (1280x720) [34.8 MB] || labels_2022_360p30.mp4 (640x360) [10.2 MB] || labels (5760x3240) [8761 Item(s)] || labels (3840x2160) [8761 Item(s)] || labels_2022_2160p30.mp4 (3840x2160) [122.1 MB] || labels_2022_1080p30.mp4.hwshow [185 bytes] || The Named PhasesThe following is a gallery containing examples of each of the Moon phases that have names in English. New, full, and quarter phases occur on specific days, while crescent and gibbous phases are the transitions between these points and span multiple days. The quarters are so named because they occur when the Moon is one fourth or three fourths of the way through its cycle of phases. Many people find this confusing, though, since visually they are half moons. It might be helpful to remember that the visible half of the Moon's disk is really only one quarter of its spherical surface. || Waxing crescent. Visible toward the southwest in early evening. || phase_waxing_crescent.0398_print.jpg (1024x1024) [108.1 KB] || phase_waxing_crescent.0398_searchweb.png (320x180) [65.0 KB] || phase_waxing_crescent.0398.tif (3240x3240) [10.1 MB] || First quarter. Visible high in the southern sky in early evening. || phase_first_quarter.5440_print.jpg (1024x1024) [156.9 KB] || phase_first_quarter.5440_searchweb.png (320x180) [80.4 KB] || phase_first_quarter.5440.tif (3240x3240) [11.9 MB] || Waxing gibbous. Visible to the southeast in early evening, up for most of the night. || phase_waxing_gibbous.4801_print.jpg (1024x1024) [173.0 KB] || phase_waxing_gibbous.4801_searchweb.png (320x180) [85.0 KB] || phase_waxing_gibbous.4801.tif (3240x3240) [11.1 MB] || Full Moon. Rises at sunset, high in the sky around midnight. Visible all night. || phase_full.3492_print.jpg (1024x1024) [199.7 KB] || phase_full.3492_searchweb.png (320x180) [94.5 KB] || phase_full.3492.tif (3240x3240) [11.6 MB] || Waning gibbous. Rises after sunset, high in the sky after midnight, visible to the southwest after sunrise. || phase_waning_gibbous.2172_print.jpg (1024x1024) [188.8 KB] || phase_waning_gibbous.2172_searchweb.png (320x180) [90.7 KB] || phase_waning_gibbous.2172.tif (3240x3240) [11.6 MB] || Third quarter. Rises around midnight, visible to the south after sunrise. || phase_third_quarter.2243_print.jpg (1024x1024) [148.3 KB] || phase_third_quarter.2243_searchweb.png (320x180) [79.3 KB] || phase_third_quarter.2243.tif (3240x3240) [11.2 MB] || Waning crescent. Low to the east before sunrise. || phase_waning_crescent.0903_print.jpg (1024x1024) [107.7 KB] || phase_waning_crescent.0903_searchweb.png (320x180) [64.3 KB] || phase_waning_crescent.0903.tif (3240x3240) [11.0 MB] || New Moon. By the modern definition, New Moon occurs when the Moon and Sun are at the same geocentric ecliptic longitude. The part of the Moon facing us is completely in shadow then. Pictured here is the traditional New Moon, the earliest visible waxing crescent, which signals the start of a new month in many lunar and lunisolar calendars. || phase_new.1026_print.jpg (1024x1024) [78.0 KB] || phase_new.1026_searchweb.png (320x180) [57.0 KB] || phase_new.1026.tif (3240x3240) [9.4 MB] || Planets & Moons || 4K || Albedo || Elevation data || HDTV || Hyperwall || Laser Altimeter || LOLA || LRO || LROC || Lunar || Lunar Elevation Map || Lunar Reconnaissance Orbiter || Lunar Surface || Lunar Topography || Moon || Presentation || Solar System || LRO (Lunar Reconnaissance Orbiter) || LRO - Animations || The Moon || DEM (Digital Elevation Map) [LRO: LOLA] || DE421 (JPL DE421) || LROC WAC Color Mosaic (Natural Color Hapke Normalized WAC Mosaic) [Lunar Reconnaissance Orbiter: LRO Camera] || Ernie Wright (USRA) as Visualizer || David Ladd (USRA) as Producer || Noah Petro (NASA/GSFC) as Scientist || John Keller (NASA/GSFC) as Scientist ||"
