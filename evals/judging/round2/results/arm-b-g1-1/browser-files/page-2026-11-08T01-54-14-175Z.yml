                  - text: This visualization showcases the Agulhas Current as it carries warm water along the east coast of Southern Africa. Giant spinning whirlpools called Agulhas Rings break off from this current, each one larger than many cities. These massive rings transport warm water from the Indian Ocean into the Atlantic Ocean, helping move heat around our planet and affecting global weather patterns.This visualization was created using frames from Perpetual Ocean 2's beauty pass, which is available on this webpage. || OceanFlows_AgulhasCurrent_3840x1080.mp4 (3840x1080) [178.4 MB] || OceanFlows_AgulhasCurrent_7680x2160.mp4 (7680x2160) [536.6 MB] || OceanFlows_3840x108030fps.png (3840x1080) [9.3 MB] || OceanFlows_7680x216030fps.png (7680x2160) [31.8 MB] || 7680x2160_32x1_30p (7680x2160) [2251 Item(s)] || Earth || Ocean || ocean circulation || Perpetual Ocean 2 || ECCO2 (ECCO2 High Resolution Ocean and Sea Ice Model) || ETOPO-30 || Greg Shirah (NASA/GSFC) as Data visualizer || Horace Mitchell (NASA/GSFC) as Data visualizer || Atousa Saberi (NASA/GSFC) as Scientist ||
