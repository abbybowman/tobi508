                - paragraph [ref=f6e500]: "What if a star’s death could give rise to an entirely new planet?Astronomers revisiting decades-old observations from NASA’s Hubble Space Telescope found an unexpected chemical clue around a white dwarf: niobium, a heavy element forged during the final stages of a star’s life. Combined with observations from other NASA missions, the evidence points to an intriguing possibility: a Jupiter-sized world may have formed from material expelled when the star died.If confirmed, this “second-generation” planet could reveal that the death of a star isn’t always the end of its planetary system. Sometimes, it might be the beginning of a new one.For more information, visit science.nasa.gov/mission/hubbleCredit: NASA's Goddard Space Flight Center Paul Morris: Lead ProducerMusic Credit:\"Rousing Scenes\" by Louise Bernadette Dowd [PRS] and Jeremy Noel William Abbott [PRS] via Model Music [PRS] and Universal Production MusicVideo Credits:Tracks Stars. They Look Like Meteors Video by NikitaMaykov via Pond5Death Valley National Park Milky Way Galaxy Time Lapse Night Sky Above Telescope Video by Lovemushroom via Pond5White Dwarf and Exoplanet Animations created by Chris Smith and Scott Wiessinger || || 15102 || Dying Star Creates Brand New Planet || What if a star’s death could give rise to an entirely new planet?Astronomers revisiting decades-old observations from NASA’s Hubble Space Telescope found an unexpected chemical clue around a white dwarf: niobium, a heavy element forged during the final stages of a star’s life. Combined with observations from other NASA missions, the evidence points to an intriguing possibility: a Jupiter-sized world may have formed from material expelled when the star died.If confirmed, this “second-generation” planet could reveal that the death of a star isn’t always the end of its planetary system. Sometimes, it might be the beginning of a new one.For more information, visit science.nasa.gov/mission/hubbleCredit: NASA's Goddard Space Flight Center Paul Morris: Lead ProducerMusic Credit:\"Rousing Scenes\" by Louise Bernadette Dowd [PRS] and Jeremy Noel William Abbott [PRS] via Model Music [PRS] and Universal Production MusicVideo Credits:Tracks Stars. They Look Like Meteors Video by NikitaMaykov via Pond5Death Valley National Park Milky Way Galaxy Time Lapse Night Sky Above Telescope Video by Lovemushroom via Pond5White Dwarf and Exoplanet Animations created by Chris Smith and Scott Wiessinger || Master VersionHorizontal version. This is for use on any YouTube or non-YouTube platform where you want to display the video horizontally. || 15102_SECONDGEN_WIDE_PRINT.jpg (1920x1080) [907.0 KB] || 15102_SECONDGEN_WIDE_THUMB.jpg (1920x1080) [907.0 KB] || 15102_SECONDGEN_WIDE_SEARCH.jpg (320x180) [27.9 KB] || 15102_SECONDGEN_WIDE_MP4.mp4 (1920x1080) [361.0 MB] || 15102_SECONDGEN_WIDE_CAP.en_US.srt [3.3 KB] || Vertical VersionThis vertical version of the episode is for IGTV or Snapchat. The IGTV episode can be pulled into Instagram Stories and the regular Instagram feed. || 15102_SECONDGEN_VERT_THUMB.jpg (1080x1920) [395.0 KB] || 15102_SECONDGEN_VERT_MP4.mp4 (1080x1920) [331.8 MB] || 15102_SECONDGEN_VERT_CAP.en_US.srt [3.3 KB] || Universe || Hubble || Paul Morris (eMITS) as Producer || Aaron E. Lepsch (ADNET Systems, Inc.) as Technical support ||"
