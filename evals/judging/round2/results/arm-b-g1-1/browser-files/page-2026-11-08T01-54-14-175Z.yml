                - paragraph [ref=f6e889]: "Artemis II - The Terminator || ArtemisWow_Terminator_Thumb.png (1920x1080) [2.0 MB] || ArtemisWow_Terminator_Thumb_SearchWeb.jpg (1920x1080) [2.0 MB] || ArtemisWow_Terminator_Thumb_print.jpg (1920x1080) [2.0 MB] || NASA_ArtemisWow_Terminator_Final.mp4 (1920x1080) [422.1 MB] || NASA_ArtemisWow_Terminator.en_US.srt [6.1 KB] || NASA_ArtemisWow_Terminator.en_US.vtt [5.8 KB] || || 15105 || Artemis II and the Moon’s Terminator: Why It Matters for Science || Artemis II - The Terminator || ArtemisWow_Terminator_Thumb.png (1920x1080) [2.0 MB] || ArtemisWow_Terminator_Thumb_SearchWeb.jpg (1920x1080) [2.0 MB] || ArtemisWow_Terminator_Thumb_print.jpg (1920x1080) [2.0 MB] || NASA_ArtemisWow_Terminator_Final.mp4 (1920x1080) [422.1 MB] || NASA_ArtemisWow_Terminator.en_US.srt [6.1 KB] || NASA_ArtemisWow_Terminator.en_US.vtt [5.8 KB] || Hear from the Artemis II crew and lunar science team about what the lunar terminator—the line differentiating day and night—means for Moon observations and how it can help us get ready for human exploration near the lunar South Pole. Music Credits:“In The Garden of Memory” - Eric Chevalier [SACEM], Koka Music“Getting There” - Claire Leona Batchelor & Walter Magnum Peterson [PRS], Sound Pocket Music || Chris Burns (eMITS) as Producer || Lonnie Shekhtman (ADNET Systems, Inc.) as Producer || Caela Barry (ADNET Systems, Inc.) as Producer || Ernie Wright (USRA) as Visualizer || Alex Kekesi (ADNET Systems, Inc.) as Visualizer ||"
