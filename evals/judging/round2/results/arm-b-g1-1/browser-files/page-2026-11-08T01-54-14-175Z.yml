                - paragraph [ref=f6e1134]: "The geoid is an equipotential surface that can be thought of as the shape an ocean surface would take due to the Earth's gravity field. In this visualization the geoid height is greatly exaggerated, by a factor of 10,000. The geoid height visualized here comes from the gravity field model GOCO06s, a satellite-only global gravity field model computed by the GOCO (Gravity Observation Combination) project. || 5660 || The Geoid || This version shows the geoid to scale. The shape of the geoid is remarkably smooth. At a planetary scale the variations in geoid height are not discernible. We have other versions of this visualization that exaggerate these variations to make them visible. || The geoid is an equipotential surface that can be thought of as the shape an ocean surface would take due to the Earth's gravity field. The geoid height ranges from +85 m (Iceland) to −106 m (southern India). The geoid height visualized here comes from the gravity field model GOCO06s, a satellite-only global gravity field model computed by the GOCO (Gravity Observation Combination) project. It is based on over a billion observations acquired over 15 years from 19 satellites. These satellites include NASA's Gravity Recovery and Climate Experiment (GRACE) and ESA's Gravity field and steady-state Ocean Circulation Explorer (GOCE). || geoid_to_scale_2160p30.mp4 (2160x2160) [29.8 MB] || NOTE: Not to scale!!! This visualization exaggerates the Geoid Height by a factor of 10,000. || The geoid is an equipotential surface that can be thought of as the shape an ocean surface would take due to the Earth's gravity field. The geoid height ranges from +85 m (Iceland) to −106 m (southern India). In this visualization the geoid height is greatly exaggerated, by a factor of 10,000. The geoid height visualized here comes from the gravity field model GOCO06s, a satellite-only global gravity field model computed by the GOCO (Gravity Observation Combination) project. It is based on over a billion observations acquired over 15 years from 19 satellites. These satellites include NASA's Gravity Recovery and Climate Experiment (GRACE) and ESA's Gravity field and steady-state Ocean Circulation Explorer (GOCE). || geoid_GOCO06s.mp4 (2160x2160) [28.1 MB] || geoid.png (2160x2160) [2.8 MB] || geoid_print.png (1080x1080) [1.8 MB] || Geoid 3D Model || A 3D model of the Geoid, with the geoid height exaggerated by a factor of 10,000. || geoid.glb [86.7 MB] || Earth || Geodesy || Geodetics || Geodetics/Gravity || Gravity Recovery and Climate Experiment (GRACE) || GOCO06s (GOCO06s) [GRACE and GRACE-FO] || GOCO06s – a satellite-only global gravity field model || Scott Luthcke (NASA/GSFC) as Science advisor || Mark SubbaRao (NASA/GSFC) as Visualizer ||"
