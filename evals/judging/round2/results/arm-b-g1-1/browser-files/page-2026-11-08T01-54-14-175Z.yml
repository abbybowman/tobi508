                    - generic [aria-hidden] [ref=f6e804]: 
                - paragraph [ref=f6e806]: A new method of estimating terrestrial water storage trends has produced a finer-scale map of water storage by “stacking” the raw satellite measurements, with spatial acuity sharp enough to distinguish impacts from individual reservoirs, pumping fields, and canals. This animation shows some of the most intense examples of human-induced freshwater storage change. The results are published in the Proceedings of the National Academy of Sciences (https://doi.org/10.1073/pnas.2600775123). || || 5676 || Spatially-Refined Terrestrial Water Storage Trend Maps Derived From GRACE and GRACE-FO || Scientists at NASA's Goddard Space Flight Center processed more than two decades of data from the GRACE satellites, which track changes in Earth's gravity to measure changes in water is stored on land. By “stacking” the raw satellite measurements, they mapped water storage trends at a finer scale than earlier studies, with spatial acuity sharp enough to distinguish impacts from individual reservoirs, pumping fields, and canals. To determine the factors contributing to water storage trends, they ran statistical models for each continent that weighed farming, irrigation, reservoir impoundment, and forest clearing against rainfall trends, atmospheric dryness, and melting glaciers, ranking the relative importance of each factor. Some measure of human land or water use significantly influenced large-scale water storage trends on every non-polar continental region except Australia. The sharpened map revealed 40 hotspots around the world where human activity is driving major gains or losses of freshwater. Pumping for irrigation was the biggest cause of loss, especially across the Middle East, northern India, northern China, and the American Southwest, while new dams, rainfed agriculture and leaky irrigation canals contributed to storage gains in other regions. This animation shows some of the most intense examples of human-induced freshwater storage change. The results are published in the Proceedings of the National Academy of Sciences (https://doi.org/10.1073/pnas.2600775123). || Visualization of GRACE TWS, comparing the newer and older methods of calculating water storage trends. || GRACE_TWS_1080p30.mp4 (1920x1080) [29.5 MB] || GRACE_TWS_2160p30.mp4 (3840x2160) [65.3 MB] || GRACE_TWS (3840x2160) [1500 Item(s)] || GRACE_TWS.0301_print.jpg (1024x576) [168.4 KB] || GRACE_TWS.0301_web.png (320x180) [72.4 KB] || GRACE_TWS.0301_thm.png (80x40) [5.6 KB] || GRACE_TWS_2160p30.mp4.hwshow [183 bytes] || Earth || Earth Science || Grace || GRACE-FO || Ground Water || Hydrology || Hydrosphere || Hyperwall || Water Scarcity || https://www.pnas.org/doi/10.1073/pnas.2600775123 || Trent L. Schindler (USRA) as Visualizer || Laurence Schuler (ADNET Systems, Inc.) as Technical support || Ian Jones (ADNET Systems, Inc.) as Technical support || Mary Michael O'Neill (University of Maryland College Park) as Scientist || Matthew Rodell (NASA/GSFC) as Scientist ||
