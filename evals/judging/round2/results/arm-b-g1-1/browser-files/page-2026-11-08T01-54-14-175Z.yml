                - paragraph [ref=f6e969]: "For decades, NASA’s Hubble Space Telescope has helped astronomers measure how fast the universe is expanding. But as those measurements have become more precise, scientists have uncovered a cosmic mystery: the universe appears to be expanding at different rates depending on how we measure it.Known as the Hubble tension, this discrepancy challenges our understanding of the cosmos and could point toward something missing from our current model of the universe.In this video, NASA scientists Jennifer Wiseman and Julie McEnery explore how Hubble helped transform our understanding of cosmic expansion, the mysterious role of dark energy, and how NASA’s Nancy Grace Roman Space Telescope will help investigate some of the biggest unanswered questions in cosmology.For more information, visit science.nasa.gov/mission/hubbleCredit: NASA's Goddard Space Flight Center Paul Morris: Lead ProducerRob Andreioli: VideographerJohn Philyaw: VideographerJennifer WisemanJulie McEneryMusic Credit:\"Enceladus\" by Jonathan Elias [ASCAP] and David Ashok Ramani [ASCAP] via ZFC Music [SESAC] and Universal Production Music || || 15112 || Why The Universe Doesn’t Add Up (And How We’re Going To Try To Figure It Out) || For decades, NASA’s Hubble Space Telescope has helped astronomers measure how fast the universe is expanding. But as those measurements have become more precise, scientists have uncovered a cosmic mystery: the universe appears to be expanding at different rates depending on how we measure it.Known as the Hubble tension, this discrepancy challenges our understanding of the cosmos and could point toward something missing from our current model of the universe.In this video, NASA scientists Jennifer Wiseman and Julie McEnery explore how Hubble helped transform our understanding of cosmic expansion, the mysterious role of dark energy, and how NASA’s Nancy Grace Roman Space Telescope will help investigate some of the biggest unanswered questions in cosmology.For more information, visit science.nasa.gov/mission/hubbleCredit: NASA's Goddard Space Flight Center Paul Morris: Lead ProducerRob Andreioli: VideographerJohn Philyaw: VideographerJennifer WisemanJulie McEneryMusic Credit:\"Enceladus\" by Jonathan Elias [ASCAP] and David Ashok Ramani [ASCAP] via ZFC Music [SESAC] and Universal Production Music || Master VersionHorizontal version. This is for use on any YouTube or non-YouTube platform where you want to display the video horizontally. || 15112_TENSION_WIDE_PRINT.jpg (1920x1080) [723.7 KB] || 15112_TENSION_WIDE_THUMB.jpg (1920x1080) [723.7 KB] || 15112_TENSION_WIDE_SEARCH.jpg (320x180) [35.9 KB] || 15112_TENSION_1080_MP4.mp4 (1920x1080) [776.8 MB] || 15112_TENSION_WIDE_CAP.en_US.srt [8.5 KB] || 15112_TENSION_WIDE_CAP.en_US.vtt [8.0 KB] || 15112_TENSION_4K_MP4.mp4 (3840x2160) [2.8 GB] || Vertical VersionThis vertical version of the episode is for IGTV or Snapchat. The IGTV episode can be pulled into Instagram Stories and the regular Instagram feed. || 15112_TENSION_VERT_THUMB.jpg (1080x1920) [367.7 KB] || 15112_TENSION_VERT_MP4.mp4 (1080x1920) [740.8 MB] || 15112_TENSION_VERT_CAP.en_US.srt [8.5 KB] || 15112_TENSION_VERT_CAP.en_US.vtt [8.0 KB] || Universe || HST || Hubble Space Telescope || Universe || Hubble || Paul Morris (eMITS) as Producer || John D. Philyaw (eMITS) as Videographer || Rob Andreoli (eMITS) as Videographer || Jennifer Wiseman (NASA/GSFC) as Interviewee || Julie McEnery (NASA/GSFC) as Interviewee || Aaron E. Lepsch (ADNET Systems, Inc.) as Technical support ||"
