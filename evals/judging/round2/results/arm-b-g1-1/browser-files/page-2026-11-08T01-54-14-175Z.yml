                  - 'link "NASA Science Category: Earth" [ref=f6e1442] [cursor=pointer]':
                    - /url: /search/?nasa_science_categories=Earth
                    - generic [aria-hidden] [ref=f6e1443]: 
                - paragraph [ref=f6e1445]:
                  - text: "This spectacular 'Blue Marble' image is the most detailed true-color image of the entire Earth to date. Using a collection of satellite-based observations, scientists and visualizers stitched together months of observations of the land surface, oceans, sea ice, and clouds into a seamless, true-color mosaic of every square kilometer (0.386 square mile) of our planet. Much of the information contained in this image came from a single remote-sensing device-NASA's Moderate Resolution Imaging Spectroradiometer, or MODIS. Flying over 700 km above the Earth onboard the Terra satellite, MODIS provides an integrated tool for observing a variety of terrestrial, oceanic, and atmospheric features of the Earth. The land and coastal ocean portions of these images are based on surface observations collected from June through September 2001 and combined, or composited, every eight days to compensate for clouds that might block the sensor's view of the surface on any single day. Two different types of ocean data were used in these images: shallow water true color data, and global ocean color (or chlorophyll) data. Topographic shading is based on the GTOPO 30 elevation data set compiled by the U.S. Geological Survey's EROS Data Center. || || 2915 || Blue Marble - A Seamless Image Mosaic of the Earth (WMS) || This spectacular 'Blue Marble' image is the most detailed true-color image of the entire Earth to date. Using a collection of satellite-based observations, scientists and visualizers stitched together months of observations of the land surface, oceans, sea ice, and clouds into a seamless, true-color mosaic of every square kilometer (0.386 square mile) of our planet. Much of the information contained in this image came from a single remote-sensing device-NASA's Moderate Resolution Imaging Spectroradiometer, or MODIS. Flying over 700 km above the Earth onboard the Terra satellite, MODIS provides an integrated tool for observing a variety of terrestrial, oceanic, and atmospheric features of the Earth. The land and coastal ocean portions of these images are based on surface observations collected from June through September 2001 and combined, or composited, every eight days to compensate for clouds that might block the sensor's view of the surface on any single day. Two different types of ocean data were used in these images: shallow water true color data, and global ocean color (or chlorophyll) data. Topographic shading is based on the GTOPO 30 elevation data set compiled by the U.S. Geological Survey's EROS Data Center. || Blue Marble image of the whole earth.This product is available through our Web Map Service. || bluemarble-2048.png (2048x1024) [1.4 MB] || bluemarble-1024.png (1024x512) [434.3 KB] || earth-2048_web.jpg (320x160) [10.5 KB] || bluemarble-512.png (512x512) [235.8 KB] || earth-2048_thm.png (80x40) [3.9 KB] || Blue Marble image of the Eastern Hemisphere.This product is available through our Web Map Service. || bluemarble-east-4096.png (4096x4096) [12.9 MB] || bluemarble-east-4096_web.jpg (320x320) [18.0 KB] || bluemarble-east-thm.png (80x40) [5.6 KB] || bluemarble-east-4096_web_searchweb.jpg (320x180) [65.8 KB] || Blue Marble image of the Western Hemisphere.This product is available through our Web Map Service. || bluemarble-west-4096.png (4096x4096) [8.3 MB] || bluemarble-west-4096_web.jpg (320x320) [12.0 KB] || bluemarble-west-thm.png (80x40) [4.2 KB] || For More Information || See"
