                - paragraph [ref=f6e1318]:
                  - text: "This movie shows a complete revolution around a simulated black hole and its accretion disk following a path that is perpendicular to the disk. The black hole’s extreme gravitational field redirects and distorts light coming from different parts of the disk, but exactly what we see depends on our viewing angle. The greatest distortion occurs when viewing the system nearly edgewise. As our viewpoint rotates around the black hole, we see different parts of the fast-moving gas in the accretion disk moving directly toward us. Due to a phenomenon called \"relativistic Doppler beaming,\" gas in the disk that's moving toward us makes that side of the disk appear brighter, the opposite side darker. This effect disappears when we're directly above or below the disk because, from that angle, none of the gas is moving directly toward us.When our viewpoint passes beneath the disk, it looks like the gas is moving in the opposite direction. This is no different that viewing a clock from behind, which would make it look like the hands are moving counter-clockwise.CORRECTION: In earlier versions of the 360-degree movies on this page, these important effects were not apparent. This was due to a minor mistake in orienting the camera relative to the disk. The fact that it was not initially discovered by the NASA scientist who made the movie reflects just how bizarre and counter-intuitive black holes can be! Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman || BH_Accretion_Disk_Sim_360_4k_Prores.00001_print.jpg (1024x1024) [33.2 KB] || BH_Accretion_Disk_Sim_360_4k_Prores.00001_searchweb.png (320x180) [17.0 KB] || BH_Accretion_Disk_Sim_360_4k_Prores.00001_thm.png (80x40) [1.9 KB] || BH_Accretion_Disk_Sim_360_1080.mp4 (1080x1080) [19.0 MB] || BH_Accretion_Disk_Sim_360_1080.webm (1080x1080) [2.8 MB] || 360 (3840x3840) [0 Item(s)] || BH_Accretion_Disk_Sim_360_4k.mp4 (3840x3840) [119.2 MB] || BH_Accretion_Disk_Sim_360_4k_Prores.mov (3840x3840) [1020.1 MB] || || 13326 || Black Hole Accretion Disk Visualization || This movie shows a complete revolution around a simulated black hole and its accretion disk following a path that is perpendicular to the disk. The black hole’s extreme gravitational field redirects and distorts light coming from different parts of the disk, but exactly what we see depends on our viewing angle. The greatest distortion occurs when viewing the system nearly edgewise. As our viewpoint rotates around the black hole, we see different parts of the fast-moving gas in the accretion disk moving directly toward us. Due to a phenomenon called \"relativistic Doppler beaming,\" gas in the disk that's moving toward us makes that side of the disk appear brighter, the opposite side darker. This effect disappears when we're directly above or below the disk because, from that angle, none of the gas is moving directly toward us.When our viewpoint passes beneath the disk, it looks like the gas is moving in the opposite direction. This is no different that viewing a clock from behind, which would make it look like the hands are moving counter-clockwise.CORRECTION: In earlier versions of the 360-degree movies on this page, these important effects were not apparent. This was due to a minor mistake in orienting the camera relative to the disk. The fact that it was not initially discovered by the NASA scientist who made the movie reflects just how bizarre and counter-intuitive black holes can be! Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman || BH_Accretion_Disk_Sim_360_4k_Prores.00001_print.jpg (1024x1024) [33.2 KB] || BH_Accretion_Disk_Sim_360_4k_Prores.00001_searchweb.png (320x180) [17.0 KB] || BH_Accretion_Disk_Sim_360_4k_Prores.00001_thm.png (80x40) [1.9 KB] || BH_Accretion_Disk_Sim_360_1080.mp4 (1080x1080) [19.0 MB] || BH_Accretion_Disk_Sim_360_1080.webm (1080x1080) [2.8 MB] || BH_Accretion_Disk_Sim_360_4k_Prores.mov (3840x3840) [1020.1 MB] || 360 (3840x3840) [32768 Item(s)] || BH_Accretion_Disk_Sim_360_4k.mp4 (3840x3840) [119.2 MB] || This new visualization of a black hole illustrates how its gravity distorts our view, warping its surroundings as if seen in a carnival mirror. The visualization simulates the appearance of a black hole where infalling matter has collected into a thin, hot structure called an accretion disk. The black hole’s extreme gravity skews light emitted by different regions of the disk, producing the misshapen appearance. Bright knots constantly form and dissipate in the disk as magnetic fields wind and twist through the churning gas. Nearest the black hole, the gas orbits at close to the speed of light, while the outer portions spin a bit more slowly. This difference stretches and shears the bright knots, producing light and dark lanes in the disk. Viewed from the side, the disk looks brighter on the left than it does on the right. Glowing gas on the left side of the disk moves toward us so fast that the effects of Einstein’s relativity give it a boost in brightness; the opposite happens on the right side, where gas moving away us becomes slightly dimmer. This asymmetry disappears when we see the disk exactly face on because, from that perspective, none of the material is moving along our line of sight.Closest to the black hole, the gravitational light-bending becomes so excessive that we can see the underside of the disk as a bright ring of light seemingly outlining the black hole. This so-called “photon ring” is composed of multiple rings, which grow progressively fainter and thinner, from light that has circled the black hole two, three, or even more times before escaping to reach our eyes. Because the black hole modeled in this visualization is spherical and non-rotating, the photon ring looks nearly circular and identical from any viewing angle. Inside the photon ring is the black hole’s shadow, an area roughly twice the size of the event horizon — its point of no return. This visualization is “mass invariant,” which means it can represent a black hole of any mass. The size of the black hole's shadow is proportional to its mass, but so is the size of the accreetion disk, so its properties scale accordingly.Simulations and movies like these really help us visualize what Einstein meant when he said that gravity warps the fabric of space and time. || This movie shows the black hole visualization using a partial rotation, plus a long sequence where the black hole is viewed nearly edge on.Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman || Black_Hole_Accretion_Disk_Sim_4k_ProRes.00386_print.jpg (1024x1024) [72.0 KB] || Black_Hole_Accretion_Disk_Sim_1080.mp4 (1080x1080) [28.9 MB] || Black_Hole_Accretion_Disk_Sim_1080.webm (1080x1080) [4.7 MB] || Black_Hole_Accretion_Disk_Sim_4k_ProRes.mov (3840x3840) [2.8 GB] || Long (3840x3840) [65536 Item(s)] || Black_Hole_Accretion_Disk_Sim_4k.mp4 (3840x3840) [178.7 MB] || This image highlights and explains various aspects of the black hole visualization. Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman || BH_labeled.jpg (3851x2166) [2.3 MB] || This illustration shows how direct and bent light rays from a black hole's accretion disk produce the apparent image and motion seen by an observer. Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman || BH_optics_explained.jpg (1920x1305) [1.4 MB] || GIF and MPEG-4 version with continuous full rotation.Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman || BH_AccretionDisk_Sim_360_Continuous.gif (800x800) [6.7 MB] || BH_AccretionDisk_Sim_360_Continuous_1080.mp4 (3840x3840) [72.7 MB] || BH_AccretionDisk_Sim_360_Continuous_1080.webm (3840x3840) [5.1 MB] || GIF and MPEG-4 loop of edge-on view. Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman || BH_AccretionDisk_Sim_Stationary_WebSize.gif (1040x600) [6.6 MB] || BH_AccretionDisk_Sim_Stationary_WebSize.mp4 (1040x600) [4.8 MB] || BH_AccretionDisk_Sim_Stationary_WebSize.webm (1040x600) [643.8 KB] || GIF with 360-degree rotation and a pause when the view is almost edge on; uses a square frame to show the complete accretion disk.Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman || BH_AccretionDisk_360_800px.gif (800x800) [9.5 MB] || BH_AccretionDisk_360_forGIF.mp4 (800x800) [9.2 MB] || BH_AccretionDisk_360_forGIF.webm (800x800) [1.7 MB] || 16x9 GIF zoomed into the central region, highlighting the photon ring, with 360-degree rotation and a pause at almost edge on. Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman || BH_AccretionDisk_Sim_360_Center_16x9.gif (500x281) [4.4 MB] || BH_AccretionDisk_Sim_360_Center_16x9_1080.mp4 (1920x1080) [35.1 MB] || BH_AccretionDisk_Sim_360_Center_16x9_1080.webm (1920x1080) [2.4 MB] || Square GIF zoomed into the central region, highlighting the photon ring, with 360-degree rotation and a pause at almost edge on. Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman || BH_AccretionDisk_Sim_360_Center_Square.gif (500x500) [6.7 MB] || BH_AccretionDisk_Sim_360_Center_Square_1080.mp4 (1080x1080) [34.8 MB] || BH_AccretionDisk_Sim_360_Center_Square_1080.webm (1080x1080) [1.8 MB] || 16x9 GIF with 360-degree rotation and a pause when the view is almost edge on.Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman || BH_AccretionDisk_Sim_360_Wide_16x9.gif (800x450) [7.5 MB] || BH_AccretionDisk_Sim_360_wide_16x9_1080.mp4 (1920x1080) [36.3 MB] || BH_AccretionDisk_Sim_360_wide_16x9_1080.webm (1920x1080) [1.8 MB] || Banner style looping GIF showing continuous 360-degree rotation. Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman || BH_AccretionDisk_Sim_360_Banner_Continuous.gif (1044x320) [6.3 MB] || BH_AccretionDisk_Sim_Banner_360_Continuous.mp4 (1044x320) [11.2 MB] || BH_AccretionDisk_Sim_Banner_360_Continuous.webm (1040x320) [1.4 MB] || Banner style looping GIF showing 360-degree rotation and a pause at nearly edge on.Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman || BH_AccretionDisk_Sim_Banner_360.gif (1042x320) [6.6 MB] || BH_AccretionDisk_Sim_Banner_360.mp4 (1042x320) [13.4 MB] || BH_AccretionDisk_Sim_Banner_360.webm (1040x320) [1.7 MB] || Banner style looping GIF showing edge-on view.Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman || BH_AccretionDisk_Sim_Banner_Stationary.gif (1042x320) [4.8 MB] || BH_AccretionDisk_Sim_Banner_Stationary.mp4 (1042x320) [6.1 MB] || BH_AccretionDisk_Sim_Banner_Stationary.webm (1040x320) [643.4 KB] || 16x9 looping GIF showing edge-on view.Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman || BH_AccretionDisk_Sim_Stationary.gif (1041x585) [4.4 MB] || BH_AccretionDisk_Sim_Stationary_1080.mp4 (1920x1080) [11.9 MB] || BH_AccretionDisk_Sim_Stationary_1080.webm (1920x1080) [685.2 KB] || 4K version of the visualization with 360-degree rotation and a pause when the view is almost edge on.Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman || BH_AccretionDisk_360_4k.00250_print.jpg (1024x1024) [45.8 KB] || BH_AccretionDisk_360_4k.mp4 (3840x3840) [85.1 MB] || BH_AccretionDisk_360_4k.webm (3840x3840) [5.8 MB] || For More Information || See"
