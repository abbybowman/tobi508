                - paragraph [ref=f6e1151]: "Current Moonshow_moon_image(); show_moon_info();Every year since 2011, the SVS produces its annual visualization of the Moon's phase and libration comprising 8760 hourly renderings of the precise size, orientation, and illumination of our nearest neighbor in space. The above displays the current state of the Moon. Click on the image to download a much larger version with labeled craters and additional graphics. Follow the links below to see the Moon at any hour of the year, play the animations, access the frames at multiple resolutions, and read detailed explanations. || Moon Phase and Libration || Dial-A-Moon || Every year since 2011, the SVS produces its annual visualization of the Moon's phase and libration comprising 8760 hourly renderings of the precise size, orientation, and illumination of our nearest neighbor in space. The above displays the current state of the Moon. Click on the image to download a much larger version with labeled craters and additional graphics. Follow the links below to see the Moon at any hour of the year, play the animations, access the frames at multiple resolutions, and read detailed explanations. || North Up || 5587: Moon Phase and Libration, 2026 || 5415: Moon Phase and Libration, 2025 || 5187: Moon Phase and Libration, 2024 || 5048: Moon Phase and Libration, 2023 || 4955: Moon Phase and Libration, 2022 || 4874: Moon Phase and Libration, 2021 || 4768: Moon Phase and Libration, 2020 || 4604: Moon Phase and Libration, 2018 || 4537: Moon Phase and Libration, 2017 || 4442: Moon Phase and Libration, 2019 || 4404: Moon Phase and Libration, 2016 || 4236: Moon Phase and Libration, 2015 || 4118: Moon Phase and Libration, 2014 || 4000: Moon Phase and Libration, 2013 || 3894: Moon Phase and Libration, 2012 || 3810: Moon Phase and Libration, 2011 || New Moon || New Moon. By the modern definition, New Moon occurs when the Moon and Sun are at the same geocentric ecliptic longitude. The part of the Moon facing us is completely in shadow then. Pictured here is the traditional New Moon, the earliest visible waxing crescent, which signals the start of a new month in many lunar and lunisolar calendars. || phase_new.1026_print.jpg (1024x1024) [78.0 KB] || Waning Crescent || Waning crescent. Low to the east before sunrise. || phase_waning_crescent.0903_print.jpg (1024x1024) [107.7 KB] || Third Quarter || Third quarter. Rises around midnight, visible to the south after sunrise. || phase_third_quarter.2243_print.jpg (1024x1024) [148.3 KB] || Waning Gibbous || Waning gibbous. Rises after sunset, high in the sky after midnight, visible to the southwest after sunrise. || phase_waning_gibbous.2172_print.jpg (1024x1024) [188.8 KB] || Full Moon || Full Moon. Rises at sunset, high in the sky around midnight. Visible all night. || phase_full.3492_print.jpg (1024x1024) [199.7 KB] || Waxing Gibbous || Waxing gibbous. Visible to the southeast in early evening, up for most of the night. || phase_waxing_gibbous.4801_print.jpg (1024x1024) [173.0 KB] || First Quarter || First quarter. Visible high in the southern sky in early evening. || phase_first_quarter.5440_print.jpg (1024x1024) [156.9 KB] || Waxing Crescent || Waxing crescent. Visible toward the southwest in early evening. || phase_waxing_crescent.0398_print.jpg (1024x1024) [108.1 KB] || South Up || 5588: Moon Phase and Libration, 2026 South Up || 5416: Moon Phase and Libration, 2025 South Up || 5188: Moon Phase and Libration, 2024 South Up || 5049: Moon Phase and Libration, 2023 South Up || 4956: Moon Phase and Libration, 2022 South Up || 4875: Moon Phase and Libration, 2021 South Up || 4769: Moon Phase and Libration, 2020 South Up || 4605: Moon Phase and Libration, 2018 South Up || 4538: Moon Phase and Libration, 2017 South Up || 4459: Moon Phase and Libration, 2019 South Up || 4405: Moon Phase and Libration, 2016 South Up || 4237: Moon Phase and Libration, 2015 South Up || 4119: Moon Phase and Libration, 2014 South Up || 4067: 