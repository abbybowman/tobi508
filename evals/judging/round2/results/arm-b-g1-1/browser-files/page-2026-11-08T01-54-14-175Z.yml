                - paragraph [ref=f6e870]:
                  - text: "NASA's Illuminate is a video series about out-of-this-world images that shine light on our Sun and solar system. || || 14954 || NASA's Illuminate Series (2026) || NASA's Illuminate is a video series about out-of-this-world images that shine light on our Sun and solar system. || NASA’s Illuminate: Sun Rips Comet’s Tail in HalfIn October 2025, as comet Lemmon (C/2025 A6) passed near the Sun, an eruption called a coronal mass ejection burst from our star. Soon after, NASA’s PUNCH (Polarimeter to Unify the Corona and Heliosphere) mission watched as part of the comet’s tail wavered and ripped apart — not once but twice. Imaging comet Lemmon every 4 to 8 minutes over three months, PUNCH created one of the longest and most detailed records yet of a comet interacting with the Sun.Video Credit: NASA/Lacey YoungMusic credit: \"Hyperconscious” by Timothy William Oliver [PRS] from Universal Production MusicSound Effects: Pixabay || Thumbnail.jpg (1080x1920) [1021.8 KB] || Thumbnail_print.jpg (1024x1820) [1.2 MB] || Thumbnail_searchweb.png (320x180) [114.3 KB] || Thumbnail_web.png (320x569) [348.2 KB] || Thumbnail_thm.png (80x40) [16.7 KB] || Illuminate_CometLemmon_NoCaptions_ProRes.webm (1080x1920) [18.9 MB] || Illuminate_CometLemmon_NoCaptions_YouTube.mp4 (1080x1920) [155.8 MB] || Illuminate_CometLemmon_OnScreenCaptions_YouTube.mp4 (1080x1920) [155.9 MB] || Illuminate_CometLemmon.en_US.srt [2.3 KB] || Illuminate_CometLemmon.en_US.vtt [2.2 KB] || Illuminate_CometLemmon_NoCaptions_ProRes.mov (1080x1920) [1.3 GB] || NASA’s Illuminate: Dark Secrets of the Black AuroraColors of the aurora: Red, green, purple… black?Mysterious “black auroras” are real, and they’re not like the northern and southern lights you’ve seen before. Inside these dark spots, strange physics is at work — and a NASA rocket just launched from Alaska to reveal it.On Feb. 9, 2026, NASA launched the Black and Diffuse Auroral Science Surveyor sounding rocket mission from the Poker Flat Research Range near Fairbanks, Alaska. Flying their rocket through the black aurora, the team, led by principal investigator Marilia Samara of NASA’s Goddard Space Flight Center in Greenbelt, Maryland, placed scientific instruments inside a black aurora to help reveal how and why they form.Video Credit: NASA/Lacey YoungMusic credit: \"Solo Trip” by Nicholas Smith [PRS] from Universal Production MusicSound Effects: Pixabay || Thumbnail01.jpg (1080x1920) [1.3 MB] || Thumbnail01_print.jpg (1024x1820) [1.4 MB] || Thumbnail01_web.png (320x569) [241.0 KB] || Thumbnail01_thm.png (80x40) [11.2 KB] || Illuminate_Black_Aurora_NoCaptions_ProRes.webm (1080x1920) [11.2 MB] || Illuminate_Black_Aurora_NoCaptions_YouTube.mp4 (1080x1920) [155.3 MB] || Illuminate_Black_Aurora_OnScreenCaptions_YouTube.mp4 (1080x1920) [155.2 MB] || Illuminate_BlackAurora.en_US.srt [2.1 KB] || Illuminate_BlackAurora.en_US.vtt [2.0 KB] || Illuminate_Black_Aurora_NoCaptions_ProRes.mov (1080x1920) [1.2 GB] || NASA’s Illuminate: The Moon’s Tan Lines Did you know the Moon has “tan lines”? These tan lines, which feature bright tendrils and swirls amid darkened areas, are caused by the Sun. But that’s only half of the story. These weathered patches also give us clues as to what’s going on below the lunar surface. Video Credit: NASA/Lacey YoungMusic credit: \"Rich Formula” by Theophile Laszio Moussouni [SACEM] from Universal Production MusicSound Effects: Pixabay || ReinerGamma_Thumbnail.jpg (1080x1920) [945.0 KB] || ReinerGamma_Thumbnail_print.jpg (1024x1820) [986.9 KB] || ReinerGamma_Thumbnail_web.png (320x569) [203.2 KB] || ReinerGamma_Thumbnail_thm.png (80x40) [11.6 KB] || Illuminate_ReinerGamma_NoCaptions_ProRes.webm (1080x1920) [11.1 MB] || Illuminate_ReinerGamma_NoCaptions_YouTube.mp4 (1080x1920) [161.5 MB] || Illuminate_ReinerGamma_OnScreenCaptions_YouTube.mp4 (1080x1920) [162.5 MB] || Illuminate_ReinerGamma.en_US.srt [2.4 KB] || Illuminate_ReinerGamma.en_US.vtt [2.3 KB] || Illuminate_ReinerGamma_NoCaptions_ProRes.mov (1080x1920) [1.3 GB] || NASA's Illuminate: Why Is the Sun \"Smiling\"?June 21, 2026, is the longest day of the year in the Northern Hemisphere, a.k.a. the summer solstice! The extra sunlight has got us smiling, but the Sun owes its grin to something else: coronal holes! Coronal holes are cooler, lower density parts of the solar atmosphere where solar material escapes to space at incredible speeds. Dive into coronal holes with us in this episode of NASA’s Illuminate.Video Credit: NASA/Joy NgMusic Credit: \"Hectic Motion\" by Koka Media [SACEM] from Universal Production Music || IlluminateSmilingSun_Thumbnail.jpg (1080x1920) [844.5 KB] || IlluminateSmilingSun_Thumbnail_print.jpg (1024x1820) [1.0 MB] || IlluminateSmilingSun_Thumbnail_searchweb.png (320x180) [101.8 KB] || IlluminateSmilingSun_Thumbnail_web.png (320x569) [237.2 KB] || IlluminateSmilingSun_Thumbnail_thm.png (80x40) [8.1 KB] || IlluminateSmilingSun_NoCaptions_H264.webm (1080x1920) [12.0 MB] || IlluminateSmilingSun_NoCaptions_H264.mp4 (1080x1920) [688.8 MB] || IlluminateSmilingSun_OnScreenCaptions_H264.mp4 (1080x1920) [687.4 MB] || Illuminate_SmilingSun_en_US.en_US.srt [2.3 KB] || Illuminate_SmilingSun_en_US.en_US.vtt [2.3 KB] || IlluminateSmilingSun_NoCaptions_ProRes422.mov (1080x1920) [1.2 GB] ||"
                  - strong [ref=f6e871]: "NASA’s Illuminate: Spooky Sprites and Other Eerie Lights"
                  - text: "High in the atmosphere, mysterious flashes light up the sky during thunderstorms. Unconfirmed until 1989, these Transient Luminous Events, or TLEs, have mythological names like sprites, TROLLS (Transient Red Optical Luminous Lineament), and green ghosts.Now, NASA is on the hunt with a project called Spritacular, where people across the globe photograph and study these TLEs. Learn more about Spritacular:"
