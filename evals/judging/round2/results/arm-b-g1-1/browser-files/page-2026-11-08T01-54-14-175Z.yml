                - paragraph [ref=f6e1006]: The NASA climate spiral visualization of the GISTEMP global temperature record. || 5190 || NASA Climate Spiral 1880-Present || The NASA climate spiral visualization with labels in English and Celsius. || GISTEMP_Spiral_English_degC_2160p60.mp4 (2160x2160) [19.4 MB] || En_C (2160x2160) [1800 Item(s)] || GISTEMP_Spiral_English_degC_2160p60.01402_full.jpg (2160x2160) [389.3 KB] || GISTEMP_Spiral_English_degC_2160p60.01402_print.jpg (1080x1080) [306.5 KB] || The visualization presents monthly global temperature anomalies. This visualization is updated roughly two weeks after the end of each month.Temperature anomalies are deviations from a long term global average. In this case the period 1951-1980 is used to define the baseline for the anomaly. These temperatures are based on the GISS Surface Temperature Analysis (GISTEMP v4), an estimate of global surface temperature change. The data file used to create this visualization is publicly accessible here.The term 'climate spiral' describes an animated radial plot of global temperatures. Climate scientist Ed Hawkins from the National Centre for Atmospheric Science, University of Reading popularized this style of visualization in 2016.The Goddard Institute for Space Studies (GISS) in New York is a NASA laboratory managed by the Earth Sciences Division of the agency’s Goddard Space Flight Center in Greenbelt, Maryland. The laboratory is affiliated with Columbia University’s Earth Institute and School of Engineering and Applied Science in New York. || The NASA climate spiral visualization with labels in English and Fahrenheit. || GISTEMP_Spiral_English_degF_2160p60.01700_full.jpg (2160x2160) [233.4 KB] || GISTEMP_Spiral_English_degF_2160p60.mp4 (2160x2160) [20.4 MB] || The NASA climate spiral visualization with labels in Spanish and Celsius. || GISTEMP_Spiral_Spanish_degC_2160p60.01400_full.jpg (2160x2160) [389.4 KB] || GISTEMP_Spiral_Spanish_degC_2160p60.mp4 (2160x2160) [19.4 MB] || 