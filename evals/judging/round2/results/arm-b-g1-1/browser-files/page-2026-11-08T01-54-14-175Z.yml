                - paragraph [ref=f6e691]:
                  - text: "Earth’s protective ozone layer remains on track for long-term recovery, despite atmospheric conditions that contributed to a larger Antarctic ozone hole in 2026, NASA and the National Oceanic and Atmospheric Administration (NOAA) reported. The ozone hole ranked seventh largest by area in 48 years of monitoring, but was not as deep as other large holes on record. || || 15116 || 2026 Ozone Hole Update || Earth’s protective ozone layer remains on track for long-term recovery, despite atmospheric conditions that contributed to a larger Antarctic ozone hole in 2026, NASA and the National Oceanic and Atmospheric Administration (NOAA) reported. The ozone hole ranked seventh largest by area in 48 years of monitoring, but was not as deep as other large holes on record. || Universal Production Music: Drift Underscore by ProdhommeComplete transcript available. || 15116_2026_Ozone_YouTube_Thumbnail.jpg (1920x1080) [282.9 KB] || 15116_2026_Ozone_YouTube_Thumbnail_print.jpg (1024x576) [124.9 KB] || 15116_2026_Ozone_YouTube_Thumbnail_searchweb.png (320x180) [31.6 KB] || 15116_2026_Ozone_YouTube_Thumbnail_web.png (320x180) [31.6 KB] || 15116_2026_Ozone_YouTube_Thumbnail_thm.png (80x40) [3.5 KB] || 15116_2026_Ozone_YouTube.mp4 (1920x1080) [102.8 MB] || Version formatted for vertical social platforms. Universal Production Music: Cyclic Marimba by Eric Chevailer [SACEM]Complete transcript available. || 15116_20206Ozone_Social.00001_print.jpg (1024x1820) [186.8 KB] || 15116_20206Ozone_Social.00001_searchweb.png (320x180) [63.1 KB] || 15116_20206Ozone_Social.00001_web.png (320x569) [107.3 KB] || 15116_20206Ozone_Social.00001_thm.png (80x40) [5.4 KB] || 15116_20206Ozone_Social.mp4 (1080x1920) [131.0 MB] || 15116_2026OzoneSocial.en_US.srt [3.5 KB] || 15116_2026OzoneSocial.en_US.vtt [3.3 KB] || For More Information || See"
