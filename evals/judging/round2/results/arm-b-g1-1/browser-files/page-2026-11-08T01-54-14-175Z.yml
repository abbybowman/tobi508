                - paragraph [ref=f6e1171]: "The star map in celestial coordinates, at five different resolutions. The map is centered at 0h right ascension, and r.a. increases to the left. || starmap_2020_4k_print.jpg (1024x512) [41.8 KB] || starmap_2020_4k_searchweb.png (320x180) [53.9 KB] || starmap_2020_4k_thm.png (80x40) [5.5 KB] || starmap_2020_4k.exr (4096x2048) [34.3 MB] || starmap_2020_8k.exr (8192x4096) [124.5 MB] || starmap_2020_16k.exr (16384x8192) [422.9 MB] || starmap_2020_32k.exr (32768x16384) [1.4 GB] || starmap_2020_64k.exr (65536x32768) [3.8 GB] || || 4851 || Deep Star Maps 2020 || The star map in celestial coordinates, at five different resolutions. The map is centered at 0h right ascension, and r.a. increases to the left. || starmap_2020_4k_print.jpg (1024x512) [41.8 KB] || starmap_2020_4k_searchweb.png (320x180) [53.9 KB] || starmap_2020_4k_thm.png (80x40) [5.5 KB] || starmap_2020_4k.exr (4096x2048) [34.3 MB] || starmap_2020_8k.exr (8192x4096) [124.5 MB] || starmap_2020_16k.exr (16384x8192) [422.9 MB] || starmap_2020_32k.exr (32768x16384) [1.4 GB] || starmap_2020_64k.exr (65536x32768) [3.8 GB] || This set of star maps was created by plotting the position, brightness, and color of 1.7 billion stars from the Hipparcos-2, Tycho-2, and Gaia Data Release 2 star catalogs, with help from the Yale Bright Star Catalog, UCAC3, and the XHIP Hipparcos cross-reference. The constellation boundaries are those established by the International Astronomical Union in 1930. The constellation figures also come from the IAU, although they're not official.Skip the explanationThe maps are presented in plate carrée projections using either celestial (ICRF/J2000 geocentric right ascension and declination) or galactic coordinates. They are designed for spherical mapping in animation software. The oval shapes near the top and bottom of the star maps are not galaxies. The distortion of the stars in those parts of the map is just an effect of the projection.The celestial coordinate mapping will be the more useful one for 3D animation, since camera rotations in the software will correspond in a straightforward way to the right ascension and declination in astronomy references. The galactic coordinate mapping is probably better for 2D animation and compositing. It also works as a standalone image showing the edge-on view of our home galaxy, from the inside. Update: The galactic images were replaced on January 4, 2021. The original images used ICRF/J2000 coordinates in a galactic coordinate transformation meant for B1950. The new images use the transformation described in the Hipparcos and Gaia documentation.The boundary, figure, and grid images are conventional grayscale TIFF files. The star maps are in OpenEXR's half-float format, which provides higher dynamic range in a linear colorspace while easily accommodating very large files. Most 3D animation and HDR image processing software can read OpenEXR.Catalog CompletenessHipparcos-2 provided the data for stars brighter than magnitude 8.0. To check HIP2's completeness, it was compared with the Yale Bright Star Catalog by matching positions, by using the XHIP cross-reference catalog, and by consulting the SIMBAD database.Of the 9096 stars in Yale, about one hundred have no matching Henry Draper ID in HIP2. Most of these are the second members of double or multiple stars that are represented in HIP2 as a single entry, and their omission has no visible effect on the star map. Another few are highly variable stars listed in Yale at their brightest magnitude, even though this magnitude is atypical. An example is T Coronae Borealis, the Blaze Star, which reached the magnitude listed in Yale only in 1866 and 1946; it normally hovers around magnitude 10.The remaining 18 stars can be considered genuinely missing:HRMagComment4210 4.30Eta Car4375 4.41Xi UMa A4374 4.87Xi UMa B5978 4.77Xi Sco A5977 5.07Xi Sco B4729 4.86256 Cru, 90\" from Acrux (Alp Cru)2322 5.985343 5.98CN Boo, 17' from Arcturus (Alp Boo)2950 6.0212' from Procyon (Alp CMi)1982 6.15AK Lep, 97\" from Gam Lep5034 6.1861\" from J Cen2366 6.20HIP 31067, omitted from HIP24619 6.373.6' from Del Cen1704 6.3715' from Rigel (Bet Ori)6660 6.38part of M7 in Sco6263 6.45part of NGC 6231 in Sco2341 6.5110' from Canopus (Alp Car)6848 6.84part of M24 in SgrThese were added to the star maps. Some are relatively near very bright stars that may have made the measurement of their dimmer neighbor by Hipparcos problematic. The magnitude of Eta Carina is an estimate based on the AAVSO Light Curve Generator as of July 2020. All other data was taken from Yale.Missing stars at fainter magnitudes are in general much less visually apparent. The completeness of Tycho-2, used for stars with visual magnitudes between 8.0 and 11.5, was assumed. And since data in the Hipparcos and Tycho catalogs share the same provenance, there's less concern about drawing stars twice or losing them in the cracks at the crossover magnitude. Gaia DR2, however, has two obvious data holes centered at r.a. 97.9°, dec. 57.5° and 34.2°, 22.1°. These were filled in using stars from UCAC3.Star ColorsThe colors of the stars from both Hipparcos-2 and Tycho-2 were based on the B-V color index. This requires a mapping from B-V to effective temperature, Teff. In previous versions of this product, the mapping used a high-degree polynomial fit, but it was found that this fit was calculated using a relatively narrow range of B-V. Outside this range, the fit behaved poorly, producing a number of unrealistically red stars. For this version, the mapping was a slightly modified version of a function ascribed to F. Ballesteros.The spectrum of light emitted by a blackbody with a temperature Teff can in turn be mapped to an RGB triple, yielding the star color. See Mitchell Charity's What color is a blackbody?, which was used for the present work. In common with Charity, the modest goal here was not-completely-bogus colors.The colors of Gaia DR2 stars were taken from the fields called G, GRP, GBP, scaled by color balance factors estimated by eye. See this article from the Gaia team for more information about the passbands for these three measurements. Roughly a quarter of the DR2 stars lack GRP, GBP values, and those are set to white.TourThe animation demonstrates the use of the maps in a tour of the sky. The tour starts at W-shaped Cassiopeia, then heads south through Perseus to the winter constellation of Orion the Hunter and the Hyades and Pleiades star clusters in Taurus. It moves southeast past Orion's canine companion and its star, Sirius, brightest in the sky, eventually pausing at the rich southern hemisphere portion of the Milky Way in Carina and Crux, the Southern Cross.East of the Cross, in Centaurus, is the binary star Alpha Centauri, at 4.4 light-years the naked-eye star system nearest to the Sun. Also visible as a fuzzy spot near the top of the frame is the globular cluster Omega Centauri. The number of stars used to draw the star maps is large enough to reveal many globular and open star clusters as well as the Large and Small Magellanic Clouds.After passing near the celestial south pole, the tour moves north along the Milky Way to the center of our galaxy near the teapot in Sagittarius. The tour veers northwest from there, finally stopping at the familiar Big Dipper or Plough asterism in Ursa Major.This is an update to entry 3895. || A celestial coordinate grid. || celestial_grid_16k_print.jpg (1024x512) [41.2 KB] || celestial_grid_16k.tif (16384x8192) [2.6 MB] || celestial_grid_32k.tif (32768x16384) [6.5 MB] || celestial_grid_64k.tif (65536x32768) [16.9 MB] || Official IAU constellation bounds in celestial coordinates. || constellation_bounds_4k_print.jpg (1024x512) [49.9 KB] || constellation_bounds_4k.tif (4096x2048) [319.1 KB] || constellation_bounds_8k.tif (8192x4096) [684.3 KB] || constellation_bounds_16k.tif (16384x8192) [1.5 MB] || constellation_bounds_32k.tif (32768x16384) [3.5 MB] || constellation_bounds_