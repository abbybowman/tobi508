                - paragraph [ref=f6e1043]:
                  - text: "Artemis II launches four astronauts aboard NASA’s Orion spacecraft into Earth orbit, sending them on a loop around the Moon before returning safely to Earth. The mission follows a free-return trajectory that uses the gravity of the Earth and Moon to naturally guide the crew home. This visualization shows the mission trajectory based on flight-derived ephemeris data. || 5632 || Artemis II mission trajectory || Trajectory of NASA’s Artemis II mission, from Earth orbit around the Moon and back to Earth, using flight-derived ephemeris data. Times are shown in UTC. || a2_mission_trajectory_01.00800_preview.jpg (1920x1080) [286.0 KB] || a2_mission_trajectory_01.00800.jpg (3840x2160) [1.4 MB] || a2_mission_trajectory_1080p60.mp4 (1920x1080) [18.4 MB] || a2_mission_trajectory_2160p60.mp4 (3840x2160) [78.2 MB] || Artemis II is NASA’s first crewed mission of the Artemis program, launching four astronauts aboard the Orion spacecraft into Earth orbit and sending them on a loop around the Moon before returning safely to Earth. The mission follows a free-return trajectory, using the gravity of the Earth and Moon to naturally guide the crew home.These visualizations show the mission trajectory based on flight ephemeris data.Artemis II ephemeris data can be found here:"
