                - paragraph [ref=f6e1359]:
                  - text: "In this flight toward a supermassive black hole, labels highlight many of the fascinating features produced by the effects of general relativity along the way. This supercomputer visualization tracks a camera as it approaches, briefly orbits, and then crosses the event horizon — the point of no return — of a supersized black hole similar in mass to the one at the center of our galaxy. Credit: NASA's Goddard Space Flight Center/J. Schnittman and B. PowellMusic: “Tidal Force,” Thomas Daniel Bellingham [PRS], Universal Production Music“Memories” from Digital Juice“Path Finder,” Eric Jacobsen [TONO] and Lorenzo Castellarin [BMI], Universal Production MusicWatch this video on the NASA Goddard YouTube channel.Complete transcript available. || 14576_BHPlunge_Explain_Still.jpg (3840x2160) [1.2 MB] || 14576_PageThumbnail.jpg (3840x2160) [1.2 MB] || 14576_PageThumbnail_searchweb.png (180x320) [85.0 KB] || 14576_PageThumbnail_thm.png (80x40) [9.6 KB] || 14576_BHPlunge_Explainer_1080.mp4 (1920x1080) [319.5 MB] || 14576_BHPlunge_Explainer_Captions.en_US.srt [2.5 KB] || 14576_BHPlunge_Explainer_Captions.en_US.vtt [2.4 KB] || 14576_BHPlunge_Explainer_4k.mp4 (3840x2160) [1.5 GB] || 14576_BHPlunge_Explainer_4kYouTube.mp4 (3840x2160) [3.0 GB] || 14576_BHPlunge_Explainer_ProRes_3840x2160_2997.mov (3840x2160) [12.8 GB] || || 14576 || NASA Black Hole Visualization Takes Viewers Beyond the Brink || In this flight toward a supermassive black hole, labels highlight many of the fascinating features produced by the effects of general relativity along the way. This supercomputer visualization tracks a camera as it approaches, briefly orbits, and then crosses the event horizon — the point of no return — of a supersized black hole similar in mass to the one at the center of our galaxy. Credit: NASA's Goddard Space Flight Center/J. Schnittman and B. PowellMusic: “Tidal Force,” Thomas Daniel Bellingham [PRS], Universal Production Music“Memories” from Digital Juice“Path Finder,” Eric Jacobsen [TONO] and Lorenzo Castellarin [BMI], Universal Production MusicWatch this video on the NASA Goddard YouTube channel.Complete transcript available. || 14576_BHPlunge_Explain_Still.jpg (3840x2160) [1.2 MB] || 14576_PageThumbnail.jpg (3840x2160) [1.2 MB] || 14576_PageThumbnail_searchweb.png (180x320) [85.0 KB] || 14576_PageThumbnail_thm.png (80x40) [9.6 KB] || 14576_BHPlunge_Explainer_1080.mp4 (1920x1080) [319.5 MB] || 14576_BHPlunge_Explainer_Captions.en_US.srt [2.5 KB] || 14576_BHPlunge_Explainer_Captions.en_US.vtt [2.4 KB] || 14576_BHPlunge_Explainer_4k.mp4 (3840x2160) [1.5 GB] || 14576_BHPlunge_Explainer_4kYouTube.mp4 (3840x2160) [3.0 GB] || 14576_BHPlunge_Explainer_ProRes_3840x2160_2997.mov (3840x2160) [12.8 GB] || New, immersive visualizations produced on a NASA supercomputer let anyone take a trip into a black hole’s point of no return.The visualizations represent two scenarios, one where a camera — a stand-in for a daring astronaut — just misses the event horizon and slingshots back out, and another where the camera enters the event horizon, sealing its fate.The visualizations are available in multiple forms, including 360-degree videos that let viewers look all around during the trip. Explainer videos act as sightseeing guides, highlighting the bizarre effects of Einstein’s general theory of relativity. Additional versions are rendered as flat all-sky maps.Goddard scientists created the visualizations on the Discover supercomputer at the NASA Center for Climate Simulation. The destination is a supermassive black hole with 4.3 million times the mass of our Sun, equivalent to the monster located at the center of our Milky Way galaxy. To simplify the complex calculations, the black hole is not rotating.A flat, swirling cloud of hot, glowing gas called an accretion disk surrounds the black hole and serves as a visual reference during the fall. So do glowing structures called photon rings, which form closer to the black hole from light that has orbited it one or more times. A backdrop of the starry sky as seen from Earth completes the scene. The project generated about 10 terabytes of data — equivalent to roughly half of the estimated text content in the Library of Congress — and took about 5 days running on just 0.3% of Discover’s 129,000 processors. The same feat would take more than a decade on a typical laptop.Movies and frame sets are available below. For more detailed information using specific frames, see Beyond the Brink: Tracking a Simulated Plunge into a Black Hole. Some numbers to think about:The outer edge of the accretion disk extends to a radius of about 97 million miles (156 million kilometers), comparable to the distance between Earth and the Sun.The inner edge of the accretion disk starts at a radius of around 23 million miles (38 million kilometers), about 25% of the Earth-Sun distance.The radius of the photon ring is 15.5 million miles (25 million kilometers).The event horizon radius is about 7.8 million miles (12.5 million kilometers).Spaghettification occurs around 79,500 miles (128,000 kilometers) from the singularity, the center of the black hole. || Labeled version of the rectangular view that includes an explanation of visual features. This image shows the entire sky as seen from a simulated camera plunging toward a 4-million-solar-mass black hole, similar to the one at the center of our galaxy. The camera lies about 10 million miles (16 million kilometers) from the black hole’s event horizon and is moving inward at 62% the speed of light.Credit: NASA's Goddard Space Flight Center/J. Schnittman and B. Powell || labels_4_BH_Viz_45rg_062c.jpg (2393x1197) [1.3 MB] || This version is encoded to play as a 360 VR movie. It follows the plunge of a simulated camera into a non-rotating supermassive black hole. The object's mass is 4.3 million Suns, equivalent to the black hole lying at the center of our Milky Way galaxy. The orange structure surrounding the black hole represents the hot, glowing gas of its accretion disk, where infalling matter collects and slowly spirals inward. Interior to the disk is a thin set of photon rings, which are images of the disk produced by light that has orbited the black hole one or more times before reaching the camera. The camera completes almost two orbits before hitting the event horizon. During the journey, a variety of effects caused by the gravitationally warped space-time around the black hole and the camera's speed become increasingly apparent. Images of the disk and the background sky morph, duplicate, and even form mirror images. Structures in the direction of travel, at the center of the simulation, brighten greatly as speed increases. At 42 seconds, the camera crosses the event horizon, traveling ever closer to the speed of light. Due to the camera’s speed, the entire sky appears to shift progressively forward, shrinking before our eyes. After entering the event horizon, the camera would be destroyed by tidal forces 12.8 seconds later, then in microseconds rush to the singularity, a point in the black hole's center where the laws of physics as we know them no longer apply.Credit: NASA's Goddard Space Flight Center/J. Schnittman and B. PowellMusic: “Tidal Force,” Thomas Daniel Bellingham [PRS], Universal Production MusicWatch this video on the NASA Goddard YouTube channel.Complete transcript available. || 14576_BHPlunge_360_Still.jpg (3840x2160) [906.4 KB] || 14576_BHPlunge_360_FINAL_1080.mp4 (2160x1080) [169.2 MB] || 14576_BHPlunge_360_Captions.en_US.srt [211 bytes] || 14576_BHPlunge_360_Captions.en_US.vtt [211 bytes] || 14576_BHPlunge_360_FINAL_4k.mp4 (4096x2048) [636.4 MB] || 14576_BHPlunge_360_FINAL_8k.mp4 (8192x4096) [1.2 GB] || Camera plunge, equidistant rectangular projection. This all-sky movie follows the plunge of a simulated camera into a non-rotating supermassive black hole. The object's mass is 4.3 million Suns, equivalent to the black hole lying at the center of our Milky Way galaxy. The orange structure surrounding the black hole represents the hot, glowing gas of its accretion disk, where infalling matter collects and slowly spirals inward. Interior to the disk is a thin set of photon rings, which are images of the disk produced by light that has orbited the black hole one or more times before reaching the camera. The camera completes almost two orbits before hitting the event horizon. During the journey, a variety of effects caused by the gravitationally warped space-time around the black hole and the camera's speed become increasingly apparent. Images of the disk and the background sky morph, duplicate, and even form mirror images. Structures in the direction of travel, at the center of the simulation, brighten greatly as speed increases. At 42 seconds, the camera crosses the event horizon, traveling ever closer to the speed of light. Due to the camera’s speed, the entire sky appears to shift progressively forward, shrinking before our eyes. After entering the event horizon, the camera would be destroyed by tidal forces 12.8 seconds later, then in microseconds rush to the singularity, a point in the black hole's center where the laws of physics as we know them no longer apply. Credit: NASA's Goddard Space Flight Center/J. Schnittman and B. Powell || Plunge_Rectilinear_Still_03528.jpg (8192x4096) [1.2 MB] || 14576_BH_Plunge_Rectilinear_2160x1080_30.mp4 (2160x1080) [105.3 MB] || Plunge_Rect (8192x4096) [3518 Item(s)] || 14576_BH_Plunge_Rectilinear_4096x2048_60.mp4 (4096x2048) [349.7 MB] || 14576_BH_Plunge_Rectilinear_8192x4096_60.mp4 (8192x4096) [699.3 MB] || 14576_BH_Plunge_Rectilinear_ProRes_8192x4096_60.mov (8192x4096) [23.9 GB] || Camera plunge, Mollweide equal-area projection. This all-sky movie follows the plunge of a simulated camera into a non-rotating supermassive black hole. The object's mass is 4.3 million Suns, equivalent to the black hole lying at the center of our Milky Way galaxy. The orange structure surrounding the black hole represents the hot, glowing gas of its accretion disk, where infalling matter collects and slowly spirals inward. Interior to the disk is a thin set of photon rings, which are images of the disk produced by light that has orbited the black hole one or more times before reaching the camera. The camera completes almost two orbits before hitting the event horizon. During the journey, a variety of effects caused by the gravitationally warped space-time around the black hole and the camera's speed become increasingly apparent. Images of the disk and the background sky morph, duplicate, and even form mirror images. Structures in the direction of travel, at the center of the simulation, brighten greatly as speed increases. At 42 seconds, the camera crosses the event horizon, traveling ever closer to the speed of light. Due to the camera’s speed, the entire sky appears to shift progressively forward, shrinking before our eyes. After entering the event horizon, the camera would be destroyed by tidal forces 12.8 seconds later, then in microseconds rush to the singularity, a point in the black hole's center where the laws of physics as we know them no longer apply.Credit: NASA's Goddard Space Flight Center/J. Schnittman and B. Powell || Plunge_Mollweide_Still_02190.jpg (8192x4096) [3.5 MB] || 14576_BH_Plunge_Mollweide_2160x1080_30.mp4 (2160x1080) [105.5 MB] || Plunge_Moll (8192x4096) [3518 Item(s)] || 14576_BH_Plunge_Mollweide_4096x2048_60.mp4 (4096x2048) [349.7 MB] || 14576_BH_Plunge_Mollweide_8192x4096_60.mp4 (8192x4096) [699.0 MB] || 14576_BH_Plunge_Mollweide_ProRes_8192x4096_60.mov (8192x4096) [24.8 GB] || This sequence shows a zoom into the plunging camera’s direction of travel to reveal the detailed structure of the photon rings. Each band is a distorted image of the gas disk layered between the background sky. Successive bands are thinner, produced by photons that have taken an additional trip around the black hole before reaching the camera. Due to the camera’s speed, which approaches 99.9% that of light toward the end, the entire sky appears to shift progressively forward, seemingly shrinking before our eyes. The field of view is 10 degrees across, about the width of a fist held at arm’s length. Credit: NASA's Goddard Space Flight Center/J. Schnittman and B. Powell || Plunge_Zoom_Still_03607.jpg (3840x2160) [1.4 MB] || Plunge_Zoom (3840x2160) [2528 Item(s)] || 14576_BH_Plunge_Zoom2b_1080.mp4 (3840x2160) [74.0 MB] || 14576_BH_Plunge_Zoom2b_4k60.mp4 (3840x2160) [241.0 MB] || 14576_BH_Plunge_Zoom2b_ProRes_3840x2160_60.mov (3840x2160) [4.1 GB] || 14576_BH_Plunge_Zoom_ProRes_3840x2160_60.mov (3840x2160) [4.3 GB] || Plunge camera track. This movie tracks the position and orientation of the falling camera relative to the black hole. The inner circle represents the event horizon, the dashed circle represents the photon ring, which forms at the edge of the event horizon's shadow (twice the event horizon's size), and the dotted line shows the camera's path. A red line represents the plane of the accretion disk surrounding the black hole. At about 15 seconds, the image zooms in to follow the camera as it makes almost two loops around the black hole. At 42 seconds, the camera slips past the event horizon and arcs to the black hole's center.Credit: NASA's Goddard Space Flight Center/J. SchnittmanVisual description: On a black background, a white cartoon camera approaches a broken red line interrupted by a large dashed white circle at its center. Inside the dashed circle is a smaller white circle with a solid line. The camera, trailing a dotted line as it travels, spirals into the central white circle. || Plunge_Inset_Still_03170.jpg (900x480) [26.7 KB] || Plunge_Camera (900x480) [3518 Item(s)] || 14576_BH_Plunge_Inset_900x480_60.mp4 (900x480) [4.9 MB] || 14576_BH_Plunge_Inset_ProRes_900x480_60.mov (900x480) [153.1 MB] || Plunge clock comparison. This movie tracks the local time of the falling camera, the time as experienced by a faraway observer (coordinate time), and the maximum blueshift observed. This is the factor by which the frequency of light in the direction of travel is increased. At 42 seconds, coordinate time reads all 9s, indicating that the camera has crossed the event horizon and external time is infinite. The blueshift continues to climb, exceeding 43 by the end, which indicates motion exceeding 99.9% light speed.Credit: NASA's Goddard Space Flight Center/J. SchnittmanVisual description: A box on a white background contains three lines of text. The top line reads \"local time,\" the second line reads \"coord time,\" and the third reads \"max blueshift.\" As the video plays, these times increase and diverge as described above. || Plunge_Times_Still_03900.jpg (900x480) [24.4 KB] || 14576_BH_Plunge_Times_900x480_60.mp4 (900x480) [15.8 MB] || Plunge_Times (900x480) [3518 Item(s)] || 14576_BH_Plunge_Times_ProRes_900x480_60.mov (900x480) [154.5 MB] || In this flight toward a supermassive black hole, labels highlight many of the fascinating features produced by the effects of general relativity along the way. This supercomputer visualization tracks a camera as it approaches, falls toward, briefly orbits, and escapes a supersized black hole similar in mass to the one at the center of our galaxy. Credit: NASA's Goddard Space Flight Center/J. Schnittman and B. PowellMusic: \"Beautiful Awesome,” David Husband and James William Banbury [PRS], Universal Production Music“Awakening Yearning,” David Ashok Ramani and Jonathan Elias [ASCAP], Universal Production Music“Dawning,” Lorenzo Castellarin [BMI], Universal Production MusicWatch this video on the NASA Goddard YouTube channel.Complete transcript available. || 14576_BHFlyBy_Explain_Still.jpg (3840x2160) [1.1 MB] || 14576_BHFlyBy_Explainer_1080.mp4 (1920x1080) [294.7 MB] || 14576_BHFlyBy_Explainer_Captions.en_US.srt [2.4 KB] || 14576_BHFlyBy_Explainer_Captions.en_US.vtt [2.3 KB] || 14576_BHFlyBy_Explainer_4k.mp4 (3840x2160) [1.4 GB] || 14576_BHFlyBy_Explainer_4kYouTube.mp4 (3840x2160) [2.8 GB] || 14576_BHFlyBy_Explainer_ProRes_3840x2160_2997.mov (3840x2160) [12.9 GB] || This version is encoded to play as a 360 VR movie. It follows the trajectory of a simulated camera approaching and looping around a non-rotating supermassive black hole. The object's mass is 4.3 million Suns, equivalent to the black hole lying at the center of our Milky Way galaxy. The orange structure surrounding the black hole represents the hot, glowing gas of its accretion disk, where infalling matter collects and slowly spirals inward. Interior to the disk is a thin set of photon rings, which are images of the disk produced by light that has orbited the black hole one or more times before reaching the camera. The camera completes two orbits before escaping back out to safety. During the journey, a variety of effects caused by the gravitationally warped space-time around the black hole and the camera's speed become increasingly apparent. Images of the disk and the background sky morph, duplicate, and even form mirror images. Structures in the direction of travel, at the center of the simulation, brighten greatly as speed increases. At 46 seconds, the camera makes its closest approach to the event horizon, reaching maximum velocity at 60% the speed of light.Credit: NASA's Goddard Space Flight Center/J. Schnittman and B. PowellMusic: \"Beautiful Awesome,” David Husband and James William Banbury [PRS], Universal Production MusicWatch this video on the NASA Goddard YouTube channel.Complete transcript available. || 14576_BHFlyBy_360_Still.jpg (3840x2160) [1.1 MB] || 14576_BHFlyBy_360_FINAL_1080.mp4 (2160x1080) [188.8 MB] || 14576_BHFlyBy_360VR_FINAL_1080.mp4 (2160x1080) [188.9 MB] || 14576_BHFlyBy_360_Captions.en_US.srt [213 bytes] || 14576_BHFlyBy_360_Captions.en_US.vtt [213 bytes] || 14576_BHFlyBy_360_FINAL_4k.mp4 (4096x2048) [699.8 MB] || 14576_BHFlyBy_360VR_FINAL_4k.mp4 (4096x2048) [699.8 MB] || 14576_BHFlyBy_360_FINAL_8k.mp4 (8192x4096) [1.4 GB] |