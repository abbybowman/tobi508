                - paragraph [ref=f6e1278]: "While black holes can’t emit their own light, matter surrounding and falling toward it can create quite a light show. Here you’ll find a collection of data visualizations, illustrations, and telescope images of black hole environments. Download these phone and desktop wallpapers for your screens. || || 14146 || Black Hole Desktop & Phone Wallpapers || While black holes can’t emit their own light, matter surrounding and falling toward it can create quite a light show. Here you’ll find a collection of data visualizations, illustrations, and telescope images of black hole environments. Download these phone and desktop wallpapers for your screens. || Supermassive Black Hole Binary Simulation These two black holes are just 40 orbits away from merging in this simulation of the light their environment emits as they dance. Download the desktop version here.Download the smartphone version here.Credit: Credit: NASA's Goddard Space Flight Center/Scott Noble; simulation data, d'Ascoli et al. 2018 || SupermassiveBinaryBlackHoles_desktop_print.jpg (1024x576) [50.9 KB] || SupermassiveBinaryBlackHoles_desktop.png (1920x1080) [772.6 KB] || SupermassiveBinaryBlackHoles_phone.png (1080x1920) [632.0 KB] || SupermassiveBinaryBlackHoles_desktop_searchweb.png (320x180) [47.9 KB] || SupermassiveBinaryBlackHoles_desktop_thm.png (80x40) [4.8 KB] || Doubly Warped World of Binary Black HolesThis image shows the warped view of a larger supermassive black hole (red) when it passes almost directly behind a companion black hole (blue) with half its mass. The gravity of the foreground black hole transforms its partner into a surreal collection of arcs. Download the desktop version here.Download the smartphone version here. (version 1) and here. (version 2). Credit: NASA’s Goddard Space Flight Center/Jeremy Schnittman and Brian P. Powell || DoublyWarpedBlackHole_desktop.png (1920x1080) [691.9 KB] || DoublyWarpedBlackHole_phone2.png (1080x1920) [906.3 KB] || DoublyWarpedBlackHole_phone1.png (1080x1920) [409.8 KB] || DoublyWarpedBlackHole_desktop_print.jpg (1024x576) [99.3 KB] || Black Hole Accretion Disk and CoronaA black hole pulls material off a neighboring star and into an accretion disk in this illustration of a black hole named MAXI J1820+070. Above the disk is a region of superhot subatomic particles called the corona.Download the desktop version here.Download the smartphone version here.Credit: Aurore Simonnet and NASA’s Goddard Space Flight Center || BlackHoleDisk_desktop.png (1920x1080) [2.4 MB] || BlackHoleDisk_phone.png (1080x1920) [2.4 MB] || BlackHoleDisk_desktop_print.jpg (1024x576) [116.5 KB] || A Multiwavelength View of the Milky Way’s CenterThe central region of our galaxy, the Milky Way, contains an exotic collection of objects, including a supermassive black hole weighing about 4 million times the mass of the Sun, clouds of gas at temperatures of millions of degrees, neutron stars and white dwarf stars tearing material from companion stars, and beautiful tendrils of radio emission. This new composite image shows Chandra data (green and blue) combined with radio data (red) from the MeerKAT telescope in South Africa. Download the desktop version here.Download the smartphone version here.Credit: X-Ray:NASA/CXC/UMass/D. Wang et al.; Radio:NRF/SARAO/MeerKAT || GalacticCenter_desktop.png (1920x1080) [2.5 MB] || GalacticCenter_phone.png (1080x1920) [3.1 MB] || GalacticCenter_desktop_print.jpg (1024x576) [232.0 KB] || Black Hole Jets in Hercules ASpectacular jets powered by the gravitational energy of a supermassive black hole in the core of the elliptical galaxy Hercules A as imaged by Hubble Space Telescope's Wide Field Camera 3 and the Karl G. Jansky Very Large Array (VLA) radio telescope in New Mexico.Download the desktop version here.Download the smartphone version here.Credit: NASA, ESA, S. Baum and C. O'Dea (RIT), R. Perley and W. Cotton (NRAO/AUI/NSF), and the Hubble Heritage Team (STScI/AURA) || HerculesA_desktop.png (1920x1080) [4.2 MB] || HerculesA_phone.png (1080x1920) [4.2 MB] || HerculesA_desktop_print.jpg (1024x576) [120.9 KB] || Black Hole Accretion Disk Visualization This visualization of a black hole illustrates how its gravity distorts our view, warping its surroundings as if seen in a carnival mirror. The visualization simulates the appearance of a black hole where infalling matter has collected into a thin, hot structure called an accretion disk. The black hole’s extreme gravity skews light emitted by different regions of the disk, producing the misshapen appearance. Download the desktop version here.Download the smartphone version here.Credit: NASA's Goddard Space Flight Center/Jeremy Schnittman || BH_accretion_disk_viz_desktop.png (1920x1080) [497.0 KB] || BH_accretion_disk_viz_mobile.png (1080x1920) [374.7 KB] || BH_accretion_disk_viz_desktop_print.jpg (1024x576) [64.1 KB] || Supercomputer Simulation Frame of a Star Distorted by a Black Hole This frame is from a simulation of a star weighing 15 percent of our Sun's mass passing close to a black hole that weighs about 1 million Suns. The black hole’s gravity stretches and deforms the star. These simulations show that destruction and survival depend on the stars’ initial densities. Yellow represents the greatest densities, blue the least dense.Download the desktop version here.Download the smartphone version here.Credit: NASA's Goddard Space Flight Center/Taeho Ryu (MPA) || BH_shredding_star_desktop.png (1920x1080) [344.4 KB] || BH_shredding_star_mobile.png (1080x1920) [342.0 KB] || BH_shredding_star_desktop_print.jpg (1024x576) [31.3 KB] || Artist’s Concept of a Gamma-ray Burst Two neutron stars begin to merge in this artist’s concept, blasting jets of high-speed particles and producing a cloud of debris. Scientists think these kinds of events are factories for a significant portion of the universe’s heavy elements, including gold.Download the desktop version here.Download the smartphone version here.Credit: A. Simonnet (Sonoma State University) and NASA’s Goddard Space Flight Center || GRB_artist_concept_desktop.png (1920x1080) [3.6 MB] || GRB_artist_concept_mobile..png (1080x1920) [3.3 MB] || GRB_artist_concept_desktop_print.jpg (1024x576) [210.4 KB] || Artist’s Concept of a Runaway Black Hole This is an artist's concept of a runaway supermassive black hole that was ejected from its host galaxy as a result of a tussle between it and two other black holes. As the black hole plows through intergalactic space it compresses tenuous gas in front of it. This precipitates the birth of hot blue stars. This illustration is based on Hubble Space Telescope observations of a 200,000-light-year-long trail of stars behind an escaping black hole.Download the desktop version here.Download the smartphone version here.Credit: NASA, ESA, Leah Hustak (STScI) || runaway_black_hole_desktop.png (1920x1080) [1.8 MB] || runaway_black_hole_mobile.png (1080x1920) [1.9 MB] || runaway_black_hole_desktop_print.jpg (1024x576) [39.7 KB] || Dust Rings Illuminated by the Blast From the Birth of a Black Hole The most common gamma-ray bursts signal the birth of black holes that form when the cores of massive stars collapse under their own weight. A few bursts have even enabled astronomers to probe distant dust clouds in our own galaxy. This image shows 19 of 20 dust rings detected by XMM-Newton from a gamma-ray burst first detected on October 9, 2022. Download the desktop version here.Download the smartphone version here.Credit: ESA/XMM-Newton/M. Rigoselli (INAF) || GRB_dust_rings_desktop.png (1920x1080) [2.3 MB] || GRB_dust_rings_mobile..png (1080x1920) [1.6 MB] || GRB_dust_rings_desktop_print.jpg (1024x576) [410.5 KB] || Surprisingly Lonely Galaxy This image features a galaxy called 3C 297 that is lonelier than expected after it likely pulled in and absorbed its former companion galaxies. The solo galaxy is located about 9.2 billion light-years from Earth and contains a quasar, a supermassive black hole at the center of the galaxy that pulls in gas and drives powerful jets of matter seen in radio waves.Download the desktop version here.Download the smartphone version here.Credit: x-ray: NASA/CXC/Univ. of Torino/V. Missaglia et al.; Optical: NASA/ESA/STScI & International Gemini Observatory/NOIRLab/NSF/AURA; Infrared: NASA/ESA/STScI; Radio: NRAO/AUI/NSF || lonely_galaxy_desktop.png (1920x1080) [1.3 MB] || lonely_galaxy_mobile.png (1080x1920) [1.0 MB] || lonely_galaxy_desktop_print.jpg (1024x576) [46.3 KB] || Record-breaking Black Hole in Galaxy UHZ1 This image contains the most distant black hole ever detected in X-rays, a result that may explain how some of the first supermassive black holes in the universe formed. This discovery was made using X-rays from NASA’s Chandra X-ray Observatory (purple) and infrared data from NASA’s James Webb Space Telescope (red, green, and blue).Download the desktop version here.Download the smartphone version here.Credit: X-ray: NASA/CXC/SAO/Ákos Bogdán; Infrared: NASA/ESA/CSA/STScI; Image Processing: NASA/CXC/SAO/L. Frattare & K. Arcand || uhz1_comp_desktop.png (1920x1080) [2.5 MB] || uhz1_comp_mobile.png (1080x1920) [2.5 MB] || uhz1_comp_desktop_print.jpg (1024x576) [181.2 KB] || Black Hole Jets in Centaurus A The galaxy Centaurus A (Cen A) shines bright in this image combining X-ray data from NASA’s Chandra X-ray Observatory (blue) and IXPE (Imaging X-ray Polarimetry Explorer) satellite (blue), and optical light from the European Southern Observatory in Chile (white and gray). In the center, a supermassive black hole feeds off the gas and dust encircling it, while large jets of high-energy particles and other material spew out.Download the desktop version here.Download the smartphone version here.Credit: Credit: IXPE: NASA/MSFC/IXPE/S. Ehlert et al.; Chandra: NASA/CXC/SAO || cena_chandra_ixpe_desktop.png (1920x1080) [2.3 MB] || cena_chandra_ixpe_mobile.png (1080x1920) [2.3 MB] || cena_chandra_ixpe_desktop_print.jpg (1024x576) [146.8 KB] || Artist’s Concept Comparing the Sizes of Supermassive Black Holes This image compares the sizes of a few monster black holes that are found at the centers of galaxies. The largest one is TON 618, one of a handful of extremely distant and massive black holes for which astronomers have direct measurements. This behemoth contains more than 60 billion solar masses, and it boasts a shadow so large that a beam of light would take weeks to traverse it. The next smallest is M87 and then Cygnus A.Download the desktop version here.Download the smartphone version here.Credit: NASA's Goddard Space Flight Center Conceptual Image Lab || SMBH_Scale_desktop.png (1920x1080) [2.9 MB] || SMBH_Scale_mobile.png (1080x1920) [2.9 MB] || SMBH_Scale_desktop_print.jpg (1024x576) [173.6 KB] || On the Brink Wallpaper In this wallpaper based on the movie-style poster, the viewer gets the feeling of being on a precipice, teetering just on the edge of a black hole’s event horizon. The event horizon isn’t a solid surface like Earth’s or even the Sun’s. It's the boundary where the black hole's escape velocity equals the speed of light, the speed limit of the universe. Once matter crosses the event horizon, it will never escape the black hole.Download the desktop version here.Download the smartphone version here.Download the square version here.Credit: NASA's Goddard Space Flight Center Conceptual Image Lab || BHWP_Wallpaper_Horizontal.png (3840x2160) [7.0 MB] || BHWP_Wallpaper_Horizontal.jpg (3840x2160) [1.3 MB] || BHWP_Wallpaper_Sq.png (2160x2160) [4.3 MB] || BHWP_Wallpaper_Sq.jpg (2160x2160) [1.1 MB] || BHWP_Wallpaper_Vertical.png (2160x3840) [6.8 MB] || BHWP_Wallpaper_Vertical.jpg (2160x3840) [1.4 MB] || BHWP_Wallpaper_Horizontal_searchweb.png (320x180) [71.8 KB] || BHWP_Wallpaper_Horizontal_thm.png (80x40) [5.2 KB] || Universe || Ast || Astrophysics || Black Hole || Astrophysics Stills || Black Hole Week || Scott Wiessinger (KBR Wyle Services, LLC) as Support || Barb Mattson (University of Maryland College Park) as Producer || Francis Reddy (University of Maryland College Park) as Science writer || Jeanette Kazmierczak (University of Maryland College Park) as Science writer ||"
