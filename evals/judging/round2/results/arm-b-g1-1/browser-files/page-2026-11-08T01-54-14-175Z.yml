          - heading "Our Mission" [level=2] [ref=f6e1489]
          - paragraph [ref=f6e1490]: NASA Scientific Visualization Studio produces visualizations, animations, and images in order to promote a greater understanding of Earth and Space Sciences. We work closely with scientists — both within the NASA community, and within the broader academic research community — to create high-quality, data-backed visualizations.
        - button "" [ref=f6e1491] [cursor=pointer]:
          - generic "What is this image?" [ref=f6e1492]: 
      - generic [ref=f6e1493]:
        - separator [ref=f6e1494]
        - generic [ref=f6e1495]:
          - heading "About Us" [level=2] [ref=f6e1496]
          - paragraph [ref=f6e1497]: NASA Scientific Visualization Studio is based out of the Goddard Space Flight Center (GSFC), located in Greenbelt, Maryland. The core studio consists of a team of (approximately) 15 visualizers, some of whom have been working with the studio for almost 30 years. The SVS's visualizers specialize in a wide variety of disciplines — astronomy, planetary science, climatology, cartography, and 3D modeling (to name a few) — but are united by a common love of making science accessible.
          - heading "History" [level=3] [ref=f6e1498]
          - paragraph [ref=f6e1499]: "NASA’s Scientific Visualization Studio was founded by Jim Strong at the NASA Goddard Space Flight Center (GSFC) in 1990. Jim would soon be joined in 1991 by visualizer Horace Mitchell, who would go on to head the department all the way until his retirement in 2019. The studio was originally founded to create visualizations to go alongside NASA research publications – which still constitute the vast majority of the studio’s work to this day. In the studio’s early days, much of our work focused on creating (near) real-time visualizations: grabbing data from NASA satellites, processing it as rapidly as possible, and producing high-quality, more digestible visualizations."
          - generic [ref=f6e1500]:
            - paragraph [ref=f6e1501]: By 1997, the studio’s focus shifted from real-time visualization technologies (that were primarily research-oriented) towards non-real-time, pre-rendered visualizations aimed towards public outreach. Around this time, the studio also began working closely with the NASA Public Affairs Office (now Office of Communications) to get our visualizations out to a wide variety of news outlets, film production companies, and academic institutions.
            - paragraph [ref=f6e1502]: By 2001, we had developed an extensive library of Betacam-SP tapes (NTSC) and needed a more easily-accessible way for the public to access our content. Thus, the SVS website was born. Since its inception, the SVS website has served as both a historical archive of our works and a place to keep up with the current research of NASA’s Earth and Space Science divisions. Around this time, the SVS also began working closely with our partner groups Conceptual Image Labs (CI Labs) and Goddard Media Studios (GMS) to publish a more diverse array of content. The website would formally begin hosting content from these two groups in 2006.
            - paragraph [ref=f6e1503]: Conceptual Image Labs focuses more on the artistic side of things – producing high-fidelity renders using film animation and visual design techniques. Where the SVS primarily focuses on making data-based visualizations, CI Labs puts more emphasis on conceptual visualizations – producing animations featuring NASA spacecraft, planetary observations, and simulations.
            - paragraph [ref=f6e1504]: Goddard Media Studios, on the other hand, is more focused towards public outreach – producing interviews, TV programs, and documentaries. GMS continues to be the main producers behind NASA TV, and as such, much of their content is aimed towards the general public.
            - paragraph [ref=f6e1505]: "Throughout the late 1990s and early 2000s, the SVS experimented with a wide variety of nascent virtual reality technologies. The work from this time period would later be repurposed and spun off into the NASA Hyperwall project: a multi-screen, high-resolution, wall-sized display. The Hyperwall would later be adopted for NASA public outreach efforts: traveling around the world to various conferences and being used for museum exhibits, scientific presentations, and multimedia shows. The website would begin formally hosting NASA Hyperwall content in 2010."
