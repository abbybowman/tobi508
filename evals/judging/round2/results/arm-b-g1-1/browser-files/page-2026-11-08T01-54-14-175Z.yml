                - paragraph [ref=f6e556]: "The Gravity Recovery and Climate Experiment Follow-On (GRACE-FO) mission is a joint Earth-science project launched in 2018 by NASA and the German Research Centre for Geosciences to continue the work of the earlier GRACE mission. It consists of two satellites flying about 137 mi (220 km) apart in the same orbit around Earth, constantly measuring tiny changes in the distance between them. These variations occur because changes in Earth’s gravity, caused by shifting masses such as melting ice sheets, groundwater depletion, and ocean circulation, slightly alter the satellites’ speeds and separation. By precisely tracking these changes, GRACE FO allows scientists to map how water moves across the planet, improving our understanding of climate change, sea-level rise, and global water resources.This visualization uses data from GRACE FO to create an index based on percentile dryness, categorizing the dregree of wetness or dryness within three domains: groundwater storage, root zone soil moisture, and surface moisture. It updates weekly, and extends back over a period of a year from the current week.This visualization is created for use within the Earth Information Center (EIC). || || 5574 || GRACE FO Soil Moisture Within Continental United States: Monitoring Drought || The Gravity Recovery and Climate Experiment Follow-On (GRACE-FO) mission is a joint Earth-science project launched in 2018 by NASA and the German Research Centre for Geosciences to continue the work of the earlier GRACE mission. It consists of two satellites flying about 137 mi (220 km) apart in the same orbit around Earth, constantly measuring tiny changes in the distance between them. These variations occur because changes in Earth’s gravity, caused by shifting masses such as melting ice sheets, groundwater depletion, and ocean circulation, slightly alter the satellites’ speeds and separation. By precisely tracking these changes, GRACE FO allows scientists to map how water moves across the planet, improving our understanding of climate change, sea-level rise, and global water resources.This visualization uses data from GRACE FO to create an index based on percentile dryness, categorizing the dregree of wetness or dryness within three domains: groundwater storage, root zone soil moisture, and surface moisture. It updates weekly, and extends back over a period of a year from the current week.This visualization is created for use within the Earth Information Center (EIC). || GRACE groundwater storage || gws.01000_print.jpg (1024x576) [333.3 KB] || gws.01000_searchweb.png (320x180) [109.5 KB] || gws.01000_web.png (320x180) [109.5 KB] || gws.01000_thm.png (80x40) [7.5 KB] || gws (3840x2160) [1000 Item(s)] || gws.mp4 (3840x2160) [103.0 MB] || GRACE root zone soil moisture || rtzsm.01000_print.jpg (1024x576) [336.0 KB] || rtzsm.01000_searchweb.png (320x180) [109.8 KB] || rtzsm.01000_web.png (320x180) [109.8 KB] || rtzsm.01000_thm.png (80x40) [7.4 KB] || rtzsm (3840x2160) [1000 Item(s)] || rtzsm.mp4 (3840x2160) [154.1 MB] || GRACE surface soil moisture || sfsm.01000_print.jpg (1024x576) [340.9 KB] || sfsm.01000_searchweb.png (320x180) [110.3 KB] || sfsm.01000_web.png (320x180) [110.3 KB] || sfsm.01000_thm.png (80x40) [7.4 KB] || sfsm (3840x2160) [1000 Item(s)] || sfsm.mp4 (3840x2160) [182.7 MB] || Earth || Agricultural science || Agriculture || Climate Indicators || Drought || Drought Effect || Drought Indices || Earth Science || Hyperwall || Land Surface/agriculture Indicators || Soil Moisture/Water Content || Soil science || Soils || [Gravity Recovery and Climate Experiment (GRACE)] || BMNG (Blue Marble: Next Generation) [Terra and Aqua: MODIS] || GRACE Follow-On (Terrestrial Water Storage Anomaly) [Gravity Recovery and Climate Experiment (GRACE) Follow-On] || Matthew Rodell (NASA/GSFC) as Scientist || Hiroko Kato Beaudoing (University of Maryland) as Scientist ||"
