                - paragraph [ref=f6e1425]: "NASA’s Neil Gehrels Swift Observatory, shown in this artist’s concept, orbits Earth as it studies the ever-changing universe. Credit: NASA’s Goddard Space Flight Center Conceptual Image Lab || SWIFT_S1_v2_4k_60fps_proRes.00005_print.jpg (1024x576) [148.3 KB] || SWIFT_S1_v2_4k_60fps_proRes.00005_searchweb.png (320x180) [64.4 KB] || SWIFT_S1_v2_4k_60fps_proRes.00005_thm.png [4.4 KB] || Swift_S1_v2_4k60.mp4 (3840x2160) [25.6 MB] || SWIFT_S1_v2_4k_60fps_proRes.mov (3840x2160) [4.2 GB] || Swift_S1_v2_4k60.hwshow [423 bytes] || || 14786 || Swift Spacecraft Animations: 2025 || NASA’s Neil Gehrels Swift Observatory, shown in this artist’s concept, orbits Earth as it studies the ever-changing universe. Credit: NASA’s Goddard Space Flight Center Conceptual Image Lab || SWIFT_S1_v2_4k_60fps_proRes.00005_print.jpg (1024x576) [148.3 KB] || SWIFT_S1_v2_4k_60fps_proRes.00005_searchweb.png (320x180) [64.4 KB] || Swift_S1_v2_4k60.mp4 (3840x2160) [25.6 MB] || SWIFT_S1_v2_4k_60fps_proRes.00005_thm.png [4.4 KB] || SWIFT_S1_v2_4k_60fps_proRes.mov (3840x2160) [4.2 GB] || This page contains animations and illustrations of NASA’s Neil Gehrels Swift Observatory spacecraft, which launched in November 2004.Swift can quickly and autonomously point at new events in the sky and was designed to detect, locate, and study gamma-ray bursts, the most powerful explosions in the universe. It hosts three instruments — the Burst Alert Telescope, the Ultraviolet/Optical Telescope, and the X-ray Telescope — which provide astrophysicists with a multiwavelength view of cosmic objects and occurrences.NASA’s Goddard Space Flight Center in Greenbelt, Maryland, manages the Swift mission in collaboration with Pennsylvania State University in University Park, the Los Alamos National Laboratory in New Mexico, and Northrop Grumman Space Systems in Dulles, Virginia. Other partners include the University of Leicester and Mullard Space Science Laboratory in the United Kingdom, Brera Observatory in Italy, and the Italian Space Agency. || The camera pans around the Swift spacecraft in this artist’s concept. Swift then repoints three times before the animation concludes. Also available for download are frames and video with an alpha channel. Credit: NASA’s Goddard Space Flight Center Conceptual Image Lab || SWIFT_S1_v2_0280.jpg (3840x2160) [558.2 KB] || SwiftAlpha (3840x2160) [1366 Item(s)] || SWIFT_S1_v2_4k_60fps_noBG.mp4 (3840x2160) [68.0 MB] || SWIFT_S1_v2_4k_60fps_4444proRes_noBG.mov (3840x2160) [1.8 GB] || The camera pans away from Earth to focus on a sky full of stars in this artist’s concept. Credit: NASA’s Goddard Space Flight Center Conceptual Image Lab || Swift_S1_v2_BGOnly.jpg (3680x2168) [665.6 KB] || SWIFT_S1_v2_4k_60fps_BG.mp4 (3840x2160) [67.4 MB] || SWIFT_S1_v2_4k_60fps_proRes_BG.mov (3840x2160) [2.4 GB] || The Swift spacecraft rotates 360 degrees as if on a turntable in this artist’s concept. The download provides the black background shown here as well as a transparent option. Credit: NASA’s Goddard Space Flight Center Conceptual Image Lab || Swift_360.jpg (3680x2170) [366.1 KB] || SWIFT_360_4k_60fps.mp4 (3840x2160) [71.0 MB] || SWIFT_360_4k_60fps_4444ProRes.mov (3840x2160) [12.2 GB] || The Swift spacecraft points away from the camera in this artist’s concept. A version with a transparent background is also available. Credit: NASA’s Goddard Space Flight Center Conceptual Image LabAlt text: A spacecraft against a black backgroundImage description: The Swift spacecraft points away from the camera against a black background in this illustration. Swift is composed of a long cylinder at the center, wrapped in golden foil. At the front of the cylinder is a triangular silver sunshade. Two solar arrays are attached on either side of the cylinder, extending like wings. || Swift_2_print.jpg (1024x576) [47.0 KB] || Swift_2.png (3840x2160) [8.5 MB] || The Swift spacecraft is angled slightly to the right of the camera in this artist’s concept. A version with a transparent background is also available. Credit: NASA’s Goddard Space Flight Center Conceptual Image LabAlt text: A spacecraft against a white backgroundImage description: The Swift spacecraft is angled slightly right of a head-on view against a white background. Swift is composed of a long cylinder at the center, wrapped in golden foil. The underside of the cylinder is open, exposing some of Swift’s interior components. At the front of the cylinder is a silver sunshade protruding over the openings of two telescopes. Beneath the telescopes is a silver box. Two solar arrays are attached on either side of the cylinder, extending like wings. || Swift_1_print.jpg (1024x576) [42.3 KB] || Swift_1.png (3840x2160) [8.7 MB] || The Swift spacecraft is angled toward the camera, looking upward in this artist’s concept. A version with a transparent background is also available. Credit: NASA’s Goddard Space Flight Center Conceptual Image LabAlt text: A spacecraft against a white backgroundImage description: The Swift spacecraft is oriented head-on to the camera, pointing upward against a white background. Swift is composed of a long cylinder at the center. The underside of the cylinder is open, exposing some of Swift’s interior components. At the front of the cylinder is a silver sunshade protruding over the openings of two telescopes. Beneath the telescopes is a silver box. Two solar arrays are attached on either side of the cylinder, extending like wings. || Swift_4_print.jpg (1024x576) [39.6 KB] || Swift_4.png (3840x2160) [8.7 MB] || The Swift spacecraft is angled nearly 90 degrees from the camera, looking toward upper left, in this artist’s concept. A version with a transparent background is also available. Credit: NASA’s Goddard Space Flight Center Conceptual Image LabAlt text: A spacecraft against a white backgroundImage description: The Swift spacecraft points nearly 90 degrees from the camera, looking toward upper left, against a white background. Swift is composed of a long cylinder at the center. At the front of the cylinder is a silver sunshade protruding two telescopes. Beneath the telescopes is a silver box. A solar array is attached on the side of the cylinder facing the camera. || Swift_3_print.jpg (1024x576) [35.1 KB] || Swift_3.png (3840x2160) [7.2 MB] || Universe || Animation || Ast || Astrophysics || Spacecraft || Swift || Swift || Astrophysics Animations || Adriana Manrique Gutierrez (eMITS) as Animator || Jonathan North (eMITS) as Animator || Michael Lentz (eMITS) as Artistic director || Scott Wiessinger (eMITS) as Producer || Sophia Roberts (eMITS) as Producer || Francis Reddy (University of Maryland College Park) as Producer || Jeanette Kazmierczak (University of Maryland College Park) as Science writer || Brad Cenko (NASA/GSFC) as Scientist || Regina Caputo (NASA/GSFC) as Scientist ||"
