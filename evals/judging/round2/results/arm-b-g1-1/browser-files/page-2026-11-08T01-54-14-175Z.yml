                - paragraph [ref=f6e714]:
                  - text: "The Escape and Plasma Acceleration and Dynamics Explorers, or ESCAPADE, mission will use two identical spacecraft to investigate how the solar wind interacts with Mars’ magnetic environment and how this interaction drives the planet’s atmospheric escape. || 14915 || ESCAPADE Trajectory Animations || The Escape and Plasma Acceleration and Dynamics Explorers, or ESCAPADE, mission will use two identical spacecraft to investigate how the solar wind interacts with Mars’ magnetic environment and how this interaction drives the planet’s atmospheric escape. The first multi-spacecraft orbital science mission to the Red Planet, ESCAPADE’s twin orbiters will take simultaneous observations from different locations around Mars to reveal the planet’s real-time response to space weather and how the Martian magnetosphere changes over time.The ESCAPADE mission is being carried into orbit on the second launch of Blue Origin’s New Glenn rocket (NG-2) and is scheduled to launch in November 2025 from Cape Canaveral, Florida. New Glenn is a single-configuration, heavy-lift orbital launch vehicle capable of routinely carrying both spacecraft and people to low Earth orbits, geostationary transfer orbits, cislunar orbits (between Earth and the Moon), and beyond via Earth-departure orbits like the one required for ESCAPADE. The vehicle is named after John Glenn, the first American astronaut to orbit Earth.The ESCAPADE mission is managed by the Space Sciences Laboratory at the University of California, Berkeley, with key partners Rocket Lab, NASA's Goddard Space Flight Center, Embry-Riddle Aeronautical University, Advanced Space LLC, and Blue Origin.Below are animations demonstrating the different phases of the mission's trajectory from traveling from Earth to Mars to implementing its science orbits around the Red Planet. || ESCAPADE - Traveling from Earth to Mars (View 1)ESCAPADE's twin spacecraft will launch from Cape Canaveral, Florida, and head toward Mars when Earth and the Red Planet are aligned.The dark blue line is Earth's orbit, the red line is Mars' orbit, and the light blue line is ESCAPADE's trajectory.Credit: Matt Bolliger/Advanced Space || 14915_DeepSpaceTransferView1_4K_H264.00360_print.jpg (1024x576) [155.1 KB] || 14915_DeepSpaceTransferView1_4K_H264.00360_web.png (320x180) [73.7 KB] || 14915_DeepSpaceTransferView1_4K_H264.00360_thm.png (80x40) [4.1 KB] || 14915_DeepSpaceTransferView1_4K_H264.mp4 (3840x2160) [55.2 MB] || 14915_DeepSpaceTransferView1_4K_ProRes422.mov (3840x2160) [1.5 GB] || ESCAPADE - Traveling from Earth to Mars (View 2)ESCAPADE's twin spacecraft launches from Cape Canaveral, Florida, and heads towards Mars when Earth and the Red Planet are aligned.The dark blue line is Earth's orbit, the red line is Mars' orbit, and the light blue line is ESCAPADE's trajectory.Credit: Matt Bolliger/Advanced Space || 14915_DeepSpaceTransferView2_4K_H264.00360_print.jpg (1024x576) [143.4 KB] || 14915_DeepSpaceTransferView2_4K_H264.00360_web.png (320x180) [68.7 KB] || 14915_DeepSpaceTransferView2_4K_H264.00360_thm.png (80x40) [3.8 KB] || 14915_DeepSpaceTransferView2_4K_H264.mp4 (3840x2160) [56.6 MB] || 14915_DeepSpaceTransferView2_4K_H264.webm (3840x2160) [7.7 MB] || 14915_DeepSpaceTransferView2_4K_ProRes422.mov (3840x2160) [1.6 GB] || ESCAPADE - Loiter OrbitTo save fuel, previous Mars missions have had to launch when Earth and Mars are aligned in their orbits. However, ESCAPADE is pioneering a new strategy that allows Mars-bound spacecraft to launch almost anytime. Instead of launching directly to Mars, the ESCAPADE spacecraft will loop around the Earth-Sun Lagrange point 2 (L2), in an “Earth-proximity” or “loiter” orbit that allows the spacecraft to wait until November 2026, when the planets are aligned, to head to Mars. Credit: Matt Bolliger/Advanced Space || 14915_ESCAPADE_Loiter_Thumb.jpg (3840x2160) [1.2 MB] || 14915_ESCAPADE_Loiter_Thumb_print.jpg (1024x576) [236.4 KB] || 14915_ESCAPADE_Loiter_Thumb_web.png (320x180) [29.7 KB] || 14915_ESCAPADE_Loiter_Thumb_thm.png (80x40) [5.1 KB] || 14915_ESCAPADE_Loiter_4K_ProRes_LABELS.webm (3840x2160) [9.6 MB] || 14915_ESCAPADE_Loiter_4K_YouTube_LABELS.mp4 (3840x2160) [96.1 MB] || 14915_ESCAPADE_Loiter_4K_YouTube.mp4 (3840x2160) [96.1 MB] || 14915_ESCAPADE_Loiter_OrbitOnly.mov (3840x2160) [2.4 GB] || 14915_ESCAPADE_Loiter_4K_ProRes_LABELS.mov (3840x2160) [2.6 GB] || 14915_ESCAPADE_Loiter_4K_ProRes.mov (3840x2160) [2.6 GB] || 14915_ESCAPADE_Loiter_BackgroundOnly.mov (3840x2160) [8.1 GB] || ESCAPADE - Loiter Orbit With DatesTo save fuel, previous Mars missions have had to launch when Earth and Mars are aligned in their orbits. However, ESCAPADE is pioneering a new strategy that allows Mars-bound spacecraft to launch almost anytime. Instead of launching directly to Mars, the ESCAPADE spacecraft will loop around the Earth-Sun Lagrange point 2 (L2), in an “Earth-proximity” or “loiter” orbit that allows the spacecraft to wait until November 2026, when the planets are aligned, to head to Mars. Credit: Matt Bolliger/Advanced Space || 14915_ESCAPADE_Loiter_4K_Dates_H264.00001_print.jpg (1024x576) [47.5 KB] || 14915_ESCAPADE_Loiter_4K_Dates_H264.00001_web.png (320x180) [24.4 KB] || 14915_ESCAPADE_Loiter_4K_Dates_H264.00001_thm.png (80x40) [1.2 KB] || 14915_ESCAPADE_Loiter_4K_Dates_H264.webm (3840x2160) [9.6 MB] || 14915_ESCAPADE_Loiter_4K_Dates_H264.mp4 (3840x2160) [100.6 MB] || 14915_ESCAPADE_Loiter_4K_Dates_ProRes.mov (3840x2160) [4.1 GB] ||"
                  - strong [ref=f6e715]: ESCAPADE - Trans-Mars Injection
                  - text: "In November 2026, each of ESCAPADE's twin spacecraft will execute a powered flyby of Earth, combining Earth’s gravity with an engine burn, to slingshot itself toward Mars. In this animation, each spacecraft’s approximately 9-minute trans-Mars injection burn appears as an orange arc along the spacecraft’s trajectory.Credit: Matt Bolliger/Advanced Space || 14915_ESCAPADE_TMI_4K_H264_ProRes.mov (3840x2160) [939.2 MB] || 14915_ESCAPADE_TMI_4K_H264_YouTube.mp4 (3840x2160) [60.0 MB] || ESCAPADE - Deep Space with Planets (View 1)As ESCAPADE’s twin spacecraft travel from Earth to Mars, there are four trajectory correction maneuvers (TCMs) at the beginning of their journey. There are more TCMs during the cruise and as they approach Mars. These TCMs clean up errors and correct for deviations in the spacecraft’s trajectories to ensure an accurate insertion into the Martian orbit.Credit: Matt Bolliger/Advanced Space || 14915_ESCAPADE_DeepspaceView1_4K_ProRes.00001_print.jpg (1024x576) [146.2 KB] || 14915_ESCAPADE_DeepspaceView1_4K_ProRes.00001_thm.png (80x40) [3.6 KB] || 14915_ESCAPADE_DeepspaceView1_4K_YouTube.mp4 (3840x2160) [58.1 MB] || 14915_ESCAPADE_DeepspaceView1_4K_ProRes.webm [0 bytes] || 14915_ESCAPADE_DeepspaceView1_4K_ProRes.mov (3840x2160) [6.4 GB] || ESCAPADE - Deep Space with Planets (View 2)As ESCAPADE’s twin spacecraft travel from Earth to Mars, there are four trajectory correction maneuvers (TCMs) at the beginning of their journey. There are more TCMs during the cruise and as they approach Mars. These TCMs clean up errors and correct for deviations in the spacecraft’s trajectories to ensure an accurate insertion into the Martian orbit.Credit: Matt Bolliger/Advanced Space || 14915_ESCAPADE_DeepspaceView2_4K_ProRes.00001_print.jpg (1024x576) [104.6 KB] || 14915_ESCAPADE_DeepspaceView2_4K_ProRes.00001_web.png (320x180) [54.6 KB] || 14915_ESCAPADE_DeepspaceView2_4K_ProRes.00001_thm.png (80x40) [2.0 KB] || 14915_ESCAPADE_DeepspaceView2_4K_YouTube.mp4 (3840x2160) [57.7 MB] || 14915_ESCAPADE_DeepspaceView2_4K_ProRes.webm (3840x2160) [7.8 MB] || 14915_ESCAPADE_DeepspaceView2_4K_ProRes.mov (3840x2160) [4.7 GB] || ESCAPADE - Mars Orbit InsertionThe ESCAPADE’s twin spacecraft arrive at Mars separately, two days apart. Once each spacecraft reaches periapsis – the closest part of the orbit to Mars – its thrusters will fire to slow it down. As the Mars Orbit Insertion (MOI) burns are carried out, the spacecraft slow down and their orbits change, slowly wrapping around Mars until the spacecraft are captured into Mars orbit.Credit: Matt Bolliger/Advanced Space || 14915_ESCAPADE_MarsOrbitInsertion_4K_ProRes.00001_print.jpg (1024x576) [95.3 KB] || 14915_ESCAPADE_MarsOrbitInsertion_4K_ProRes.00001_thm.png (80x40) [2.5 KB] || 14915_ESCAPADE_MarsOrbitInsertion_4K_YouTube.mp4 (3840x2160) [32.0 MB] || 14915_ESCAPADE_MarsOrbitInsertion_4K_ProRes.webm [0 bytes] || 14915_ESCAPADE_MarsOrbitInsertion_4K_ProRes.mov (3840x2160) [4.6 GB] || ESCAPADE - Science Orbit AAfter ESCAPADE reaches Mars, the two spacecraft will arrange themselves in their first science formation, in which the twin spacecraft will follow each other in the same orbit, passing through the same areas at different times to uncover when and where changes are happening at Mars. This science campaign will last for six months.Credit: Matt Bolliger/Advanced Space || 14915_ESCAPADE_ScienceOrbitA_Thumb.jpg (3840x2160) [927.1 KB] || 14915_ESCAPADE_ScienceOrbitA_Thumb_print.jpg (1024x576) [184.1 KB] || 14915_ESCAPADE_ScienceOrbitA_BackgroundOnly.png (3840x2160) [5.9 MB] || 14915_ESCAPADE_ScienceOrbitA_Thumb_web.png (320x180) [22.5 KB] || 14915_ESCAPADE_ScienceOrbitA_Thumb_thm.png (80x40) [4.6 KB] || 14915_ESCAPADE_ScienceA_4K_ProRes.webm (3840x2160) [6.1 MB] || 14915_ESCAPADE_ScienceA_4K_YouTube.mp4 (3840x2160) [104.9 MB] || 14915_ESCAPADE_ScienceA_4K_ProRes.mov (3840x2160) [3.4 GB] || 14915_ESCAPADE_ScienceOrbitA_OrbitOnly.mov (3840x2160) [4.0 GB] || ESCAPADE - Science Orbit BIn ESCAPADE's second science formation, the two spacecraft will have different orbits, with one traveling farther from Mars and the other staying closer to it. Planned to last for five months, this second formation aims to study the solar wind and Martian magnetosphere simultaneously, allowing scientists to investigate how Mars responds to the solar wind in real time.Credit: Matt Bolliger/Advanced Space || 14915_ESCAPADE_ScienceOrbitB_Thumb.jpg (3840x2160) [1.1 MB] || 14915_ESCAPADE_ScienceOrbitB_Thumb_print.jpg (1024x576) [212.7 KB] || 14915_ESCAPADE_ScienceOrbitB_BackgroundOnly.png (3840x2160) [6.1 MB] || 14915_ESCAPADE_ScienceOrbitB_Thumb_web.png (320x180) [28.5 KB] || 14915_ESCAPADE_ScienceOrbitB_Thumb_thm.png (80x40) [5.4 KB] || 14915_ESCAPADE_ScienceB_4K_ProRes.webm (3840x2160) [7.2 MB] || 14915_ESCAPADE_ScienceB_4K_YouTube.mp4 (3840x2160) [105.8 MB] || 14915_ESCAPADE_ScienceB_4K_ProRes.mov (3840x2160) [3.5 GB] || 14915_ESCAPADE_ScienceOrbitB_OrbitOnly.mov (3840x2160) [4.2 GB] || Planets & Moons || Sun || ESCAPADE || Magnetic Fields || Magnetosphere || Mars || Mars Arrival || Mars Orbit Insertion || Mars Upper Atmosphere || Martian Atmosphere || Lacey Young (eMITS) as Producer || Joy Ng (eMITS) as Producer || Vanessa Thomas (eMITS) as Writer ||"
