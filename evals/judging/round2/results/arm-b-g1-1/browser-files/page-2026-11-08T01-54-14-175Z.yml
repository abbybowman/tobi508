                - paragraph [ref=f6e1064]:
                  - text: The animation archived on this page shows the geocentric phase, libration, position angle of the axis, and apparent diameter of the Moon throughout the year 2026, at hourly intervals. || 5587 || Moon Phase and Libration, 2026 || The data in the table for all of 2026 can be downloaded
                  - link "as a JSON file" [ref=f6e1065] [cursor=pointer]:
                    - /url: /vis/a000000/a005500/a005587/mooninfo_2026.json
                  - text: or
                  - link "as a text file" [ref=f6e1066] [cursor=pointer]:
                    - /url: /vis/a000000/a005500/a005587/mooninfo_2026.json
                  - text: . || Click on the image to download a high-resolution version with feature labels and additional graphics. Hover over the image to reveal the animation frame number, which can be used to locate and download the corresponding frame from any of the animations on this page, including
                  - link "unlabeled high-resolution Moon images" [ref=f6e1067] [cursor=pointer]:
                    - /url: "#media_group_379015"
                  - text: .The animation archived on this page shows the geocentric phase, libration, position angle of the axis, and apparent diameter of the Moon throughout the year 2026, at hourly intervals. Until the end of 2026, the initial Dial-A-Moon image will be the frame from this animation for the current hour.>
                  - strong [ref=f6e1068]: "More in this series:"
                  - text: ">"
                  - link "Moon Phase and Libration Gallery" [ref=f6e1069] [cursor=pointer]:
                    - /url: https://svs.gsfc.nasa.gov/Gallery/moonphase.html
                  - text: Lunar Reconnaissance Orbiter (
                  - link "LRO" [ref=f6e1070] [cursor=pointer]:
                    - /url: https://science.nasa.gov/mission/lro/
                  - text: ) has been in orbit around the Moon since the summer of 2009. Its laser altimeter (
                  - link "LOLA" [ref=f6e1071] [cursor=pointer]:
                    - /url: https://science.nasa.gov/mission/lro/lola
                  - text: ) and camera (
                  - link "LROC" [ref=f6e1072] [cursor=pointer]:
                    - /url: https://lroc.im-ldi.com
                  - text: ) are recording the rugged, airless lunar terrain in exceptional detail, making it possible to visualize the Moon with unprecedented fidelity. This is especially evident in the long shadows cast near the terminator, or day-night line. The pummeled, craggy landscape thrown into high relief at the terminator would be impossible to recreate in the computer without
                  - link "global terrain maps" [ref=f6e1073] [cursor=pointer]:
                    - /url: https://svs.gsfc.nasa.gov/4720
                  - text: like those from LRO.The Moon always keeps the same face to us, but not
                  - emphasis [ref=f6e1074]: exactly
                  - text: the same face. Because of the tilt and shape of its orbit, we see the Moon from slightly different angles over the course of a month. When a month is compressed into 24 seconds, as it is in this animation, our changing view of the Moon makes it look like it's wobbling. This wobble is called
                  - link "libration" [ref=f6e1075] [cursor=pointer]:
                    - /url: https://svs.gsfc.nasa.gov/5195
                  - text: .The word comes from the Latin for "balance scale" (as does the name of the zodiac constellation Libra) and refers to the way such a scale tips up and down on alternating sides. The
                  - strong [ref=f6e1076]: sub-Earth
                  - text: point gives the amount of libration in longitude and latitude. The sub-Earth point is also the apparent center of the Moon's disk and the location on the Moon where the Earth is directly overhead.The Moon is subject to other motions as well. It appears to roll back and forth around the sub-Earth point. The roll angle is given by the
                  - strong [ref=f6e1077]: position angle
                  - text: of the axis, which is the angle of the Moon's north pole relative to celestial north. The Moon also approaches and recedes from us, appearing to grow and shrink. The two extremes, called perigee (near) and apogee (far), differ by as much as 14%.The most noticed monthly variation in the Moon's appearance is the cycle of
                  - strong [ref=f6e1078]: phases
                  - text: ", caused by the changing angle of the Sun as the Moon orbits the Earth. The cycle begins with the waxing (growing) crescent Moon visible in the west just after sunset. By first quarter, the Moon is high in the sky at sunset and sets around midnight. The full Moon rises at sunset and is high in the sky at midnight. The third quarter Moon is often surprisingly conspicuous in the daylit western sky long after sunrise.Celestial north is up in these images, corresponding to the view from the northern hemisphere. The descriptions of the print resolution stills also assume a northern hemisphere orientation. (There is also a"
                  - link "south-up version of this page" [ref=f6e1079] [cursor=pointer]:
                    - /url: /5588
                  - text: ".) || The phase and libration of the Moon for 2026, at hourly intervals. Includes supplemental graphics that display the Moon's orbit, subsolar and sub-Earth points, and the Moon's distance from Earth at true scale. Craters near the terminator are labeled, as are Apollo landing sites, maria, and other albedo features in sunlight. || phases_2026_fancy_1080p30.mp4 (1920x1080) [143.6 MB] || phases_2026_fancy_2160p30.mp4 (3840x2160) [433.2 MB] || phases_2026_fancy_2160p30.mov (3840x2160) [13.9 GB] || phases_2026_fancy_720p30.mp4 (1280x720) [72.1 MB] || phases_2026_fancy_360p30.mp4 (640x360) [24.3 MB] || fancy (1920x1080) [8760 Item(s)] || fancy (3840x2160) [8760 Item(s)] || fancy (5760x3240) [8760 Item(s)] || preview_fancy.jpg (1920x1080) [252.7 KB] || The phase and libration of the Moon for 2026, at hourly intervals. Includes music, supplemental graphics that display the Moon's orbit, subsolar and sub-Earth points, and the Moon's distance from Earth at true scale. Craters near the terminator are labeled, as are Apollo landing sites, maria and other albedo features in sunlight.Music provided by Universal Production Music: \"Places\" and \"Reverse Dream\" – Matthew LawrensonThis video can also be viewed on the"
                  - link "NASA Goddard YouTube channel" [ref=f6e1080] [cursor=pointer]:
                    - /url: https://youtu.be/J40sjWID3e8
                  - text: "|| phasesYT_2026_fancy_1080p30.mp4 (1920x1080) [144.1 MB] || phasesYT_2026_fancy_2160p30.mp4 (3840x2160) [486.7 MB] || preview_music.jpg (1920x1080) [253.9 KB] || phases_2026_captions.en_US.srt [40 bytes] || phases_2026_captions.en_US.vtt [53 bytes] || The phase and libration of the Moon for 2026, at hourly intervals. The vertical (portrait) aspect ratio is targeted for viewing on mobile devices. Includes supplemental graphics that display the Moon's orbit, subsolar and sub-Earth points, and the Moon's distance from Earth at true scale. Craters near the terminator are labeled, as are Apollo landing sites. || phases_2026_fancy_v1_1920p30.mp4 (1080x1920) [139.6 MB] || preview_v.jpg (1080x1920) [256.3 KB] || v1 (1080x1920) [8760 Item(s)] || The phase and libration of the Moon for 2026, at hourly intervals. This is an alternate portrait aspect version that may be more suitable for some social media posts. || phases_2026_fancy_v2_1920p30.mp4 (1080x1920) [106.2 MB] || preview_v2.jpg (1080x1920) [194.4 KB] || v2 (1080x1920) [8760 Item(s)] || phases_2026_fancy_v2_music_1920p30.mp4 (1080x1920) [98.4 MB] || The phase and libration of the Moon for 2026, at hourly intervals. This portrait aspect version is \"plain,\" showing only the Moon. || phases_2026_plain_v_1920p30.mp4 (1080x1920) [79.6 MB] || preview_vplain.jpg (1080x1920) [149.8 KB] || vplain (1080x1920) [8760 Item(s)] || The phase and libration of the Moon for 2026, at hourly intervals. The HD and higher resolution frames include an alpha channel, and the EXR frames are HDR (high dynamic range). The .mov file is a ProRes 4444 movie with alpha. || phases_2026_plain_1080p30.mp4 (1920x1080) [92.2 MB] || phases_2026_plain_2160p30.mp4 (3840x2160) [300.5 MB] || phases_2026_plain_2160p30.mov (3840x2160) [28.0 GB] || phases_2026_plain_720p30.mp4 (1280x720) [41.8 MB] || phases_2026_plain_360p30.mp4 (640x360) [11.4 MB] || plain (5760x3240) [8760 Item(s)] || plain (1920x1080) [8760 Item(s)] || plain (3840x2160) [8760 Item(s)] || exr (5760x3240) [8760 Item(s)] || 730x730_1x1_30p (730x730) [8760 Item(s)] || 216x216_1x1_30p (216x216) [8760 Item(s)] || preview_plain.jpg (1920x1080) [174.8 KB] || The Moon's Orbit || The orbit of the Moon in 2026, viewed from the north pole of the ecliptic, with the vernal equinox to the right. The sizes of the Earth and Moon are exaggerated. || moon_orbit_2026_1080p30.mp4 (1080x1080) [43.6 MB] || preview_orbit.jpg (1080x1080) [113.6 KB] || 1080x1080_1x1_30p (1080x1080) [8760 Item(s)] || 850x850_1x1_30p (850x850) [8760 Item(s)] || 420x420_1x1_30p (420x420) [8760 Item(s)] || From this birdseye view, it's somewhat easier to see that the phases of the Moon are an effect of the changing angles of the Sun, Moon and Earth. The Moon is full when its orbit places it in the middle of the night side of the Earth. First and Third Quarter Moon occur when the Moon is along the day-night line on the Earth. The Sun's direction is indicated by the yellow arrow.The view here is perpendicular to the plane of the Earth's orbit around the Sun, called the"
                  - strong [ref=f6e1081]: ecliptic
                  - text: ". The teal-colored ring is the plane of the Moon's orbit around the Earth, which is tilted about five degrees to the ecliptic. The thickness of the ring shows the range of the Moon's distance, and the darker half is the part below (south of) the ecliptic. The two points where the orbit crosses the ecliptic are the ascending and descending nodes. Also labeled are the perigee and apogee, the points along the orbit that are nearest to and farthest from Earth.The First Point of Aries is at the 3 o'clock position in the image. The Sun is in this direction at the March equinox. You can check this by freezing the animation at around the 1:03 mark, or by freezing the full animation with the time stamp near March 20. This direction serves as the zero point for both ecliptic longitude and right ascension.The north pole of the Earth is tilted 23.5 degrees toward the 12 o'clock position at the top of the image. The tilt of the Earth is important for understanding why the north pole of the Moon seems to swing back and forth. In the full animation, watch both the orbit and the \"gyroscope\" Moon in the lower left. The widest swings happen when the Moon is at the 3 o'clock and 9 o'clock positions. When the Moon is at the 3 o'clock position, the ground we're standing on is tilted to the left when we look at the Moon. At the 9 o'clock position, it's tilted to the right. The tilt itself doesn't change. We're just turned around, looking in the opposite direction. || An animated diagram of the subsolar and sub-Earth points for 2026. The Moon's north pole, equator, and meridian are indicated. The frames include an alpha channel. || moon_subpts_2026_960p30.mp4 (960x960) [32.2 MB] || preview_globe.jpg (960x960) [84.8 KB] || 320x320_1x1_30p (320x320) [8760 Item(s)] || 640x640_1x1_30p (640x640) [8760 Item(s)] || 960x960_1x1_30p (960x960) [8760 Item(s)] || The subsolar and sub-Earth points are the locations on the Moon's surface where the Sun or the Earth are directly overhead, at the zenith. A line pointing straight up at one of these points will be pointing toward the Sun or the Earth. The sub-Earth point is also the apparent center of the Moon's disk as observed from the Earth.In the animation, the blue dot is the sub-Earth point, and the yellow cone is the subsolar point. The lunar latitude and longitude of the sub-Earth point is a measure of the Moon's libration. For example, when the blue dot moves to the left of the meridian (the line at 0 degrees longitude), an extra bit of the Moon's western limb is rotating into view, and when it moves above the equator, a bit of the far side beyond the north pole becomes visible.At any given time, half of the Moon is in sunlight, and the subsolar point is in the center of the lit half. Full Moon occurs when the subsolar point is near the center of the Moon's disk. When the subsolar point is somewhere on the far side of the Moon, observers on Earth see a crescent phase. || An animated diagram of the Moon's distance from the Earth for 2026. The sizes and distances are true to scale, and the lighting and Earth tilt are correct. The frames include an alpha channel. || moon_distance_2026_1080p30.mp4 (1920x1080) [2.2 MB] || moon_distance_2026_2160p30.mp4 (3840x2160) [6.2 MB] || moon_distance_2026_360p30.mp4 (640x360) [649.3 KB] || moon_distance_2026_720p30.mp4 (1280x720) [1.3 MB] || preview_distance.jpg (1920x1080) [33.4 KB] || distance (1920x1080) [8760 Item(s)] || distance (3840x2160) [8760 Item(s)] || distance (5760x3240) [8760 Item(s)] || The Moon's orbit around the Earth isn't a perfect circle. The orbit is slightly elliptical, and because of that, the Moon's distance from the Earth varies between 28 and 32 Earth diameters, or about 356,400 and 406,700 kilometers. In each orbit, the smallest distance is called perigee, from Greek words meaning \"near earth,\" while the greatest distance is called apogee. The Moon looks largest at perigee because that's when it's closest to us.The animation follows the imaginary line connecting the Earth and the Moon as it sweeps around the Moon's orbit. From this vantage point, it's easy to see the variation in the Moon's distance. Both the distance and the sizes of the Earth and Moon are to scale in this view. In the HD-resolution frames, the Earth is 50 pixels wide, the Moon is 14 pixels wide, and the distance between them is about 1500 pixels, on average.Note too that the Earth appears to go through phases just like the Moon does. For someone standing on the surface of the Moon, the Sun and the stars rise and set, but the Earth doesn't move very much in the sky. It goes through a monthly sequence of phases as the Sun angle changes. The phases are the opposite of the Moon's. During New Moon here, the Earth is full as viewed from the Moon. || Feature labels. Crater labels appear when the center of the crater is within 20 degrees of the terminator (the day-night line). They are on the western edge of the crater during waxing phases (before Full Moon) and to the east during waning phases. Mare, sinus, and lacus features are labeled when in sunlight. Apollo landing site labels are always visible. The frames include an alpha channel. || moon_labels_2026_1080p30.mp4 (1920x1080) [24.2 MB] || moon_labels_2026_2160p30.mp4 (3840x2160) [93.2 MB] || preview_labels.jpg (1920x1080) [43.7 KB] || labels (1920x1080) [8760 Item(s)] || labels (3840x2160) [8760 Item(s)] || labels (5760x3240) [8760 Item(s)] || The Named Phases || The following is a gallery containing examples of each of the Moon phases that have names in English. New, full, and quarter phases occur on specific days, while crescent and gibbous phases are the transitions between these points and span multiple days. The quarters are so named because they occur when the Moon is one fourth or three fourths of the way through its cycle of phases. Many people find this confusing, though, since visually they are half moons. It might be helpful to remember that the visible half of the Moon's disk is really only one quarter of its spherical surface. || Waxing crescent. Visible toward the southwest in early evening. || phase_waxing_crescent.2028_print.jpg (1024x1024) [134.5 KB] || phase_waxing_crescent.2028.tif (3240x3240) [10.7 MB] || First quarter. Visible high in the southern sky in early evening. || phase_first_quarter.2091_print.jpg (1024x1024) [157.2 KB] || phase_first_quarter.2091.tif (3240x3240) [10.3 MB] || Waxing gibbous. Visible to the southeast in early evening, up for most of the night. || phase_waxing_gibbous.2158_print.jpg (1024x1024) [163.6 KB] || phase_waxing_gibbous.2158.tif (3240x3240) [9.3 MB] || Full Moon. Rises at sunset, high in the sky around midnight. Visible all night. || phase_full.1571_print.jpg (1024x1024) [184.7 KB] || phase_full.1571.tif (3240x3240) [9.4 MB] || Waning gibbous. Rises after sunset, high in the sky after midnight, visible to the southwest after sunrise. || phase_waning_gibbous.2403_print.jpg (1024x1024) [192.9 KB] || phase_waning_gibbous.2403.tif (3240x3240) [11.0 MB] || Third quarter. Rises around midnight, visible to the south after sunrise. || phase_third_quarter.1755_print.jpg (1024x1024) [162.4 KB] || phase_third_quarter.1755.tif (3240x3240) [11.2 MB] || Waning crescent. Low to the east before sunrise. || phase_waning_crescent.1810_print.jpg (1024x1024) [131.1 KB] || phase_waning_crescent.1810.tif (3240x3240) [11.5 MB] || New Moon. By the modern definition, New Moon occurs when the Moon and Sun are at the same geocentric ecliptic longitude. The part of the Moon facing us is completely in shadow then. Pictured here is the traditional New Moon, the earliest visible waxing crescent, which signals the start of a new month in many lunar and lunisolar calendars. || phase_new.1933_print.jpg (1024x1024) [91.8 KB] || phase_new.1933.tif (3240x3240) [10.3 MB] || Planets & Moons || Albedo || Elevation data || Laser Altimeter || LOLA || LRO || LROC || Lunar || Lunar Reconnaissance Orbiter || Lunar Surface || Lunar Topography || Moon || LRO (Lunar Reconnaissance Orbiter) || LRO - Animations || The Moon || DEM (Digital Elevation Map) [LRO: LOLA] || LROC WAC Color Mosaic (Natural Color Hapke Normalized WAC Mosaic) [Lunar Reconnaissance Orbiter: LRO Camera] || DE421 (JPL DE421) || Ernie Wright (USRA) as Visualizer || Noah Petro (NASA/GSFC) as Planetary scientist || James Tralie (eMITS) as Producer ||"
