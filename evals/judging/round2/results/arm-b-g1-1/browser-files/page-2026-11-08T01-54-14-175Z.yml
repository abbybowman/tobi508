                - paragraph [ref=f6e1380]:
                  - text: "This is the 'beauty shot version' of Perpetual Ocean 2: Western Boundary Currents. The visualization starts with a rotating globe showing ocean currents. The camera then zooms into the Kuroshio current, moves over the Indian Ocean to the Agulhas Current, then over to the Gulf Stream. The flows from the surface down to 600 meters deep are all white. Flows below 600 meters depth use the blue-cyan-white color table below. || 5425 || Perpetual Ocean 2: Western Boundary Currents || This is the 'beauty shot version' of Perpetual Ocean 2: Western Boundary Currents. The visualization starts with a rotating globe showing ocean currents. The camera then zooms into the Kuroshio current, moves over the Indian Ocean to the Agulhas Current, then over to the Gulf Stream.The colors used to color the flow in this version where chosen to provide a pleasing look. The flows from the surface down to 600 meters deep are all white. Flows below 600 meters depth use the blue-cyan-white color table below. || perpetual_ocean2_CLOSE_093_clean_noDate_1080p30.mp4 (1920x1080) [1.2 GB] || perpetual_ocean2_CLOSE_093_clean_noDate_2160p60.mp4 (3840x2160) [5.0 GB] || beauty_all_depths (3840x2160) [19002 Item(s)] || perpetual_ocean2_CLOSE_093_clean_noDate_1080p_carousel.jpg (1920x1080) [638.0 KB] || perpetual_ocean2_CLOSE_093_4k_clean_noDate.00000_print.jpg (1024x576) [215.0 KB] || perpetual_ocean2_CLOSE_093_4k_clean_noDate.00000_thm.png (80x40) [4.5 KB] || 9600x3240_16x9_30p (9600x3240) [9501 Item(s)] || perpetual_ocean2_beauty_hw5x3_810p30_5.mp4 (2400x810) [990.4 MB] || The narrated version of this visualization was accepted into ACM/SIGGRAPH's 2025 Electronic Theater."
                  - link "https://svs.gsfc.nasa.gov/14745/" [ref=f6e1381] [cursor=pointer]:
