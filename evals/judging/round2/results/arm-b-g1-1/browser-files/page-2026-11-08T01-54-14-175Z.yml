                - generic [ref=f6e382]: October 15, 2026
                - paragraph [ref=f6e385]: "These visualizations compare ocean conditions in the tropical Pacific during the same months in 2025 and 2026, using sea surface temperature, ocean color, and sea surface height data. Together, they highlight changes in the ocean that may signal the development of El Niño conditions. || 5683 || Signs of El Niño in 2026 || This visualization compares three ocean data products, sea surface temperature anomaly (SSTA), apparent visible wavelength (AVW), and sea surface height anomaly (SSHA), over the same months in 2025 and 2026. Signals of El Niño in each data product are highlighted with pop-up labels. || elnino_2026_ssta_avw_ssha_1010_1080p60.mp4 (1920x1080) [35.5 MB] || elnino_2026_ssta_avw_ssha_1010_2160p60.mp4 (3840x2160) [102.8 MB] || elnino_2026_ssta_avw_ssha_1010.02200_preview.jpg (1920x1080) [816.6 KB] || elnino_2026_ssta_avw_ssha_1010.02200.jpg (3840x2160) [2.7 MB] || NASA's Earth-observing satellites are monitoring changes in the tropical Pacific Ocean that could signal the development of a strong El Niño event in 2026.These visualizations compare ocean conditions during the same months in 2025 and 2026 using data from missions including Sentinel-6 and PACE. Three ocean data products are shown: sea surface temperature anomaly, apparent visible wavelength (ocean color), and sea surface height anomaly. Together, these datasets show unusually warm surface waters in the central and eastern tropical Pacific, higher-than-usual sea surface heights, and changes in ocean color associated with reduced phytoplankton. These changes can all be signals of developing El Niño conditions. || This visualization compares sea surface temperature anomalies (SSTA) over the same months in 2025 and 2026. Red and orange indicate areas where ocean surface temperatures are warmer than usual, while blue indicates areas where they are cooler than usual. Warmer ocean surface temperatures in the central and eastern tropical Pacific can be a signal of developing El Niño conditions. || elnino_2026_ssta_cb_1010_1080p60.mp4 (1920x1080) [41.6 MB] || elnino_2026_ssta_cb_1010_2160p60.mp4 (3840x2160) [112.1 MB] || elnino_2026_ssta_cb_1010.02200_preview.jpg (1920x1080) [732.0 KB] || elnino_2026_ssta_cb_1010.02200.jpg (3840x2160) [2.3 MB] || This visualization compares apparent visible wavelength (AVW) over the same months in 2025 and 2026. Bluer ocean colors generally indicate areas with less phytoplankton, while greener and yellower colors suggest higher concentrations. Reduced phytoplankton in the tropical Pacific can be associated with developing El Niño conditions. || elnino_2026_avw_cb_1010_1080p60.mp4 (1920x1080) [16.9 MB] || elnino_2026_avw_cb_1010_2160p60.mp4 (3840x2160) [56.2 MB] || elnino_2026_avw_cb_1010.02200_preview.jpg (1920x1080) [636.2 KB] || elnino_2026_avw_cb_1010.02200.jpg (3840x2160) [2.2 MB] || This visualization compares sea surface height anomalies (SSHA) over the same months in 2025 and 2026. Red and orange indicate areas where the ocean surface is higher than usual, while blue indicates areas where it is lower than usual. Higher sea surface heights in the eastern tropical Pacific can be a signal of developing El Niño conditions. || elnino_2026_ssha_cb_1003_1080p60.mp4 (1920x1080) [32.4 MB] || elnino_2026_ssha_cb_1003_2160p60.mp4 (3840x2160) [91.6 MB] || elnino_2026_ssha_cb_1003.02200_preview.jpg (1920x1080) [672.2 KB] || elnino_2026_ssha_cb_1003.02200.jpg (3840x2160) [2.0 MB] || This visualization compares three ocean data products, sea surface temperature anomaly (SSTA), apparent visible wavelength (AVW), and sea surface height anomaly (SSHA), over the same months in 2025 and 2026. This version includes date labels but omits the other on-screen text and annotations. || elnino_2026_ssta_avw_ssha_1010_nolabels.02200_preview.jpg (1920x1080) [796.2 KB] || elnino_2026_ssta_avw_ssha_1010_nolabels.02200.jpg (3840x2160) [2.6 MB] || elnino_2026_ssta_avw_ssha_1010_nolabels_1080p60.mp4 (1920x1080) [36