                - paragraph [ref=f6e597]:
                  - text: In November 2026, each of NASA’s two
                  - strong [ref=f6e598]: ESCAPADE
                  - text: (Escape and Plasma Acceleration and Dynamics Explorers) spacecraft will perform a “powered” flyby of Earth, combining Earth’s gravity with an approximately 9-minute engine burn, to slingshot itself toward Mars. || 15114 || Star Charts for ESCAPADE’s Earth Flyby || In November 2026, each of NASA’s two
                  - strong [ref=f6e599]:
                    - link "ESCAPADE" [ref=f6e600] [cursor=pointer]:
                      - /url: https://science.nasa.gov/mission/escapade
                  - text: (Escape and Plasma Acceleration and Dynamics Explorers) spacecraft will perform a “powered” flyby of Earth, combining Earth’s gravity with an approximately 9-minute engine burn, to slingshot itself toward Mars. The first ESCAPADE spacecraft will make its closest approach and complete its engine burn around 5 a.m. EST on Nov. 7, and the second will do so two days later, around 6 a.m. EST on Nov. 9. In the hours before, during, and after each spacecraft’s closest approach, observers on the ground might be able to spot the spacecraft in the night sky. However, a telescope will most likely be needed to find it as a dim point moving against the stars. Each spacecraft will appear to move through the sky relatively slowly and take several hours to cross overhead. From the U.S., each spacecraft will be below the horizon during its closest approach to Earth. Therefore, the spacecraft will be best viewed in the western sky an hour or two before closest approach. From some viewing locations, the spacecraft will also reappear in the eastern sky an hour or two after its closest approach.The star charts below show the path the spacecraft will take across the sky for several different locations in the U.S. The colors along the path represent the altitude of the spacecraft, which will decrease during the time shown, with red showing the lowest altitude along the path (when the spacecraft should be brightest). If your viewing location is not represented here, you can use the NASA Jet Propulsion Laboratory’s
                  - link "Horizons System" [ref=f6e601] [cursor=pointer]:
                    - /url: https://ssd.jpl.nasa.gov/horizons/app.html#/
                  - text: "to get coordinates for the two spacecraft at different times for your location.Locations included below:"
                  - emphasis [ref=f6e602]: Berkeley, California
                  - text: Boulder, Colorado
                  - emphasis [ref=f6e603]: Chicago, Illinois
                  - text: Greenbelt, Maryland (NASA’s Goddard Space Flight Center)
                  - emphasis [ref=f6e604]: Goldstone, California
                  - text: Honolulu, Hawaii
                  - emphasis [ref=f6e605]: New York, New York
                  - text: Portland, Oregon
                  - emphasis [ref=f6e606]: Seattle, Washington
                  - text: Tempe, Arizona
                  - emphasis [ref=f6e607]:
                    - text: Temple, TexasRead more about ESCAPADE's powered Earth flyby on
                    - link "NASA's ESCAPADE blog" [ref=f6e608] [cursor=pointer]:
                      - /url: https://science.nasa.gov/blogs/escapade/2026/11/02/nasas-twin-escapade-spacecraft-to-slingshot-past-earth-on-way-to-mars/
                    - text: . || Berkeley, California ||
                  - emphasis [ref=f6e609]: Animated map, first spacecraft
                  - emphasis [ref=f6e610]: "The color-coded arc in this animated star chart shows the path that the first ESCAPADE spacecraft will take across the sky as seen from Berkeley, California, from approximately 7 p.m. (19:00) Pacific Time (PT) on Nov. 6 to about 1 a.m. (01:00) PT on Nov. 7. The spacecraft rises again around 3 a.m. (03:00) PT on Nov. 7. Gray at the end of the path indicates when the spacecraft becomes unobservable as the sky brightens with sunlight (after 5 a.m. PT on Nov. 7). Dots appear along the path when the spacecraft is moving the fastest across the sky. The animation shows how the positions of the constellations change over time as the spacecraft crosses the sky. Credit: Advanced Space || Berkeley-star-chart-Nov7-movie.mp4 (1080x1080) [8.6 MB] ||"
                  - emphasis [ref=f6e611]: Animated map, second spacecraft
                  - emphasis [ref=f6e612]: "The color-coded arc in this animated star chart shows the path that the second ESCAPADE spacecraft will take across the sky as seen from Berkeley, California, from approximately 7 p.m. (19:00) Pacific Time (PT) on Nov. 8 to about 2 a.m. (02:00) PT on Nov. 9. The spacecraft rises again around 4 a.m. (04:00) PT on Nov. 9. Gray at the end of the path indicates when the spacecraft becomes unobservable as the sky brightens with sunlight (after 5 a.m. PT on Nov. 9). Dots appear along the path when the spacecraft is moving the fastest across the sky. The animation shows how the positions of the constellations change over time as the spacecraft crosses the sky. Credit: Advanced Space || Berkeley-star-chart-Nov9-movie.mp4 (1080x1080) [8.7 MB] || Boulder, Colorado ||"
                  - emphasis [ref=f6e613]: Still map, first spacecraft
