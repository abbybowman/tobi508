                - paragraph [ref=f6e786]: "EARTH VENTURE SUBORBITAL-4From 2026 to 2029, hundreds of scientists will be flying a fleet of research planes loaded with instruments to study fire weather, glaciers, landslides, air quality, and emissions from farms. The EVS-4 (Earth Ventures Suborbital-4) mission consists of a series of six airborne campaigns addressing these urgent science topics. These campaigns are designed to fill the gap between satellite observations from space, and ground-level measurements. FARMFLUXAgriculture is the single largest source of ammonia, methane, and nitrous oxide in the United States, and it is a rising source of other atmospheric emissions.Nitrogen is essential to plant growth and animal production. Fertilizer application and manure management inevitably release nitrogen-containing gases, such as ammonia, nitrous oxide, and nitrogen oxides, in addition to methane and other carbon-containing gases. Agricultural emissions are challenging to quantify, and ground monitoring networks are sparse in rural areas. FarmFlux will deploy cutting-edge airborne instruments and techniques to fill this important and understudied gap in climate science and atmospheric research. || || 15106 || NASA FARMFLUX EARTH VENTURE SUBORBITAL-4 || EARTH VENTURE SUBORBITAL-4From 2026 to 2029, hundreds of scientists will be flying a fleet of research planes loaded with instruments to study fire weather, glaciers, landslides, air quality, and emissions from farms. The EVS-4 (Earth Ventures Suborbital-4) mission consists of a series of six airborne campaigns addressing these urgent science topics. These campaigns are designed to fill the gap between satellite observations from space, and ground-level measurements. FARMFLUXAgriculture is the single largest source of ammonia, methane, and nitrous oxide in the United States, and it is a rising source of other atmospheric emissions.Nitrogen is essential to plant growth and animal production. Fertilizer application and manure management inevitably release nitrogen-containing gases, such as ammonia, nitrous oxide, and nitrogen oxides, in addition to methane and other carbon-containing gases. Agricultural emissions are challenging to quantify, and ground monitoring networks are sparse in rural areas. FarmFlux will deploy cutting-edge airborne instruments and techniques to fill this important and understudied gap in climate science and atmospheric research. || Glenn Wolfe, Principal Investigator for FarmFluxGSFC Studio Interview1. 00:10 What is the goal of the FarmFlux campaign?2. 00:57 Why is it important to measure livestock operations?3. 02:05 What are you measuring over farm fields?4. 03:03 What role does agruculture play in overall air quality? Why is it such a critical piece of the puzzle?5. 03:52 Tell us about the plane you're flying to take these measurements. What kind of aircraft are you using to measure livestock?6. 04:23 And how will you measure the croplands?5. 05:13 How do you separate the data NASA collects from policy debates surrounding climate and agriculture, and where does FarmFlux fit into that? || 20260920_SVS15106_EVS4_FARMFLUX_GSFC_GLENN_WOLFE_STUDIO_INTERVIEW_4096x2160_29.97fps.00001_print.jpg (1024x576) [91.4 KB] || 20260920_SVS15106_EVS4_FARMFLUX_GSFC_GLENN_WOLFE_STUDIO_INTERVIEW_4096x2160_29.97fps.00001_web.png (320x180) [43.1 KB] || 20260920_SVS15106_EVS4_FARMFLUX_GSFC_GLENN_WOLFE_STUDIO_INTERVIEW_4096x2160_29.97fps.00001_thm.png (80x40) [4.3 KB] || 20260920_SVS15106_EVS4_FARMFLUX_GSFC_GLENN_WOLFE_STUDIO_INTERVIEW_4096x2160_29.97fps.webm (3840x2160) [59.4 MB] || 20260920_SVS15106_EVS4_FARMFLUX_GSFC_GLENN_WOLFE_STUDIO_INTERVIEW_4096x2160_29.97fps_US.en.en_US.srt [7.3 KB] || 20260920_SVS15106_EVS4_FARMFLUX_GSFC_GLENN_WOLFE_STUDIO_INTERVIEW_4096x2160_29.97fps_US.en.en_US.vtt [6.9 KB] || 20260920_SVS15106_EVS4_FARMFLUX_GSFC_GLENN_WOLFE_STUDIO_INTERVIEW_4096x2160_29.97fps.mp4 (3840x2160) [1.9 GB] || Selected BROLL of EVS-4 FarmFlux Airborne Campaign Dynamic Av