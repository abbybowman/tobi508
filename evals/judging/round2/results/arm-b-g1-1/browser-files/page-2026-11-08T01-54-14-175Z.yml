                  - text: "|| SIGGRAPH_OfficialSelectionETWhite.png (1920x1080) [49.5 KB] || This is a visualization of ocean currents around the world. NASA’s ocean model, Estimating the Circulation and Climate of the Ocean (ECCO)), is used to visualize the currents. The ECCO ocean circulation model incorporates observations from spacecraft, buoys, and other in situ measurements to keep the model accurate. ECCO is a joint project between NASA/JPL, MIT, and UT Austin. The model output used here is from ECCO-2 and covers the years 2021-2023.In 2011, we used ECCO2 to create a visualization called Perpetual Ocean. Perpetual Ocean continues to be extremely popular, but it only shows ocean currents on the surface. In this new visualization, we use the ocean’s 3D velocity field to visualize some of the strongest ocean currents. We release virtual particles in the ocean and allow them to move with the ocean’s three dimensional velocity field. Each particle has a trail to better see its direction of movement. The particles initialized above 600 meters in depth have a trail length of 3 days, those initialized deeper than 600 meters have a trail length of 6 days. The particle trails help identify the strongest currents in the world that are squeezed in narrow belts on the western side of each ocean basin. These are called western boundary currents. The looping meanders in the boundary currents sometimes form turbulent rings (eddies) that can trap cold or warm waters in their centers and then separate from the main flow (see 2:30 of temperature version for an example for trapped warm water). In general, the western boundary currents are warm and salty.The visualization starts from a global rotating view before slowing down to see the Western Boundary Current along the western edge of the Pacific Ocean along the coasts of Australia, and Asia. We zoom in to show the Kuroshio Current off the coast of Japan. Along the Japanese coast, the current exhibits large meanders that can persist for many months in more or less the same location. The Kuroshio current has a temperature range of 20 to 25 °C. Its salinity can change seasonally with an average value of 34.5.We then zoom out and move over the Indian Ocean The Indian Ocean exhibits large variations in salinity. The western Indian Ocean is quite salty (>36) due to overflow inputs from marginal Seas (e.g. Persian Gulf and Red Sea). The East Indian Ocean is fresher (~35) due to river inputs from India. The Indonesian Throughflow is quite fresh (33-34) and carries freshwater from the Pacific. We then zoom into the southern tip of Africa. The exchange of water from the Indian Ocean to the South Atlantic occurs here. The Agulhas Current is another Western Boundary current following the slope of the continental shelf closely. The continental shelf along the east coast of southern Africa is quite narrow and steep. This sloping topography stabilizes the Agulhas Current so that it shows no wide meanderings of the type familiar in other boundary currents such as the Kuroshio. The Agulhas Current overshoots the African continent, moving into the South Atlantic. Then retroflects back to the Indian Ocean. At the retroflection, shedding of warm (20 to 25 °C ) and salty (~35.5) rings happens. The eddies detached from the current have a lifetime of more than 2 years traveling across the south Atlantic ocean. These eddies are referred to as Agulhas Rings.Another Western Boundary Current, called the Gulf Stream comes into view along the east coast of North America. The Gulf Stream forms at the Florida Straits. It’s one of the fastest currents on Earth with surface speed of up to 2.5 meters per second. In the Gulf stream, cold cores (mostly anticyclonic ones) form when the Gulf Stream meanders eastward leaving the coast of North America (off Cape Hatteras in North Carolina). The eddy diameters can be as large as 1000 km. Zooming into the Gulf Stream, we can see that the warm surface water (>25°C) moves poleward (white particle trails). The Gulf Stream is generally the warmest and saltiest western boundary current. There’s a return current underneath at depth below 500m (the blue particle trails) moving southward carrying cold waters from the pole. The loop currents in the Gulf of Mexico are very large eddies persisting in the Gulf. They bring the warm and highly saline Caribbean water into the Gulf. As we zoom out from the Gulf Stream, the salinity version shows that the Atlantic is generally much more salty than the Pacific.Models like ECCO-2 help scientists to understand the characteristics of these currents better and ultimately understand how heat is transported globally in the Ocean. || This is the 'temperature version' of Perpetual Ocean 2: Western Boundary Currents. The visualization starts with a rotating globe showing ocean currents. The camera then zooms into the Kuroshio current, moves over the Indian Ocean to the Agulhas Current, then over to the Gulf Stream.The colors used to color the flow in this version vary from dark blue to purple to orange to yellow. See the colorbar below specified for the 'temperature version'. || perpetual_ocean2_CLOSE_096_temperature.00000_print.jpg (1024x576) [189.7 KB] || perpetual_ocean2_CLOSE_096_temperature_1080p30.mp4 (1920x1080) [903.8 MB] || temperature (3840x2160) [19001 Item(s)] || perpetual_ocean2_CLOSE_096_temperature_2160p60.mp4 (3840x2160) [3.3 GB] || This is the 'salinity version' of Perpetual Ocean 2: Western Boundary Currents. See the colorbar below specified for the 'salinity version'. || perpetual_ocean2_CLOSE_103_salinity.00001_print.jpg (1024x576) [180.3 KB] || salinity (3840x2160) [19001 Item(s)] || perpetual_ocean2_CLOSE_103_salinity_1080p30.mp4 (1920x1080) [994.5 MB] || perpetual_ocean2_CLOSE_103_salinity_2160p30.mp4 (3840x2160) [3.9 GB] || perpetual_ocean2_CLOSE_103_salinity.mp4 (3840x2160) [4.3 GB] || This is the '600 meter and deeper beauty version' showing only ocean currents below 600 meters in the Gulf Stream region. This is intended for fading in post production to better see the counter current. This uses the same color table as the 'beauty shot version'. || perpetual_ocean2_CLOSE_095_beauty_600m_and_below.14000_print.jpg (1024x576) [380.6 KB] || perpetual_ocean2_CLOSE_095_beauty_600m_and_below_1080p30.mp4 (1920x1080) [115.3 MB] || beauty_600m_and_lower (3840x2160) [2001 Item(s)] || perpetual_ocean2_CLOSE_095_beauty_600m_and_below_2160p60.mp4 (3840x2160) [366.6 MB] || This is an overlay layer of the equator line and label to enable the enhancement of the equator in post production. It is rendered with a hold-out matte for the earth. || perpetual_ocean2_CLOSE_095_equator_holdout.00000_print.jpg (1024x576) [8.4 KB] || perpetual_ocean2_CLOSE_095_equator_holdout_1080p30.mp4 (1920x1080) [2.4 MB] || perpetual_ocean2_CLOSE_095_equator_holdout.mp4 (3840x2160) [9.4 MB] || equator (3840x2160) [19001 Item(s)] || Optional sea ice only layer. || perpetual_ocean2_CLOSE_097_SEA_ICE_ONLY.00000_print.jpg (1024x576) [14.2 KB] || perpetual_ocean2_CLOSE_097_SEA_ICE_ONLY_1080p30.mp4 (1920x1080) [4.9 MB] || perpetual_ocean2_CLOSE_097_SEA_ICE_ONLY.mp4 (3840x2160) [19.1 MB] || sea_ice (3840x2160) [19001 Item(s)] || Layer with land only || perpetual_ocean2_CLOSE_097_LAND_ONLY2.00000_print.jpg (1024x576) [113.3 KB] || perpetual_ocean2_CLOSE_097_LAND_ONLY2_1080p30.mp4 (1920x1080) [229.6 MB] || land_only (3840x2160) [19001 Item(s)] || perpetual_ocean2_CLOSE_097_LAND_ONLY_2160p60.mp4 (3840x2160) [691.0 MB] || Land mask layer. This is intended to be used with the land layer which has changing snow. || perpetual_ocean2_CLOSE_097_LAND_MASK.00000_print.jpg (1024x576) [44.2 KB] || perpetual_ocean2_CLOSE_097_LAND_MASK_1080p30.mp4 (1920x1080) [46.3 MB] || land_mask (3840x2160) [19001 Item(s)] || perpetual_ocean2_CLOSE_097_LAND_MASK.mp4 (3840x2160) [153.1 MB] || This is a dates only layer that corresponds to the 'beauty shot version' and 'temperature version' on this page. Dates range from 15 Jan 2