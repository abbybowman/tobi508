<!doctype html><html lang="en"><head><title>Sign up</title></head><body><main><h1>Sign up</h1>
<div id="slot"></div>
<script>
// The form is in a frame from another site (localhost against 127.0.0.1).
var f = document.createElement('iframe');
f.title = 'Sign up form';
f.width = 600; f.height = 240;
f.src = new URL('frames/vague.html', location.href).href.replace('127.0.0.1', 'localhost');
document.getElementById('slot').appendChild(f);
</script></main></body></html>
