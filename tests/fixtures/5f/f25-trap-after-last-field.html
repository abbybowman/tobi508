<!doctype html><html lang="en"><head><meta charset="utf-8"><title>F25 A trap after every form</title></head><body><main><h1>Forms</h1>
<form onsubmit="event.preventDefault()"><label>Name <input name="c" required></label><button>Send</button></form>
<div tabindex="0" id="trap" role="textbox" aria-label="editor">trap</div>
<script>document.addEventListener('keydown',function(e){if(e.key==='Tab'&&document.activeElement.id==='trap'){e.preventDefault();}},true);</script>
</main></body></html>
