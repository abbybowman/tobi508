<!doctype html><html lang="en"><head><meta charset="utf-8"><title>F28 Search with filters</title></head><body><main><h1>Search</h1>
<form onsubmit="event.preventDefault()">
<label>Search <input id="q" name="q"></label>
<button id="b" type="button" aria-expanded="false" aria-controls="panel">Filters</button>
<div id="panel" hidden><label>Year <input id="year" name="year"></label></div>
<button id="s" type="submit">Search</button>
</form></main>
<footer><a href="#help">Help</a><p id="extra" hidden><label>Author <input id="author" name="author" form="none"></label></p></footer>
<script>
// Opening the filters also shows an "Author" field in the footer, far from
// the button in the Tab order.
const b = document.getElementById("b"), panel = document.getElementById("panel"), extra = document.getElementById("extra");
b.addEventListener("click", () => {
  const open = b.getAttribute("aria-expanded") === "true";
  b.setAttribute("aria-expanded", String(!open));
  panel.hidden = open; extra.hidden = open;
});
</script></body></html>
