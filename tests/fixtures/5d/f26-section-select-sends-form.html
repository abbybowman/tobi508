<!doctype html><html lang="en"><head><meta charset="utf-8"><title>F26 Search with filters</title></head><body><main><h1>Search</h1>
<form id="f" onsubmit="event.preventDefault(); document.title = 'Sent';">
<label>Search <input id="q" name="q"></label>
<button id="b" type="button" aria-expanded="false" aria-controls="panel">Filters</button>
<div id="panel" hidden><label for="sort">Sort by</label> <select id="sort" name="sort"><option>Relevance</option><option>Date</option><option>Title</option></select></div>
<button id="s" type="submit">Search</button>
</form></main>
<script>
const b = document.getElementById("b"), panel = document.getElementById("panel");
b.addEventListener("click", () => {
  const open = b.getAttribute("aria-expanded") === "true";
  b.setAttribute("aria-expanded", String(!open));
  panel.hidden = open;
});
document.getElementById("sort").addEventListener("change", () => document.getElementById("f").requestSubmit());
</script></body></html>
