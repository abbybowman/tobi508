<!doctype html><html lang="en"><head><meta charset="utf-8"><title>F18 Blur, half a second later</title></head><body>
<p><a id="top" href="#top">Back to top</a></p>
<h1>Your details</h1>
<form onsubmit="return false">
<p><label for="n">Name</label> <input id="n" name="n" type="text"></p>
<p><label for="e">Email</label> <input id="e" name="e" type="text"></p>
<p><button type="submit">Save</button></p>
</form>
<script>
document.getElementById("n").addEventListener("blur", () => setTimeout(() => document.getElementById("top").focus(), 500));
</script>
</body></html>
