<!doctype html><html lang="en"><head><meta charset="utf-8"><title>F23 Register for updates</title></head><body>
<h1>Register for updates</h1>
<x-register></x-register>
<script>
// f16's form, inside a web component (an open shadow root).
customElements.define('x-register', class extends HTMLElement {
  constructor() {
    super();
    const r = this.attachShadow({ mode: 'open' });
    r.innerHTML =
      '<style>#terms{position:fixed;left:4vw;top:6vh;width:92vw;height:84vh;overflow:auto;background:#fff;border:2px solid #333;padding:24px;box-sizing:border-box}</style>' +
      '<form onsubmit="return false">' +
      '<p><label>Email <input id="email" type="email"></label></p>' +
      '<p><label><input type="checkbox" id="show"> Show the full terms</label></p>' +
      '<p><button>Register</button></p></form>' +
      '<div id="terms" hidden><h2>Terms of use</h2>' +
      '<p>Updates are sent no more than once a week. You can stop them at any time from the link in each message.</p>' +
      '<p>Your address is used only to send these updates and is never shared.</p></div>';
    const show = r.getElementById('show'), terms = r.getElementById('terms');
    show.addEventListener('change', () => { terms.hidden = !show.checked; });
  }
});
</script>
</body></html>
