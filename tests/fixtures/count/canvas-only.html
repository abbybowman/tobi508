<!doctype html><html lang=en><head><title>Canvas</title></head><body><canvas id=c width=300 height=300 style="border:1px solid"></canvas><div draggable="true" style="width:80px;height:80px;background:#ccc">drag</div><script>document.getElementById('c').addEventListener('mousemove',function(e){this.getContext('2d').fillRect(e.offsetX,e.offsetY,3,3)})</script></body></html>
