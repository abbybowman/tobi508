<!doctype html><html lang="en"><head><title>Contact</title></head><body>
<nav aria-label="Site"><button type="button" aria-expanded="false" aria-controls="menu" onclick="var m=document.getElementById('menu');m.hidden=!m.hidden;this.setAttribute('aria-expanded',String(!m.hidden))">Menu</button>
<ul id="menu" hidden><li><a href="#about">About</a></li></ul></nav>
<main><h1>Contact us</h1>
<form onsubmit="event.preventDefault()">
<p><label>Email <input type="email" name="email"></label></p>
<fieldset><legend>How should we reach you?</legend>
<label><input type="radio" name="how" value="email" onchange="show()"> By email</label>
<label><input type="radio" name="how" value="phone" onchange="show()"> By phone</label>
<label><input type="radio" name="how" value="other" onchange="show()"> Another way</label>
</fieldset>
<p id="explain" style="display: none;"><label>Tell us how <input name="explain"></label></p>
<p><button type="submit">Send</button></p>
</form></main>
<script>function show(){document.getElementById('explain').style.display=document.querySelector('input[name=how][value=other]').checked?'block':'none'}</script>
</body></html>
