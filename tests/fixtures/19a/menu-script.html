<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Example Agency</title><style>.sub{display:none}.sub.open{display:block}</style></head><body>
<header><a href="/19a/menu-script.html">Example Agency</a><nav aria-label="Main"><ul><li><button id="f" aria-expanded="false">Funding</button><ul class="sub" id="fsub"><li><a href="/19a/t7-grants.html">Rural grants</a></li><li><a href="/19a/contact.html">Ask us</a></li></ul></li><li><a href="/19a/contact.html">Contact</a></li></ul></nav></header>
<main><h1>Welcome</h1><p>See our <a href="/19a/t7-grants.html">rural grants</a>.</p></main>
<script>
const f = document.getElementById("f"), sub = document.getElementById("fsub");
f.addEventListener("click", () => {
  const open = f.getAttribute("aria-expanded") === "true";
  f.setAttribute("aria-expanded", String(!open));
  sub.classList.toggle("open", !open);
});
</script></body></html>
