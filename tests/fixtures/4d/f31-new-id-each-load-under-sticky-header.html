<!doctype html><html lang="en"><head><meta charset="utf-8"><title>F31 Video</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #fff; }
  header { position: sticky; top: 0; height: 64px; background: #202326; color: #fff; z-index: 10; display: flex; align-items: center; padding: 0 16px; }
  main { padding: 16px; }
  .spacer { height: 900px; background: #f4f4f4; }
  .player { margin: 16px 0; padding: 12px; background: #111; display: flex; gap: 12px; }
  .player button { width: 48px; height: 40px; background: #333; color: #fff; border: 0; outline: none; }
  .player button:focus { outline: 3px solid #4da3ff; outline-offset: 2px; }
  a:focus { outline: 2px solid #1b4f9c; }
</style></head><body>
<header><a href="#top" style="color:#fff">Home</a></header>
<main>
  <h1>A visualization</h1>
  <div class="spacer"></div>
  <div class="player" id="player">
    <button aria-label="play">&#9654;</button>
    <button aria-label="mute">M</button>
    <button aria-label="enter full screen">F</button>
  </div>
  <div class="spacer"></div>
  <p><a href="#credits">Credits</a></p>
</main>
<script>
  // A new id on every load, as a media player does.
  document.getElementById("player").id = "media_" + Math.random().toString(36).slice(2);
</script>
</body></html>
