<!doctype html><html lang="en"><head><meta charset="utf-8"><title>F29 blur on focus inside a web component</title></head><body>
<p><a href="#a">Before</a> <x-send></x-send> <a href="#c">After</a></p>
<script>
customElements.define('x-send', class extends HTMLElement {
  constructor() { super(); this.attachShadow({ mode: 'open' }).innerHTML = '<button id="b" onfocus="this.blur()">Send</button>'; }
});
</script></body></html>
