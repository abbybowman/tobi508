<!doctype html><html lang="en"><head><meta charset="utf-8"><title>F47 Topics</title>

<nav aria-label="Main"><a href="#home">Home</a>

<script>
// Opens on a mouse click only: Enter and Space do nothing.
const b = document.getElementById("b"), m = document.getElementById("m");
b.addEventListener("click", () => { const open = b.getAttribute("aria-expanded") === "true"; b.setAttribute("aria-expanded", String(!open)); m.hidden = open; });
</script></body></html>
