<!doctype html>
<html lang="en">
<head><title>A button that answers only mousedown</title></head>
<body>
<h1>A button that answers only mousedown</h1>
<button id="open" onmousedown="document.getElementById('panel').hidden = false">Open panel</button>
<div id="panel" hidden>The panel</div>
</body>
</html>
