<!doctype html><html lang="en"><head><meta charset="utf-8"><title>F47 Topics menu</title></head><body>
<header><nav aria-label="Main">
<a href="#home">Home</a>
<button id="b" type="button" aria-expanded="false" aria-controls="panel">Topics</button>
<ul id="panel" hidden><li><a href="#earth">Earth</a></li><li><a href="#sun">Sun</a></li><li><a href="#moon">Moon</a></li></ul>
<a href="#contact">Contact</a>
</nav></header>
<main><h1>Topics</h1><p>Pick a topic from the menu.</p><a href="#more">More about topics</a></main>
<script>
const b = document.getElementById("b"), panel = document.getElementById("panel");
b.addEventListener("click", () => {
  const open = b.getAttribute("aria-expanded") === "true";
  b.setAttribute("aria-expanded", String(!open));
  panel.hidden = open;
});
</script></body></html>
