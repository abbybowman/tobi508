<!doctype html>
<html lang="en">
<head><title>SMIL strobe</title><style>body { margin: 0; background: #808080; } h1 { margin: 8px; font: 20px sans-serif; } svg { position: absolute; left: 0; top: 60px; }</style></head>
<body>
<main>
<h1>SMIL strobe</h1>
<svg width="400" height="300" role="img" aria-label="Strobe">
<rect width="400" height="300" fill="black"><animate attributeName="fill" values="black;white" dur="0.2s" calcMode="discrete" repeatCount="indefinite"/></rect>
</svg>
</main>
</body>
</html>
