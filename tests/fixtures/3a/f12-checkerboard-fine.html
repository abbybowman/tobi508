<!doctype html>
<html lang="en">
<head><title>Fine pattern</title>
<style>
body { margin: 0; font: 16px sans-serif; background: #808080; }
h1 { margin: 8px; font-size: 20px; }
@keyframes c { 0%, 49.9% { background-position: 0 0; } 50%, 100% { background-position: 2px 0; } }
#c { position: absolute; left: 0; top: 60px; width: 400px; height: 300px; background-image: repeating-conic-gradient(#000 0 25%, #fff 0 50%); background-size: 4px 4px; animation: c 200ms steps(1) infinite; }
</style>
</head>
<body>
<main>
<h1>Fine pattern</h1>
<div id="c" role="img" aria-label="Texture"></div>
</main>

</body>
</html>
