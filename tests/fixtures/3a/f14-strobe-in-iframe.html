<!doctype html>
<html lang="en">
<head><title>Strobe in a frame</title>
<style>
body { margin: 0; font: 16px sans-serif; background: #808080; }
h1 { margin: 8px; font-size: 20px; }
iframe { position: absolute; left: 0; top: 60px; border: 0; }
</style>
</head>
<body>
<main>
<h1>Strobe in a frame</h1>
<iframe id="f" title="Strobe" width="420" height="320"></iframe>
</main>
<script>
// Another host than the page (localhost vs 127.0.0.1): a cross-site frame.
document.getElementById('f').src = 'http://localhost:' + location.port + '/3a/f14-inner.html';
</script>
</body>
</html>
