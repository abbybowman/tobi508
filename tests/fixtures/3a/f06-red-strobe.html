<!doctype html>
<html lang="en">
<head><title>Red strobe</title>
<style>
body { margin: 0; font: 16px sans-serif; background: #808080; }
h1 { margin: 8px; font-size: 20px; }
@keyframes r { 0%, 49.9% { background: rgb(127, 127, 127); } 50%, 100% { background: rgb(255, 0, 0); } }
body { background: rgb(127, 127, 127); }
#r { position: absolute; left: 0; top: 60px; width: 400px; height: 300px; animation: r 200ms steps(1) infinite; }
</style>
</head>
<body>
<main>
<h1>Red strobe</h1>
<div id="r" role="img" aria-label="Warning"></div>
</main>
