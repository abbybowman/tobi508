<!doctype html>
<html lang="en">
<head><title>Small flasher</title>
<style>
body { margin: 0; font: 16px sans-serif; background: #808080; }
h1 { margin: 8px; font-size: 20px; }
@keyframes f { 0%, 49.9% { background: #000; } 50%, 100% { background: #fff; } }
#f { position: absolute; left: 100px; top: 100px; width: 40px; height: 40px; animation: f 200ms steps(1) infinite; }
</style>
</head>
<body>
<main>
<h1>Small flasher</h1>
<div id="f" role="img" aria-label="Alert light"></div>
</main>

</body>
</html>
