<!doctype html><html lang="en"><head><meta charset="utf-8"><title>F34 Gallery</title>
<style>
  .gallery { display: flex; gap: 8px; list-style: none; padding: 0; align-items: stretch; }
  .gallery button { width: 32px; background: #222; color: #fff; border: 0; }
  .card { width: 160px; border: 1px solid #999; padding: 4px; }
</style></head><body>
<h1>Gallery</h1>
<form role="search" onsubmit="return false"><label for="q">Search</label> <input id="q" name="q"> <button>Search</button></form>
<div>
<ul class="gallery">
<button type="button" class="scroll-left" aria-hidden="true" tabindex="-1"><svg width="12" height="24" viewBox="0 0 12 24"><path d="M10 2L2 12l8 10" fill="none" stroke="#fff" stroke-width="2"/></svg></button>
<li class="card"><a href="#a">Sea ice minimum</a></li>
<li class="card"><a href="#b">Solar flare</a></li>
<li class="card"><a href="#c">Hurricane season</a></li>
<button type="button" class="scroll-right" aria-hidden="true" tabindex="-1"><svg width="12" height="24" viewBox="0 0 12 24"><path d="M2 2l8 10-8 10" fill="none" stroke="#fff" stroke-width="2"/></svg></button>
</ul>
</div>
<script>
document.querySelectorAll(".gallery button").forEach((b) => b.addEventListener("click", () => {
  document.querySelector(".gallery").scrollBy({ left: b.classList.contains("scroll-left") ? -160 : 160 });
}));
</script>
</body></html>
