<!doctype html><html lang="en"><head><title>Subscribe</title></head><body>
<h1>Subscribe</h1>
<p>Get the newsletter.</p>
<x-signup></x-signup>
<script>
customElements.define('x-signup', class extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' }).innerHTML =
      '<form onsubmit="return false">' +
      '<div><label for="n">Full name</label> <input id="n" name="n"></div>' +
      '<div><label for="e">Email address</label> <input id="e" type="email" name="e"></div>' +
      '<div><button type="submit">Subscribe</button></div></form>';
  }
});
</script>
</body></html>
