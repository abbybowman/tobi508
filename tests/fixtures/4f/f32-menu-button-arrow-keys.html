<!doctype html>
<html lang="en">
<head><title>Search</title>
<style>
  #menu[hidden] { display: none; }
  #menu { position: absolute; top: 80px; left: 8px; border: 1px solid #333; width: 200px; list-style: none; padding: 4px; margin: 0; background: #fff; }
</style></head>
<body>
<h1>Search</h1>
<button type="button" id="scope" aria-haspopup="true" aria-expanded="false" aria-controls="menu">All</button>
<label>Search <input type="search" id="q"></label>
<button type="submit">Go</button>
<p>Results appear here.</p>
<!-- The menu is placed at the end of the document, as a library that
     appends its menus to the body does. -->
<ul id="menu" role="menu" hidden>
  <li role="none"><a role="menuitem" href="#earth">Earth</a></li>
  <li role="none"><a role="menuitem" href="#sun">Sun</a></li>
  <li role="none"><a role="menuitem" href="#planets">Planets</a></li>
</ul>
<script>
  const btn = document.getElementById('scope'), menu = document.getElementById('menu');
  const items = [...menu.querySelectorAll('[role=menuitem]')];
  const open = () => { menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); };
  const close = () => { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
  btn.addEventListener('click', () => (menu.hidden ? open() : close()));
  // Arrow keys move into the menu and through it.
  btn.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown' && !menu.hidden) { e.preventDefault(); items[0].focus(); } });
  menu.addEventListener('keydown', (e) => {
    const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    if (e.key === 'Escape') { e.preventDefault(); close(); btn.focus(); }
  });
</script>
</body>
</html>
