<!doctype html><html lang="en"><head><meta charset="utf-8"><title>F25 positive tabindex inside a frame from another site</title></head><body>
<header><a href="#home">Agency home</a></header>
<div id="slot"></div>
<script>
// f03's page, inside a frame from another site (localhost against 127.0.0.1).
var f = document.createElement('iframe');
f.title = 'Benefits'; f.width = 600; f.height = 300;
f.src = new URL('frames/f25-inner.html', location.href).href.replace('127.0.0.1', 'localhost');
document.getElementById('slot').appendChild(f);
</script></body></html>
