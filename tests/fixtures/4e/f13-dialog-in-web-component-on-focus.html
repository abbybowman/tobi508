<!doctype html><html lang="en"><head><title>F13 sign-up dialog inside a web component on focus</title></head><body>
<h1>News</h1>
<a href="#a" id="before">Before</a>
<label>Search <input id="search"></label>
<x-signup id="su"></x-signup>
<a href="#c" id="after">After</a>
<script>
// The dialog lives inside a web component (an open shadow root).
customElements.define('x-signup', class extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' }).innerHTML =
      '<style>#dlg{position:fixed;inset:10% 10%;background:#fff;border:3px solid #333;padding:2em;box-shadow:0 0 0 9999px rgba(0,0,0,.5)}</style>' +
      '<div id="dlg" role="dialog" aria-label="Sign up" hidden><h2>Sign up for our newsletter</h2><p>Get updates every week.</p></div>';
  }
  open() { this.shadowRoot.getElementById('dlg').hidden = false; }
});
search.addEventListener('focus', () => { su.open(); });
</script>
</body></html>
