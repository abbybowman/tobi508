name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the heavy jobs run (post-round 2 fix 29, Abby 2026-11-08).
  # A change is docs-only when every changed file is under docs/ and nothing
  # else (Q-02): README.md, specs/ and Markdown the code reads or hashes
  # (src/tobi508/judge_prompt.md, third_party/**) are code. A skipped job
  # counts as passed for a required check; "CI" below is the one check to
  # require.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find what changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
        run: |
          base="$BASE_PR"
          [ "$EVENT" = "push" ] && base="$BASE_PUSH"
          # A new branch or a force push has no usable base: run everything.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=false
          while IFS= read -r f; do
            case "$f" in
              docs/*) ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$base" HEAD)
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.32"

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

  # The suite split by test file, each group on its own runner. "rest" takes
  # every file the other groups do not name, so a new test file is never
  # left out. Keep the groups roughly even (they took ~20 min as one job).
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: keyboard
            args: tests/test_fixtures_4*.py
          - group: forms-and-site
            args: tests/test_fixtures_5*.py tests/test_fixtures_9*.py tests/test_fixtures_19a.py tests/test_site.py
          - group: motion-and-cases
            args: tests/test_fixtures_2*.py tests/test_fixtures_3a.py tests/test_act_*.py tests/test_baseline_cases.py tests/test_motion*.py tests/test_flash.py tests/test_rows_*.py
          - group: rest
            args: >-
              tests/
              --ignore-glob=tests/test_fixtures_[0-9]*.py
              --ignore-glob=tests/test_act_*.py
              --ignore=tests/test_baseline_cases.py
              --ignore-glob=tests/test_motion*.py
              --ignore=tests/test_flash.py
              --ignore-glob=tests/test_rows_*.py
              --ignore=tests/test_site.py
    name: test (${{ matrix.group }})
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.32"

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --group dev

      # CI has no installed Chrome; tests default to Playwright's Chromium.
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      # Playwright MCP, pinned by its lockfile, for Agent B's browser tests
      # (test_agent_freeze, test_agent_run); without it they are skipped
      # (post-round 1 fix 3). Node is on GitHub's runners.
      - name: Install Playwright MCP (agent eval baseline)
        run: npm ci --prefix evals/agent/node

      - name: Run tests (${{ matrix.group }})
        run: uv run pytest ${{ matrix.args }} -v

  # Fails when the groups above together collect fewer tests than the whole
  # suite, so a new test file no group names is noticed (Q-01).
  groups:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.32"

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Every test is in a group
        run: uv run python scripts/ci_groups_check.py

  # The one check to require: passes when the heavy jobs passed or were
  # skipped for a docs-only change, fails when any failed or was cancelled.
  ci:
    name: CI
    needs: [changes, lint, test, groups]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the jobs
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
